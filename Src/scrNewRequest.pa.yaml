Screens:
  scrNewRequest:
    Properties:
      Fill: =nfColor.Canvas
      OnVisible: |-
        =Reset(txtNrqTitle);
        Reset(txtNrqDescription);
        Reset(txtNrqLinks);
        Reset(cmbNrqPoc);
        Reset(drpNrqProcessing);
        Reset(drpNrqDepartment);
        Reset(drpNrqPriority);
        Reset(dtpNrqDue);
        Reset(cmpNrqUpload);
        Reset(cmpNrqEditWorkflow);
        Clear(colNrqWfSnapPhases);
        Clear(colNrqWfSnapWorkers);
        UpdateContext({ locNrqStep: 1, locNrqTried: false });
        UpdateContext({ locNrqCategoryKey: "" });
        UpdateContext({ locNrqPocName: "" });
        UpdateContext({ locNrqPocEmail: "" });
        UpdateContext({ locNrqWfOpen: false });
        UpdateContext({ locNrqWfLoaded: false })
        // THE RESETS ARE THE POINT OF THIS BLOCK, and their absence was a real
        // defect: leaving the wizard and coming back showed every previous
        // answer still sitting there.
        //
        // A CONTEXT VARIABLE IS NOT THE FORM. Nine of the eleven answers on this
        // wizard live on their CONTROLS, read as txtNrqTitle.Text and the like,
        // and a control keeps its value across navigation. Clearing the six
        // context variables therefore reset the step number and the category
        // highlight while leaving the title, the description, the links, the
        // three dropdowns, the date, the staged files and the whole workflow
        // draft exactly as the last person left them. The wizard LOOKED reset
        // because step 1 was showing.
        //
        // Reset() RETURNS EACH CONTROL TO ITS Default, which is why
        // drpNrqPriority comes back to Medium rather than to blank.
        //
        // Reset(cmpNrqEditWorkflow) IS NOT OPTIONAL AND IS NOT COSMETIC. The
        // workflow draft lives in colWfDraftPhases and colWfDraftWorkers, which
        // are APP scope, so nothing about leaving this screen clears them. The
        // component's own OnReset clears both plus _cmpWfNextId, _cmpWfDirty,
        // _cmpWfSeedKey and the expanded phase, which is the whole of its state.
        //
        // Reset(cmpNrqUpload) drops the staged files. That is safe HERE and only
        // here: this is a brand new request, so there is no pending write whose
        // only copy those files are.
        //
        // A context variable is only recognised on a screen that SETS it, so the
        // UpdateContext block is the declaration as much as the initialisation.
        // See house-rules section 9. Do not move any of it to App.OnStart.
    Children:
      - conNrqRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingLeft: =If(nfIsDesktop, conNrqNavHost.Width, 0)
            Width: =Parent.Width
          Children:
            - conNrqMiddle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conNrqRight:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conNrqTopBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderStyle: =If(nfIsMobile, BorderStyle.None, BorderStyle.Solid)
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =If(nfIsMobile, nfColor.Transparent, nfColor.Surface)
                              FillPortions: =0
                              Height: =nfHeights.topBar
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(nfIsMobile, nfSpace.Sm, nfSpace.Md)
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMaxHeight: =nfHeights.topBar
                              LayoutMinHeight: =nfHeights.topBar
                              LayoutMinWidth: =0
                              PaddingRight: =If(nfIsMobile, nfSpace.Md, nfSpace.Xxl)
                            Children:
                              - conNrqTitleGroup:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =2.5
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmpNrqCrumbs:
                                        Control: CanvasComponent
                                        ComponentName: cmpBreadcrumbs
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          CharWidths: =nfCharWidths
                                          Config: |-
                                            ={
                                                Theme: If(nfIsDark, "dark", "light"),
                                                SeparatorIcon: "chevron",
                                                Gap: 4,
                                                Size: nfType.ChromeTitle,
                                                MaxItems: 4,
                                                ItemsBeforeCollapse: 1,
                                                ItemsAfterCollapse: 2,
                                                ActiveLastItem: false,
                                                BackButton: false
                                            }
                                          CurrentColor: |-
                                            =If(
                                                nfIsDark,
                                                "#F1F5F9",
                                                "#1E293B"
                                            )
                                          Height: =nfHeights.breadcrumb
                                          Icons: =nfBreadcrumbIcons
                                          Items: |-
                                            =Table(
                                                { id: "home", label: "Home" },
                                                { id: "new", label: "New request" }
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LinkColor: |-
                                            =If(
                                                nfIsDark,
                                                "#94A3B8",
                                                "#64748B"
                                            )
                                          OnBack: =false
                                          OnSelect: |-
                                            =If(
                                                Self.SelectedItem.id = "home",
                                                Navigate(scrHome, ScreenTransition.None)
                                            )
                                          Width: =Parent.Width
                              - cmpNrqBell:
                                  Control: CanvasComponent
                                  ComponentName: Badge
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BadgeColor: =nfColor.DangerSolid
                                    BadgeCount: =0
                                    HasNotifications: =false
                                    Height: =Self.Size
                                    HoverText: ="Notifications"
                                    IconColor: =""
                                    IconSvg: =""
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =false
                                      // INERT ON PURPOSE. Same reason as scrHome: CLAUDE.md
                                      // open question 2 is unresolved and colAudit is the wrong
                                      // shape. Do NOT bind this to colAudit.
                                    Size: =If(nfIsMobile, 32, 35)
                                    Theme: =nfThemeName
                                    Width: =Self.Size
                              - conNrqAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Primary
                                    FillPortions: =0
                                    Height: =nfHeights.avatar
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =nfHeights.avatar / 2
                                    RadiusBottomRight: =nfHeights.avatar / 2
                                    RadiusTopLeft: =nfHeights.avatar / 2
                                    RadiusTopRight: =nfHeights.avatar / 2
                                    Width: =nfHeights.avatar
                                  Children:
                                    - lblNrqInitials:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          Color: =nfColor.TextOnPrimary
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =nfType.Initials
                                          Text: =nfInitials
                                          Width: =Parent.Width
                                          Wrap: =false
                        - conNrqGutter:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Canvas
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =nfSpace.Xxl
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =nfSpace.Xxl
                              PaddingLeft: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingRight: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingTop: =nfSpace.Xxl
                              Width: =Parent.Width
                            Children:
                              - conNrqHeader:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =0
                                    Height: |-
                                      =lblNrqPageTitle.Height
                                      + lblNrqPageSub.Height
                                      + Self.LayoutGap
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =nfSpace.Xxs
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - lblNrqPageTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =nfColor.TextStrong
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =If(nfIsDesktop, nfType.PageTitle, 20)
                                          Text: ="New request"
                                          Wrap: =false
                                    - lblNrqPageSub:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =nfColor.TextMuted
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =nfType.Body
                                          Text: ="Five steps. Nothing is saved until the last one."
                                          VerticalAlign: =VerticalAlign.Top
                                          Wrap: =false
                              - cmpNrqStepper:
                                  Control: CanvasComponent
                                  ComponentName: cmpStepper
                                  Properties:
                                    AccentColor: =nfColor.Primary
                                    AlignInContainer: =AlignInContainer.Center
                                    CheckIcon: =Blank()
                                    ClickableSteps: ="Completed"
                                    CurrentStep: =locNrqStep
                                    Density: ="Full"
                                    Height: |-
                                      =If(
                                          Self.Type = "Bar",
                                          Switch(Self.Size, "Small", 4, "Medium", 6, "Large", 8, 6),
                                          If(
                                              Self.Density = "Full",
                                              Switch(Self.Size, "Small", 60, "Medium", 72, "Large", 86, 72),
                                              Switch(Self.Size, "Small", 26, "Medium", 32, "Large", 40, 32)
                                          )
                                      )
                                      // REPRODUCED FROM THE COMPONENT'S OWN Height, not measured
                                      // and hardcoded. house-rules section 5: a component that
                                      // computes its own size still has to be sized by the
                                      // consumer, and a literal goes stale the first time Size or
                                      // Density changes. Self.Size and Self.Density are inputs, so
                                      // reading them here is not circular.
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnStepSelect: |-
                                      =UpdateContext({ locNrqStep: Self.SelectedStep, locNrqTried: false })
                                      // ClickableSteps is "Completed", so this only ever moves
                                      // BACKWARD. Forward movement goes through the Next button
                                      // and its gate. That is why nothing is re-validated here.
                                    Size: ="Medium"
                                    StepLabels: |-
                                      =Table(
                                          { Label: "Category" },
                                          { Label: "Basic info" },
                                          { Label: "Documents" },
                                          { Label: "Workflow" },
                                          { Label: "Review" }
                                      )
                                    Theme: =nfThemeName
                                    Type: ="Step"
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                              - conNrqStepHost:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =0
                                    Height: |-
                                      =Switch(
                                          locNrqStep,
                                          1, conNrqStep1.Height,
                                          2, conNrqStep2.Height,
                                          3, conNrqStep3.Height,
                                          4, conNrqStep4.Height,
                                          5, conNrqStep5.Height,
                                          conNrqStep1.Height
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conNrqStep1:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =nfColor.Border
                                          BorderThickness: =nfSize.Border
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Surface
                                          FillPortions: =0
                                          Height: |-
                                            =lblNrqS1Title.Height
                                            + lblNrqS1Sub.Height
                                            + galNrqCategories.Height
                                            + 2 * Self.LayoutGap
                                            + Self.PaddingTop
                                            + Self.PaddingBottom
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Md
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =nfSpace.Xxl
                                          PaddingLeft: =nfSpace.Xxl
                                          PaddingRight: =nfSpace.Xxl
                                          PaddingTop: =nfSpace.Xxl
                                          RadiusBottomLeft: =nfRadius.Lg
                                          RadiusBottomRight: =nfRadius.Lg
                                          RadiusTopLeft: =nfRadius.Lg
                                          RadiusTopRight: =nfRadius.Lg
                                          Visible: =locNrqStep = 1
                                        Children:
                                          - lblNrqS1Title:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextStrong
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.CardTitle
                                                Text: ="What kind of request is this?"
                                                Wrap: =false
                                          - lblNrqS1Sub:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextMuted
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.Small
                                                Text: ="The category decides which workflow template the request starts from."
                                                VerticalAlign: =VerticalAlign.Top
                                          - galNrqCategories:
                                              Control: Gallery@2.15.0
                                              Variant: Vertical
                                              Properties:
                                                AccessibleLabel: ="Request categories"
                                                FillPortions: =0
                                                Height: |-
                                                  =RoundUp(CountRows(nfCategories) / If(nfIsMobile, 1, 2), 0)
                                                  * (Self.TemplateHeight + Self.TemplatePadding)
                                                  // CountRows(colCategories), NOT Self.AllItemsCount.
                                                  // A gallery Height reading its own AllItemsCount is
                                                  // circular and settles at about one pixel per row.
                                                  // Recorded as PAL009 against five galleries already
                                                  // in this repo. The collection is the same length
                                                  // and is not circular.
                                                  //
                                                  // DELEGATION: none here. colCategories is in memory,
                                                  // seeded in App.OnStart from colConfig filtered on
                                                  // ConfigType. The delegation question for this data
                                                  // was answered at that seed, not on this screen.
                                                Items: =Sort(nfCategories, SortOrder)
                                                LayoutMinHeight: =0
                                                LoadingSpinner: =LoadingSpinner.None
                                                ShowScrollbar: =false
                                                TabIndex: =0
                                                TemplatePadding: =nfSpace.Md
                                                TemplateSize: |-
                                                  =112
                                                  // 112, NOT 96. A literal because a tile height is not a
                                                  // spacing rung and forcing it into one would resize the
                                                  // tile to make the token table tidy. 96 left the second
                                                  // line nowhere to go, so the description clipped.
                                                  // TemplateSize cannot reference ThisItem and must stay
                                                  // constant, so it cannot be derived from the text.
                                                WrapCount: =If(nfIsMobile, 1, 2)
                                              Children:
                                                - conNrqCatTile:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      BorderColor: |-
                                                        =If(
                                                            locNrqCategoryKey = ThisItem.ConfigKey,
                                                            nfColor.Primary,
                                                            nfColor.BorderStrong
                                                        )
                                                        // BorderStrong, NOT Border. These tiles sit on a Surface
                                                        // card, and slate-200 on white is very nearly invisible.
                                                      BorderThickness: |-
                                                        =If(
                                                            locNrqCategoryKey = ThisItem.ConfigKey,
                                                            2,
                                                            nfSize.Border
                                                        )
                                                      DropShadow: =DropShadow.None
                                                      Fill: |-
                                                        =If(
                                                            locNrqCategoryKey = ThisItem.ConfigKey,
                                                            nfColor.PrimarySoft,
                                                            nfColor.Canvas
                                                        )
                                                        // Canvas, NOT Surface. An unselected tile was Surface white
                                                        // on a Surface white card with a slate-200 border, so the
                                                        // tile had no visible edge at all and the card read as an
                                                        // empty white area with letters floating in it.
                                                      Height: =Parent.TemplateHeight
                                                      RadiusBottomLeft: =nfRadius.Md
                                                      RadiusBottomRight: =nfRadius.Md
                                                      RadiusTopLeft: =nfRadius.Md
                                                      RadiusTopRight: =nfRadius.Md
                                                      Width: =Parent.TemplateWidth
                                                    Children:
                                                      - conNrqCatBadge:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: ManualLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            Fill: |-
                                                              =Switch(
                                                                  Mod(ThisItem.SortOrder - 1, 4),
                                                                  0, nfColor.Primary,
                                                                  1, nfColor.GroupText,
                                                                  2, nfColor.WarnText,
                                                                  nfColor.SuccessText
                                                              )
                                                              // SOLID, NOT A PASTEL PLATE. The design draws a pastel
                                                              // plate with a coloured glyph. That was built and it
                                                              // failed: the tile Fill is nfColor.Canvas and
                                                              // PrimarySoft is the same lightness, so the plate
                                                              // disappeared and only the letter showed. Do not
                                                              // "fix" it back to a soft fill.
                                                              //
                                                              // Mod so a fifth category wraps round rather than
                                                              // sticking on the default arm forever.
                                                              //
                                                              // THESE ARE TEXT TOKENS USED AS FILLS. WarnSolid and
                                                              // SuccessSolid do exist, but they are the 500 rung and
                                                              // too light to carry a glyph; the 700 rung reads
                                                              // properly. There is no GroupSolid at all. If the
                                                              // palette ever gains a plate ramp, swap these four for
                                                              // it rather than adding more Text tokens as fills.
                                                            Height: =nfSize.IconTile
                                                            RadiusBottomLeft: =nfRadius.Md
                                                            RadiusBottomRight: =nfRadius.Md
                                                            RadiusTopLeft: =nfRadius.Md
                                                            RadiusTopRight: =nfRadius.Md
                                                            Width: =nfSize.IconTile
                                                            X: =nfSpace.Lg
                                                            Y: =nfSpace.Lg
                                                          Children:
                                                            - lblNrqCatLetter:
                                                                Control: ModernText@1.0.0
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  Align: =Align.Center
                                                                  Color: |-
                                                                    =If(nfIsDark, nfColor.Canvas, nfColor.TextOnPrimary)
                                                                    // THE GLYPH FOLLOWS THE THEME BECAUSE THE PLATE
                                                                    // DOES. Three of the four hue tokens INVERT on
                                                                    // dark: WarnText goes amber-700 to amber-300,
                                                                    // SuccessText green-700 to green-300, GroupText
                                                                    // purple-600 to purple-300. A fixed white glyph
                                                                    // is legible on all four in light and vanishes
                                                                    // on three of them in dark.
                                                                    //
                                                                    // Checked against nfColorDark rather than
                                                                    // assumed: a token named Text is not promised to
                                                                    // stay dark, and these do not.
                                                                  FontWeight: =FontWeight.Bold
                                                                  Height: =Parent.Height
                                                                  Size: =nfType.Subhead
                                                                  Text: =Upper(Left(ThisItem.Title, 1))
                                                                  Width: =Parent.Width
                                                                  Wrap: =false
                                                      - lblNrqCatTitle:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            FontWeight: =FontWeight.Semibold
                                                            Size: =nfType.Body
                                                            Text: =ThisItem.Title
                                                            Width: =Parent.Width - (nfSpace.Lg + nfSize.IconTile + nfSpace.Md) - nfSpace.Lg
                                                            Wrap: =false
                                                            X: =nfSpace.Lg + nfSize.IconTile + nfSpace.Md
                                                            Y: =nfSpace.Lg
                                                      - lblNrqCatTemplate:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextMuted
                                                            Size: =nfType.Caption
                                                            Text: |-
                                                              =With(
                                                                  { _t: LookUp(colTemplates, TemplateKey = ThisItem.DefaultTemplateKey) },
                                                                  If(
                                                                      IsBlank(_t.TemplateKey),
                                                                      "No default workflow",
                                                                      _t.Title
                                                                      & "   -   "
                                                                      & CountRows(Table(ParseJSON(_t.DefinitionJson).phases))
                                                                      & " phases"
                                                                  )
                                                              )
                                                              // NAMED IN WORDS ON A MISS, not left blank. house-rules
                                                              // section 5: a lookup with a fallback turns a wiring
                                                              // error into an invisible one. A category whose
                                                              // DefaultTemplateKey matches no template is a config
                                                              // defect somebody has to see.
                                                              //
                                                              // THE MISS IS TESTED ON TemplateKey, NOT ON Title.
                                                              // Coalesce on .Title reported a template that exists
                                                              // with a blank name as missing, which hides one config
                                                              // defect behind the message meant to surface a
                                                              // different one. TemplateKey is blank only when the
                                                              // LookUp actually found nothing.
                                                              //
                                                              // THE PHASE COUNT IS DERIVED FROM THE PAYLOAD, the same
                                                              // expression the template combo box uses for its own
                                                              // labels, so the tile and the workflow cannot disagree
                                                              // about how many phases a category starts with.
                                                              //
                                                              // ONE ParseJSON PER TILE PER RENDER is fine at this row
                                                              // count. If colCategories ever grows past a screenful,
                                                              // project the count once in App.OnStart instead of
                                                              // parsing per row.
                                                            Width: =Parent.Width - (nfSpace.Lg + nfSize.IconTile + nfSpace.Md) - nfSpace.Lg
                                                            Wrap: |-
                                                              =true
                                                              // WRAPS ONTO THE SECOND LINE THE TALLER TILE BOUGHT.
                                                              // With Wrap false this clipped mid-word on the
                                                              // narrower desktop column.
                                                            X: =nfSpace.Lg + nfSize.IconTile + nfSpace.Md
                                                            Y: |-
                                                              =lblNrqCatTitle.Y + lblNrqCatTitle.Height + nfSpace.Xxs
                                                              // MEASURED FROM THE TITLE, which is declared EARLIER.
                                                              // That asymmetry is deliberate: a backward reference
                                                              // resolves, and a control reading a sibling declared
                                                              // LATER is a forward reference that Studio drops on
                                                              // paste in silence. The title keeps a fixed Y for the
                                                              // same reason, so nothing in this tile reads forward.
                                                      - btnNrqCatSelect:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            BorderStyle: |-
                                                              =BorderStyle.None
                                                              // NO RESTING BORDER. The tile underneath already draws
                                                              // one, and the overlay's own border doubled it.
                                                              //
                                                              // FocusedBorderThickness SURVIVES THIS and is why the
                                                              // control is still keyboard visible: BorderStyle governs
                                                              // the resting border only. Do not drop that property to
                                                              // tidy up, or this becomes a focusable control with no
                                                              // focus indicator.
                                                            Fill: =nfColor.Transparent
                                                            FocusedBorderThickness: =2
                                                            Height: =Parent.Height
                                                            HoverFill: =nfColor.Transparent
                                                            OnSelect: |-
                                                              =If(
                                                                  locNrqCategoryKey <> ThisItem.ConfigKey,
                                                                  UpdateContext({ locNrqWfLoaded: false })
                                                              );
                                                              UpdateContext({ locNrqCategoryKey: ThisItem.ConfigKey })
                                                              // CHANGING CATEGORY INVALIDATES THE LOADED WORKFLOW.
                                                              // locNrqWfLoaded latches true the first time step 4 is
                                                              // reached, so without this reset a category change would
                                                              // leave the PREVIOUS category's template standing while
                                                              // step 1 and step 5 both showed the new category.
                                                            PressedFill: =nfColor.Transparent
                                                            Text: =""
                                                            Tooltip: |-
                                                              =ThisItem.Title
                                                              & ", starts from "
                                                              & Coalesce(
                                                                  LookUp(
                                                                      colTemplates,
                                                                      TemplateKey = ThisItem.DefaultTemplateKey
                                                                  ).Title,
                                                                  "no default workflow"
                                                              )
                                                              // THE TOOLTIP IS THE WHOLE ACCESSIBLE AFFORDANCE HERE.
                                                              // Classic/Button has no AccessibleLabel and Studio
                                                              // rejects it with PA2108, so this is the only place the
                                                              // tile can name itself to a screen reader.
                                                              //
                                                              // The three labels inside the tile deliberately carry
                                                              // NO AccessibleLabel: adding them would announce the
                                                              // category name three times before reaching anything
                                                              // actionable.
                                                            Width: =Parent.Width
                                    - conNrqStep2:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =nfColor.Border
                                          BorderThickness: =nfSize.Border
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Surface
                                          FillPortions: =0
                                          Height: |-
                                            =lblNrqS2Title.Height
                                            + lblNrqS2Sub.Height
                                            + conNrqS2Fields.Height
                                            + 2 * Self.LayoutGap
                                            + Self.PaddingTop
                                            + Self.PaddingBottom
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Md
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =nfSpace.Xxl
                                          PaddingLeft: =nfSpace.Xxl
                                          PaddingRight: =nfSpace.Xxl
                                          PaddingTop: =nfSpace.Xxl
                                          RadiusBottomLeft: =nfRadius.Lg
                                          RadiusBottomRight: =nfRadius.Lg
                                          RadiusTopLeft: =nfRadius.Lg
                                          RadiusTopRight: =nfRadius.Lg
                                          Visible: =locNrqStep = 2
                                        Children:
                                          - lblNrqS2Title:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextStrong
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.CardTitle
                                                Text: ="Request details"
                                                Wrap: =false
                                          - lblNrqS2Sub:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextMuted
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.Small
                                                Text: ="Fields marked required must be filled before you can continue."
                                                VerticalAlign: =VerticalAlign.Top
                                          - conNrqS2Fields:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                FillPortions: =0
                                                Height: |-
                                                  =conNrqFTitle.Height
                                                  + conNrqFPoc.Height
                                                  + conNrqFProc.Height
                                                  + conNrqFDept.Height
                                                  + conNrqFPriority.Height
                                                  + conNrqFDue.Height
                                                  + conNrqFDesc.Height
                                                  + conNrqFLinks.Height
                                                  + 7 * Self.LayoutGap
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =nfSpace.Lg
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conNrqFTitle:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFTitleLbl.Height
                                                        + nfSize.Row
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFTitleLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Title, required"
                                                            Wrap: =false
                                                      - txtNrqTitle:
                                                          Control: ModernTextInput@1.1.1
                                                          Properties:
                                                            AccessibleLabel: ="Request title"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Height: =nfSize.Row
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            MaxLength: =255
                                                            Placeholder: ="Short name for this request"
                                                            Size: =nfType.Body
                                                            ValidationState: |-
                                                              =If(
                                                                  IsBlank(Trim(Self.Text)),
                                                                  ValidationState.Error,
                                                                  ValidationState.None
                                                              )
                                                - conNrqFPoc:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFPocLbl.Height
                                                        + lblNrqPocCurrent.Height
                                                        + nfSize.Row
                                                        + 2 * Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFPocLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Primary point of contact, required"
                                                            Wrap: =false
                                                      - lblNrqPocCurrent:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextMuted
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Micro
                                                            Text: |-
                                                              =If(
                                                                  IsBlank(locNrqPocEmail),
                                                                  "Nobody chosen yet.",
                                                                  "Chosen: " & locNrqPocName & ", " & locNrqPocEmail
                                                              )
                                                              // KEPT AFTER THE MOVE TO ModernCombobox, and the reason
                                                              // got stronger rather than weaker. Once the search text
                                                              // clears, Items reverts to nfDirectory, and nfDirectory
                                                              // is only the first 200 people in the tenant. If the
                                                              // chosen person is not in that slice the input can read
                                                              // as empty while the selection is perfectly intact.
                                                              //
                                                              // Same insurance the current-assignee line gives in the
                                                              // Add Worker panel.
                                                            VerticalAlign: =VerticalAlign.Top
                                                            Wrap: =false
                                                      - cmbNrqPoc:
                                                          Control: ModernCombobox@1.1.1
                                                          Properties:
                                                            AccessibleLabel: ="Primary point of contact"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            DefaultSelectedItems: =[]
                                                            DelayOutput: |-
                                                              =true
                                                              // NOT OPTIONAL. Items reads Self.SearchText, so without
                                                              // this the property re-evaluates on every keystroke and
                                                              // fires one connector call per character against a
                                                              // throttle that is per user per connection.
                                                            Height: =nfSize.Row
                                                            InputTextPlaceholder: ="Type a name or email"
                                                            ItemDisplayText: |-
                                                              =ThisItem.DisplayName
                                                              & "   -   "
                                                              & ThisItem.Mail
                                                            Items: |-
                                                              =If(
                                                                  IsBlank(Trim(Self.SearchText)),
                                                                  nfDirectory,
                                                                  nfDirectory
                                                              )
                                                              // SUGGESTIONS WHEN IDLE, DIRECTORY WHEN TYPING. An
                                                              // untouched picker opens from nfDirectory with no
                                                              // connector call at all, and the live search runs only
                                                              // once somebody types. Same pattern the Send Email
                                                              // dialog on Details already runs.
                                                              //
                                                              // BOTH ARMS AGREE ON THE COLUMNS THIS SCREEN READS.
                                                              // nfDirectory is ShowColumns'd to DisplayName, Mail and
                                                              // JobTitle in App.OnStart, and SearchUser returns a
                                                              // superset. ItemDisplayText and OnChange read only
                                                              // DisplayName and Mail, which are in both.
                                                              //
                                                              // nfDirectory IS BOUNDED AT top: 200 and is therefore
                                                              // not a search. That is why the typed arm exists at all.
                                                              //
                                                              // Self.SearchText, not the instance name: both resolve,
                                                              // Self survives a rename.
                                                              //
                                                              // Office365Users is STANDARD, so this stays off premium.
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            OnChange: |-
                                                              =If(
                                                                  !IsBlank(Self.Selected.Mail),
                                                                  UpdateContext({ locNrqPocName: Self.Selected.DisplayName });
                                                                  UpdateContext({ locNrqPocEmail: Lower(Self.Selected.Mail) })
                                                              )
                                                            SelectMultiple: |-
                                                              =false
                                                              // WRITTEN OUT because the modern default is true, unlike
                                                              // the classic combo box this replaced.
                                                            Size: =nfType.Small
                                                            ValidationState: |-
                                                              =If(
                                                                  IsBlank(locNrqPocEmail),
                                                                  ValidationState.Error,
                                                                  ValidationState.None
                                                              )
                                                - conNrqFProc:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFProcLbl.Height
                                                        + nfSize.Row
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFProcLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Processing type, required"
                                                            Wrap: =false
                                                      - drpNrqProcessing:
                                                          Control: ModernDropdown@1.0.2
                                                          Properties:
                                                            AccessibleLabel: ="Processing type"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Height: =nfSize.Row
                                                            ItemDisplayText: =ThisItem.Title
                                                            Items: =Sort(nfProcessingTypes, SortOrder)
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
                                                            ValidationState: |-
                                                              =If(
                                                                  IsBlank(Self.Selected.ConfigKey),
                                                                  ValidationState.Error,
                                                                  ValidationState.None
                                                              )
                                                - conNrqFDept:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFDeptLbl.Height
                                                        + nfSize.Row
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFDeptLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Department, required"
                                                            Wrap: =false
                                                      - drpNrqDepartment:
                                                          Control: ModernDropdown@1.0.2
                                                          Properties:
                                                            AccessibleLabel: ="Department"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Height: =nfSize.Row
                                                            ItemDisplayText: =ThisItem.Title
                                                            Items: =Sort(nfDepartments, SortOrder)
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
                                                            ValidationState: |-
                                                              =If(
                                                                  IsBlank(Self.Selected.ConfigKey),
                                                                  ValidationState.Error,
                                                                  ValidationState.None
                                                              )
                                                - conNrqFPriority:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFPriorityLbl.Height
                                                        + nfSize.Row
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFPriorityLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Priority"
                                                            Wrap: =false
                                                      - drpNrqPriority:
                                                          Control: ModernDropdown@1.0.2
                                                          Properties:
                                                            AccessibleLabel: ="Priority"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Default: |-
                                                              =LookUp(nfPriorityTable, PriorityKey = "Medium")
                                                              // A RECORD FROM Items, because ModernDropdown.Default is
                                                              // typed Record and a bare key selects nothing.
                                                              //
                                                              // PRIORITY IS THE ONLY STEP 2 FIELD OUTSIDE THE GATE, so
                                                              // without a default a blank PriorityKey reaches the
                                                              // create payload. Medium is the neutral rung.
                                                            Height: =nfSize.Row
                                                            ItemDisplayText: =ThisItem.Title
                                                            Items: =Sort(nfPriorityTable, SortOrder)
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
                                                - conNrqFDue:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFDueLbl.Height
                                                        + nfSize.Row
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFDueLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Needed by, required"
                                                            Wrap: =false
                                                      - dtpNrqDue:
                                                          Control: ModernDatePicker@1.0.1
                                                          Properties:
                                                            AccessibleLabel: ="Date the request is needed by"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Format: =DatePickerFormat.Short
                                                            Height: =nfSize.Row
                                                            IsEditable: =true
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Placeholder: ="Pick a date"
                                                            Size: =nfType.Body
                                                            StartDate: =nfToday
                                                            StartOfWeek: =StartOfWeek.Monday
                                                            ValidationState: |-
                                                              =If(
                                                                  IsBlank(Self.SelectedDate),
                                                                  ValidationState.Error,
                                                                  ValidationState.None
                                                              )
                                                - conNrqFDesc:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFDescLbl.Height
                                                        + txtNrqDescription.Height
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFDescLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Description"
                                                            Wrap: =false
                                                      - txtNrqDescription:
                                                          Control: ModernTextInput@1.1.1
                                                          Properties:
                                                            AccessibleLabel: ="Request description"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Height: =112
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            MaxLength: =2000
                                                            Placeholder: ="What is being asked for, and why"
                                                            Size: =nfType.Body
                                                            Type: =TextInputType.Multiline
                                                - conNrqFLinks:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =lblNrqFLinksLbl.Height
                                                        + nfSize.Row
                                                        + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqFLinksLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextBody
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Reference links"
                                                            Wrap: =false
                                                      - txtNrqLinks:
                                                          Control: ModernTextInput@1.1.1
                                                          Properties:
                                                            AccessibleLabel: ="Reference links"
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Color: =nfColor.TextStrong
                                                            Height: =nfSize.Row
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            MaxLength: =500
                                                            Placeholder: ="One or more links, separated by a semicolon"
                                                            Size: =nfType.Body
                                    - conNrqStep3:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =nfColor.Border
                                          BorderThickness: =nfSize.Border
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Surface
                                          FillPortions: =0
                                          Height: |-
                                            =lblNrqS3Title.Height
                                            + lblNrqS3Sub.Height
                                            + cmpNrqUpload.Height
                                            + 2 * Self.LayoutGap
                                            + Self.PaddingTop
                                            + Self.PaddingBottom
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Md
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =nfSpace.Xxl
                                          PaddingLeft: =nfSpace.Xxl
                                          PaddingRight: =nfSpace.Xxl
                                          PaddingTop: =nfSpace.Xxl
                                          RadiusBottomLeft: =nfRadius.Lg
                                          RadiusBottomRight: =nfRadius.Lg
                                          RadiusTopLeft: =nfRadius.Lg
                                          RadiusTopRight: =nfRadius.Lg
                                          Visible: =locNrqStep = 3
                                        Children:
                                          - lblNrqS3Title:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextStrong
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.CardTitle
                                                Text: ="Supporting documents"
                                                Wrap: =false
                                          - lblNrqS3Sub:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextMuted
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.Small
                                                Text: ="Optional. Files stage here and upload when the request is created."
                                                VerticalAlign: =VerticalAlign.Top
                                          - cmpNrqUpload:
                                              Control: CanvasComponent
                                              ComponentName: cmpFileUpload
                                              Properties:
                                                AcceptedText: ="PDF, DOC, XLSX, PNG"
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AllowDelete: =true
                                                AllowUpload: |-
                                                  =true
                                                  // AllowUpload AND AllowDelete, NOT ShowUpload AND ReadOnly.
                                                  // THREE VERSIONS OF THIS COMPONENT EXIST and they do not
                                                  // share a property list:
                                                  //   catalog copy   four properties, no outputs at all
                                                  //   repo copy      ReadOnly, ShowUpload
                                                  //   LIVE APP       AllowDelete, AllowUpload, StagedFilesData
                                                  // These names are the LIVE ones, confirmed by exporting the
                                                  // solution. This screen was first written against the repo
                                                  // copy, and those two properties do not exist on the control
                                                  // that will actually run.
                                                Colors: |-
                                                  ={
                                                      Surface:    nfColor.Surface,
                                                      RowFill:    nfColor.Surface,
                                                      RowBorder:  nfColor.Border,
                                                      DropFill:   nfColor.Canvas,
                                                      DropBorder: nfColor.BorderStrong,
                                                      Text:       nfColor.TextStrong,
                                                      Muted:      nfColor.TextMuted,
                                                      Faint:      nfColor.TextFaint,
                                                      Accent:     nfColor.Primary,
                                                      Danger:     nfColor.DangerSolid
                                                  }
                                                  // ALL TEN KEYS, and passed rather than inherited. A
                                                  // Record input's Default does not survive a paste, and
                                                  // a missing key resolves blank and paints nothing with
                                                  // no error. house-rules section 5.
                                                HeaderText: |-
                                                  =""
                                                  // BLANK AND EXPLICIT. ShowHeader is false so nothing
                                                  // renders it, but an omitted component input is
                                                  // materialised EMPTY on the next round trip, and an
                                                  // empty value overrides the Default with nothing
                                                  // rather than inheriting it.
                                                Height: =Self.DesiredHeight
                                                Items: |-
                                                  =FirstN(
                                                      Table(
                                                          {
                                                              Id: "",
                                                              Name: "",
                                                              SizeBytes: 0,
                                                              UploadedOn: nfToday,
                                                              UploadedBy: "",
                                                              Ext: ""
                                                          }
                                                      ),
                                                      0
                                                  )
                                                  // TYPED EMPTY TABLE. A brand new request has no existing
                                                  // documents, and Items is the EXISTING list, not the
                                                  // staged one. FirstN rather than Filter(..., false):
                                                  // both are correct but Filter warns once per instance
                                                  // that the predicate is a literal. house-rules s7.
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                MaxFileSize: =25
                                                MaxFiles: =10
                                                OnCancel: =false
                                                OnDelete: =false
                                                OnDownload: =false
                                                OnDownloadAll: =false
                                                OnSave: |-
                                                  =Notify(
                                                      "Files are staged. They upload when you create the request.",
                                                      NotificationType.Information
                                                  )
                                                  // MARKED CALL SITE 1 OF 2. DO NOT GUESS A SIGNATURE.
                                                  //
                                                  // Staged files cannot be written yet, and the reason is
                                                  // ordering rather than a missing connector: the library
                                                  // folder is created by Flow from RequestKey, and
                                                  // RequestKey is minted from the SharePoint item Id AFTER
                                                  // insert. There is no folder to upload into until the
                                                  // request exists. See CLAUDE.md, Flows.
                                                  //
                                                  // The component deliberately keeps StagedFiles after
                                                  // OnSave, so the Create handler below is where they get
                                                  // sent. Reset(cmpNrqUpload) belongs there, on success
                                                  // only, and nowhere else.
                                                OnView: =false
                                                ShowFooter: =true
                                                ShowHeader: =false
                                                ShowRowActions: =true
                                                Style: |-
                                                  ={
                                                      DropHeight:   168,
                                                      RowHeight:    72,
                                                      TileSize:     48,
                                                      ActionSize:   32,
                                                      Gap:          nfSpace.Md,
                                                      StackGap:     nfSpace.Md,
                                                      Radius:       nfRadius.Md,
                                                      HeaderSize:   nfType.ChromeTitle,
                                                      NameSize:     nfType.Body,
                                                      MetaSize:     nfType.Caption,
                                                      TileTextSize: nfType.Micro
                                                  }
                                                TypeColors: |-
                                                  =Table(
                                                      { Ext: "pdf",     Fill: nfColor.DangerFill,  Text: nfColor.DangerText },
                                                      { Ext: "xlsx",    Fill: nfColor.SuccessFill, Text: nfColor.SuccessText },
                                                      { Ext: "xls",     Fill: nfColor.SuccessFill, Text: nfColor.SuccessText },
                                                      { Ext: "docx",    Fill: nfColor.PrimarySoft, Text: nfColor.PrimaryHover },
                                                      { Ext: "doc",     Fill: nfColor.PrimarySoft, Text: nfColor.PrimaryHover },
                                                      { Ext: "png",     Fill: nfColor.GroupFill,   Text: nfColor.GroupText },
                                                      { Ext: "jpg",     Fill: nfColor.GroupFill,   Text: nfColor.GroupText },
                                                      { Ext: "default", Fill: nfColor.NeutralFill, Text: nfColor.NeutralText }
                                                  )
