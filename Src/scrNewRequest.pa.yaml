                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Reference links"
                                                            Wrap: =false
                                                      - lblNrqRvLinksVal:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
