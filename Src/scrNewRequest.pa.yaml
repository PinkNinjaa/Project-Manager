                                                              =If(
                                                                  IsBlank(Trim(txtNrqLinks.Text)),
                                                                  "Not entered",
                                                                  Trim(txtNrqLinks.Text)
                                                              )
                                                            VerticalAlign: =VerticalAlign.Top
                                                - conNrqRvDocs:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: =lblNrqRvDocsLbl.Height + lblNrqRvDocsVal.Height + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xxs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqRvDocsLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextFaint
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Documents"
                                                            Wrap: =false
                                                      - lblNrqRvDocsVal:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
                                                            Text: |-
                                                              =If(
                                                                  cmpNrqUpload.StagedCount = 0,
                                                                  "None attached",
                                                                  cmpNrqUpload.StagedCount
                                                                  & If(cmpNrqUpload.StagedCount = 1, " file staged", " files staged")
                                                              )
                                                            VerticalAlign: =VerticalAlign.Top
                                                - conNrqRvWorkflow:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: =lblNrqRvWorkflowLbl.Height + lblNrqRvWorkflowVal.Height + Self.LayoutGap
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xxs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblNrqRvWorkflowLbl:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextFaint
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: ="Workflow"
                                                            Wrap: =false
                                                      - lblNrqRvWorkflowVal:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
                                                            Text: |-
                                                              =CountRows(cmpNrqEditWorkflow.DraftPhases)
                                                              & If(CountRows(cmpNrqEditWorkflow.DraftPhases) = 1, " phase, ", " phases, ")
                                                              & CountRows(cmpNrqEditWorkflow.DraftWorkers)
                                                              & If(CountRows(cmpNrqEditWorkflow.DraftWorkers) = 1, " worker", " workers")
                                                            VerticalAlign: =VerticalAlign.Top
                                    - lblNrqGate:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Start
                                          Color: =nfColor.Transparent
                                          Height: =0
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =nfType.Micro
                                          Text: |-
                                            =If(
                                                Switch(
                                                    locNrqStep,
                                                    1, !IsBlank(locNrqCategoryKey),
                                                    2, !IsBlank(Trim(txtNrqTitle.Text))
                                                       && !IsBlank(locNrqPocEmail)
                                                       && !IsBlank(drpNrqProcessing.Selected.ConfigKey)
                                                       && !IsBlank(drpNrqDepartment.Selected.ConfigKey)
                                                       && !IsBlank(dtpNrqDue.SelectedDate),
                                                    3, true,
                                                    4, CountRows(cmpNrqEditWorkflow.DraftPhases) > 0
                                                       && CountRows(cmpNrqEditWorkflow.DraftWorkers) > 0,
                                                    5, true,
                                                    false
                                                ),
                                                "1",
                                                "0"
                                            )
                                            // STEP 4 GATES ON STRUCTURE, NOT ON RESOLUTION, and the
                                            // omission of UnresolvedCount is deliberate. A template
                                            // assignment ARRIVES unresolved by design: the payload
                                            // carries a role name and a department and no email, and
                                            // resolving every one of them is not something a requester
                                            // can always do at creation time. Requiring it made step 4
                                            // impassable the moment the template loaded, because
                                            // UnresolvedCount equals the assignment count on arrival.
                                            //
                                            // What is still checked is the hole this gate exists for:
                                            // a request with no phases or no workers at all.
                                            // lblNrqS4Warning stays visible and says what is
                                            // outstanding; it just does not block.
                                            //
                                            // ONE HIDDEN LABEL RATHER THAN THE SAME BOOLEAN IN THREE PLACES.
                                            // The gate is read by btnNrqNext, by cmpNrqFab and by
                                            // lblNrqFooterHint. Written inline it would be three copies of a
                                            // fifteen line expression, and the copies would drift the first
                                            // time a field is added.
                                            //
                                            // It cannot be a named formula: named formulas take no
                                            // parameters, cannot see context variables, and cannot reference
                                            // screen controls. It cannot be a UDF either, since a UDF
                                            // signature is scalars only. house-rules section 7.
                                            //
                                            // Height 0 and Visible false, so it costs nothing in the
                                            // zero-gap stack it sits in.
                                          Visible: =false
                                          Width: =0
                                          Wrap: =false
                                    - btnNrqAdvance:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Fill: =nfColor.Transparent
                                          FocusedBorderThickness: =0.5
                                          Height: =1
                                          HoverFill: =nfColor.Transparent
                                          OnSelect: |-
                                            =If(
                                                locNrqStep = 3 && !locNrqWfLoaded,
                                                cmpNrqEditWorkflow.LoadDraft();
                                            cmpNrqEditWorkflow.LoadTemplate();
                                                UpdateContext({ locNrqWfLoaded: true })
                                            );
                                            If(
                                                locNrqStep < 5,
                                                UpdateContext({ locNrqStep: locNrqStep + 1, locNrqTried: false }),
                                                Notify(
                                                    "Create is not wired yet. Nothing has been saved.",
                                                    NotificationType.Warning
                                                )
                                            )
                                            // MARKED CALL SITE 2 OF 2. DO NOT GUESS A SIGNATURE.
                                            //
                                            // ONE ADVANCE HANDLER. btnNrqNext and the FAB were fifteen
                                            // identical lines each; both now Select this button. Two copies
                                            // of a handler this long drift, and the FAB is the one nobody
                                            // opens on a desktop to notice.
                                            //
                                            // LoadDraft THEN LoadTemplate, in that order. LoadDraft clears
                                            // the draft and resets _cmpWfNextId, _cmpWfDirty and the
                                            // expanded phase; LoadTemplate appends the category's template
                                            // on top. Reversed, the template is wiped.
                                            //
                                            // CLAUDE.md, Flows: no create flow exists, and until one does
                                            // no formula here may assume its name, trigger or response
                                            // shape. Canvas writes intent, Flow owns truth, and Canvas
                                            // NEVER mints a key: RequestKey is REQ-YYYY-000000 derived by
                                            // Flow from the SharePoint item Id AFTER insert.
                                            //
                                            // That ordering is also why the mockup's navigation does not
                                            // survive translation. It navigates to Details passing null,
                                            // and Details falls through to a hardcoded demo record. In
                                            // Canvas the same shape renders WRONG data rather than
                                            // placeholder data, so it is deliberately not reproduced.
                                            //
                                            // WHAT THE FLOW NEEDS, all of it already on this screen:
                                            //   CategoryKey    locNrqCategoryKey
                                            //   Title          Trim(txtNrqTitle.Text)
                                            //   PocName/Email  locNrqPocName, locNrqPocEmail
                                            //   ProcessingKey  drpNrqProcessing.Selected.ConfigKey
                                            //   DepartmentCode drpNrqDepartment.Selected.ConfigKey
                                            //   PriorityKey    drpNrqPriority.Selected.PriorityKey
                                            //   RequestDueDate dtpNrqDue.SelectedDate
                                            //   Description    Trim(txtNrqDescription.Text)
                                            //   Links          Trim(txtNrqLinks.Text)
                                            //   Phases         cmpNrqEditWorkflow.DraftPhases
                                            //   Assignments    cmpNrqEditWorkflow.DraftWorkers
                                            //   Documents      cmpNrqUpload.StagedFiles
                                            //
                                            // ON SUCCESS the flow returns the minted RequestKey, and only
                                            // then can this navigate:
                                            //   Navigate(scrDetails, ScreenTransition.None,
                                            //            { locRequestKey: <returned key> })
                                            // Reset(cmpNrqUpload) belongs on that success path and nowhere
                                            // else, because the component holds the only copy of the
                                            // staged files until the write is confirmed.
                                          PressedFill: =nfColor.Transparent
                                          Text: =""
                                          Tooltip: ="Advance the wizard"
                                          Visible: =false
                                          Width: =1
                              - conNrqFooter:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =0
                                    Height: =nfSize.Row
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =nfSpace.Md
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - btnNrqBack:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Go back one step"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Secondary
                                          Color: =nfColor.TextBody
                                          Height: =nfSize.Row
                                          Layout: =ButtonLayout.TextOnly
                                          OnSelect: |-
                                            =If(
                                                locNrqStep > 1,
                                                UpdateContext({ locNrqStep: locNrqStep - 1, locNrqTried: false }),
                                                Back()
                                            )
                                            // Back() RATHER THAN A NAMED SCREEN. The mockup labels this
                                            // control "Back to Requests" and returns to Home,
                                            // which is a mockup bug CLAUDE.md says not to reproduce. On
                                            // step 1 this returns to whichever screen opened the wizard.
                                          RadiusBottomLeft: =nfRadius.Md
                                          RadiusBottomRight: =nfRadius.Md
                                          RadiusTopLeft: =nfRadius.Md
                                          RadiusTopRight: =nfRadius.Md
                                          Size: =nfType.Small
                                          Text: =If(locNrqStep = 1, "Cancel", "Back")
                                          Tooltip: |-
                                            =If(
                                                locNrqStep = 1,
                                                "Leave without creating anything",
                                                "Return to step " & (locNrqStep - 1)
                                            )
                                          Width: =104
                                    - lblNrqFooterHint:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          AutoHeight: =true
                                          Color: |-
                                            =If(
                                                lblNrqGate.Text <> "1" && locNrqTried,
                                                nfColor.WarnText,
                                                nfColor.TextMuted
                                            )
                                          FillPortions: =1
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =nfType.Small
                                          Text: |-
                                            =If(
                                                lblNrqGate.Text <> "1" && locNrqTried,
                                                "Step " & locNrqStep & " of 5, something above is still needed",
                                                "Step " & locNrqStep & " of 5"
                                            )
                                          Wrap: =false
                                    - btnNrqNext:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: ="Continue to the next step"
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: =nfColor.TextOnPrimary
                                          Height: =nfSize.Row
                                          Icon: =If(locNrqStep < 5, "ArrowRight", "Checkmark")
                                          Layout: =ButtonLayout.IconAfter
                                          OnSelect: |-
                                            =If(
                                                lblNrqGate.Text = "1",
                                                Select(btnNrqAdvance),
                                                UpdateContext({ locNrqTried: true })
                                            )
                                          RadiusBottomLeft: =nfRadius.Md
                                          RadiusBottomRight: =nfRadius.Md
                                          RadiusTopLeft: =nfRadius.Md
                                          RadiusTopRight: =nfRadius.Md
                                          Size: =nfType.Small
                                          Text: =If(locNrqStep < 5, "Next", "Create request")
                                          Tooltip: |-
                                            =If(
                                                lblNrqGate.Text = "1",
                                                "",
                                                "Fill in what is still required above"
                                            )
                                          Width: =If(locNrqStep < 5, 120, 168)
                              - conNrqTailSpacer:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =0
                                    Height: |-
                                      =nfSpace.Section
                                      // AN EMPTY CONTAINER RATHER THAN MORE PaddingBottom ON THE
                                      // GUTTER. The gutter scrolls, and its bottom padding does not
                                      // extend the SCROLL EXTENT, so on the tall steps the last
                                      // control sat flush against the end of the range with nothing
                                      // under it. A real child does extend the extent.
                                      //
                                      // Same distinction layout-sizing section 16 draws about the
                                      // bottom bar: padding moves content, it does not move the
                                      // range the content scrolls through.
                                      //
                                      // IT IS THE LAST CHILD OF THE GUTTER, AND THAT IS THE POINT.
                                      // Placed before conNrqFooter it padded the gap ABOVE the
                                      // buttons, which already had a LayoutGap, and left the bottom
                                      // of the range exactly as flush as before. A tail spacer that
                                      // is not last is not a tail spacer.
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                        - conNrqBottomBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Surface
                              FillPortions: =0
                              Height: =nfHeights.bottomNav + nfSpace.Lg
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =nfHeights.bottomNav
                              LayoutMinWidth: =0
                              PaddingBottom: =nfSpace.Md
                              PaddingTop: =nfSpace.Xs
                              Visible: =!nfIsDesktop
                            Children:
                              - cmpNrqBottomNav:
                                  Control: CanvasComponent
                                  ComponentName: cmpBottomNavigation
                                  Properties:
                                    ActiveColor: =nfColor.Primary
                                    ActiveColorHex: =If(nfIsDark, "3B82F6", "2563EB")
                                    ActiveIndicator: ="bar"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BadgeColor: =nfColor.DangerSolid
                                    FillPortions: =1
                                    InactiveColorHex: =If(nfIsDark, "94A3B8", "64748B")
                                    Items: |-
                                      =ForAll(
                                          nfNavMobile As m,
                                          {
                                              Icon: m.Icon,
                                              Label: m.Label,
                                              Badge: If(
                                                  m.ID = 2,
                                                  nfMyOpenCount,
                                                  0
                                              )
                                          }
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(
                                          _cmpNavSelID,
                                          LookUp(nfNavMobile, Idx = Self.SelectedItemIndex).ID
                                      );
                                      nfRoute(_cmpNavSelID)
                                    SelectedIndex: =Coalesce(LookUp(nfNavMobile, ID = _cmpNavSelID).Idx, 3)
                                    ShowLabels: ="always"
                                    Theme: =nfThemeName
      - conNrqNavHost:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Sidebar
            Height: =Parent.Height
            Visible: =nfIsDesktop
            Width: =cmpNrqSidebar.Width
          Children:
            - cmpNrqSidebar:
                Control: CanvasComponent
                ComponentName: cmpSidebar
                Properties:
                  AccentColor: =nfColor.Primary
                  AppLogo: =Blank()
                  AppName: ="DocRouter"
                  AppNameAccent: =""
                  Expanded: =true
                  Height: =Parent.Height
                  Icons: =nfSidebarIcons
                  Items: |-
                    =Table(
                        { ID: 1,  Title: "Home",         Icon: "Home",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 2,  Title: "My Tasks",     Icon: "CheckSquare",     Letter: "",
                          Badge: nfMyOpenCount,
                          BadgeColor: nfColor.DangerSolid, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 3,  Title: "All Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 7,  Title: "My Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: 3, Visible: true },
                        { ID: 4,  Title: "Reports",      Icon: "Chart",    Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 90, Title: "",             Icon: "",         Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: true,  ParentID: -1, Visible: true },
                        { ID: 5,  Title: "Settings",     Icon: "Settings", Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 6,  Title: "Help",         Icon: "Help",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true }
                    )
                  OnFooterSettings: =false
                  OnHelp: =false
                  OnNavSelect: =nfRoute(Self.SelectedID)
                  OnThemeToggle: |-
                    =Patch(
                        colUserPrefs,
                        First(colUserPrefs),
                        { ThemeName: If(nfIsDark, "Light", "Dark") }
                    );
                    ClearCollect(
                        colUserPrefs,
                        Filter(colUserPrefs, UserEmail = Lower(nfUserEmail))
                    )
                  OnToggle: =false
                  ShowFooterMenu: =true
                  ShowHeader: =true
                  ShowSearch: =false
                  ShowToggle: =true
                  ShowUser: =true
                  Theme: =If(nfIsDark, "Light", "Dark")
                  Width: =If(_cmpNavIsExpanded, 260, 64)
      - cmpNrqEditWorkflow:
          Control: CanvasComponent
          ComponentName: cmpDetEditWorkflow
          Properties:
            Height: =App.Height
            OnCancel: |-
              =ClearCollect(colWfDraftPhases, colNrqWfSnapPhases);
              ClearCollect(colWfDraftWorkers, colNrqWfSnapWorkers);
              Self.Rebuild();
              UpdateContext({ locNrqWfOpen: false })
              // PUTS BACK WHAT WAS THERE WHEN THE DIALOG OPENED, rather than
              // leaving the Clear that btnWfCancel already performed. Cancel now
              // means "discard what I just did in there", which is what a user
              // expects, instead of "discard the entire workflow".
              //
              // Rebuild IS REQUIRED and is not belt and braces. The dialog renders
              // from a flat projection, colWfRows, not from the draft collections
              // directly, so writing the drafts back leaves the visible list stale
              // until it is reprojected. The component exposes Rebuild for exactly
              // this case: its own description says it is for a host that mutates
              // the draft collections directly.
            OnSave: |-
              =UpdateContext({ locNrqWfOpen: false })
              // NOTHING IS PERSISTED HERE, and that is correct. The component's
              // DraftPhases and DraftWorkers outputs hold the edit, and they are
              // read by the create call site on btnNrqNext. A new request has no
              // phases or assignments to patch yet.
            RequestKey: |-
              =""
              // EMPTY DELIBERATELY, not an oversight. LoadDraft filters
              // colPhases and colAssignments on this key, so an empty one
              // Clears both draft collections and yields an empty workflow.
              // That is exactly what a new request starts from, and it is why
              // this component can be reused here at all rather than the whole
              // Add Worker panel being rebuilt.
              //
              // LoadDraft IS CALLED ON ENTERING STEP 4, once, guarded by
              // locNrqWfLoaded on btnNrqNext.OnSelect. That call is not
              // optional and it is not cosmetic: the draft collections are APP
              // scope and shared with the other instance of this same
              // component over on Details, so without it a workflow edited
              // there would still be sitting here.
              //
              // THIS INSTANCE IS LAST IN Children ON PURPOSE. Render order is
              // tree order and last is on top, so it covers the root, the nav
              // host and the FAB. Placed before conNrqNavHost it would render
              // under the sidebar.
              //
              // LoadDraft ALONE IS NOT THE SEQUENCE. With an empty RequestKey it
              // clears the draft and leaves it empty, which is the correct start
              // for a new request but is not a workflow. LoadTemplate then fills
              // it from the category. The PAIR is the sequence, and the order is
              // fixed: LoadDraft resets _cmpWfNextId, _cmpWfDirty and the
              // expanded phase, so running it second would wipe the template.
            RequireResolved: |-
              =false
              // A NEW REQUEST IS STILL LOCAL. Nothing is written until Create, the
              // key does not exist yet, and the template's role names are the point
              // of starting from a template. Requiring every row to name a person
              // before Save would light up meant Save never lit up at all, because
              // a template assignment arrives unresolved by design.
              //
              // scrDetails leaves this at its default true, where an unresolved row
              // really would reach a flow that cannot action it.
            SeedTemplateKey: |-
              =LookUp(nfCategories, ConfigKey = locNrqCategoryKey).DefaultTemplateKey
              // BLANK UNTIL A CATEGORY IS PICKED, and blank makes LoadTemplate a
              // no op, so the action is safe to call unconditionally.
              //
              // A CATEGORY WHOSE DefaultTemplateKey NAMES NO TEMPLATE also lands
              // here as a no op. That is a config defect and step 4 will show
              // zero phases, which the gate now blocks.
            Visible: =locNrqWfOpen
            Width: =App.Width
