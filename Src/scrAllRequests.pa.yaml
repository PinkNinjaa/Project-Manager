Screens:
  scrAllRequests:
    Properties:
      Fill: =nfColor.Canvas
      OnVisible: |-
        =Set(_cmpNavSelID, 3);
        Set(gblArqSelKey, "");
        UpdateContext(
            {
                locArqStatusKey: "all",
                locArqShowDeleted: false,
                locArqCategoryKey: "all",
                locArqView: "table",
                locArqShowFilters: true,
                locArqPanelOpen: false,
                locArqSheetOpen: false
            }
        );
        ClearCollect(
            colArqStatusOptions,
            { Value: "all", Label: "All Statuses", Icon: "" }
        );
        Collect(
            colArqStatusOptions,
            ForAll(
                SortByColumns(nfStatusTable, "SortOrder", SortOrder.Ascending) As s,
                { Value: s.StatusKey, Label: s.Title, Icon: "" }
            )
        );
        ClearCollect(
            colArqCategoryOptions,
            { Value: "all", Label: "All Categories", Icon: "" }
        );
        Collect(
            colArqCategoryOptions,
            ForAll(
                nfCategories As cat,
                { Value: cat.ConfigKey, Label: cat.Title, Icon: "" }
            )
        )
    Children:
      - conArqRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingLeft: =If(nfIsDesktop, conArqNavHost.Width, 0)
            Width: =Parent.Width
          Children:
            - conArqMiddle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conArqRight:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conArqTopBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderStyle: =If(nfIsMobile, BorderStyle.None, BorderStyle.Solid)
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =If(nfIsMobile, nfColor.Transparent, nfColor.Surface)
                              FillPortions: =0
                              Height: =nfHeights.topBar
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(nfIsMobile, nfSpace.Sm, nfSpace.Md)
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMaxHeight: =nfHeights.topBar
                              LayoutMinHeight: =nfHeights.topBar
                              LayoutMinWidth: =0
                              PaddingRight: =If(nfIsMobile, nfSpace.Md, nfSpace.Xxl)
                            Children:
                              - conArqTitleGroup:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =2.5
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmpArqCrumbs:
                                        Control: CanvasComponent
                                        ComponentName: cmpBreadcrumbs
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          CharWidths: =nfCharWidths
                                          Config: |-
                                            ={
                                                Theme: If(nfIsDark, "dark", "light"),
                                                SeparatorIcon: "chevron",
                                                Gap: 4,
                                                Size: nfType.ChromeTitle,
                                                MaxItems: 4,
                                                ItemsBeforeCollapse: 1,
                                                ItemsAfterCollapse: 2,
                                                ActiveLastItem: false,
                                                BackButton: false
                                            }
                                          CurrentColor: =If(nfIsDark, "#F1F5F9", "#1E293B")
                                          Height: =nfHeights.breadcrumb
                                          Icons: =nfBreadcrumbIcons
                                          Items: |-
                                            =Table(
                                                { id: "home", label: "Home" },
                                                { id: "requests", label: "All Requests" }
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LinkColor: =If(nfIsDark, "#94A3B8", "#64748B")
                                          OnBack: =
                                          OnSelect: |-
                                            =If(
                                                cmpArqCrumbs.SelectedItem.id = "home",
                                                Navigate(scrHome, ScreenTransition.None)
                                            )
                                          Width: =Parent.Width
                              - cmpArqBell:
                                  Control: CanvasComponent
                                  ComponentName: Badge
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BadgeColor: =nfColor.DangerSolid
                                    BadgeCount: =0
                                    HasNotifications: =false
                                    Height: =Self.Size
                                    HoverText: ="Notifications"
                                    IconColor: =
                                    IconSvg: =
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =false
                                      // INERT ON PURPOSE. Same reason as scrHome: CLAUDE.md
                                      // open question 2 is unresolved and colAudit is the wrong
                                      // shape. Do NOT bind this to colAudit.
                                    Size: =If(nfIsMobile, 32, 35)
                                    Theme: =nfThemeName
                                    Width: =Self.Size
                              - conArqAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Primary
                                    FillPortions: =0
                                    Height: =nfHeights.avatar
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =nfHeights.avatar / 2
                                    RadiusBottomRight: =nfHeights.avatar / 2
                                    RadiusTopLeft: =nfHeights.avatar / 2
                                    RadiusTopRight: =nfHeights.avatar / 2
                                    Width: =nfHeights.avatar
                                  Children:
                                    - lblArqInitials:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          Color: =nfColor.TextOnPrimary
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =nfType.Initials
                                          Text: =nfInitials
                                          Width: =Parent.Width
                                          Wrap: =false
                        - conArqGutter:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Canvas
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =nfSpace.Lg
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingLeft: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingRight: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingTop: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              Width: =Parent.Width
                            Children:
                              - conArqHeader:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =0
                                    Height: |-
                                      =Max(
                                          lblArqTitle.Height + lblArqCount.Height + conArqHeaderText.LayoutGap,
                                          btnArqNewRequest.Height
                                      )
                                      + Self.PaddingTop
                                      + Self.PaddingBottom
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =nfSpace.Md
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conArqHeaderText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Xxs
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - lblArqTitle:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextStrong
                                                FontWeight: =FontWeight.Bold
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =If(nfIsDesktop, nfType.PageTitle, 20)
                                                Text: |-
                                                  =If(
                                                      Coalesce(locMyRequestsOnly, false),
                                                      "My Requests",
                                                      "All Requests"
                                                  )
                                                Wrap: =false
                                          - lblArqCount:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =nfColor.TextMuted
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =nfType.Body
                                                Text: |-
                                                  =" Total " &
                                                  If(cmpArqTable.RowCount >= 2000, "2000+", Text(cmpArqTable.RowCount))
                                                  // CountRows does not delegate on SharePoint, so past the data row
                                                  // limit this counts only what was fetched. 2000 must match the
                                                  // App setting: if the limit is lowered, this stops warning.
                                                Wrap: =false
                                    - btnArqNewRequest:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: ="New Request"
                                          AlignInContainer: =AlignInContainer.Center
                                          FontWeight: =FontWeight.Semibold
                                          Height: =nfSize.Row
                                          Icon: ="Add"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Navigate(scrNewRequest, ScreenTransition.None)
                                          Size: =nfType.Body
                                          Text: ="New Request"
                                          Visible: =nfIsDesktop
                                          Width: =150
                              - lblArqFiltersOn:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    AlignInContainer: =AlignInContainer.Start
                                    Height: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Text: |-
                                      =If(
                                          !IsBlank(txtArqSearch.Text)
                                              || locArqStatusKey <> "all"
                                              || locArqCategoryKey <> "all"
                                              || Coalesce(locMyRequestsOnly, false),
                                          "1",
                                          "0"
                                      )
                                    Visible: =false
                                    Width: =1
                                    Wrap: =false
                              - conArqToolbar:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =nfColor.Border
                                    BorderThickness: =nfSize.Border
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Surface
                                    FillPortions: =0
                                    Height: |-
                                      =conArqToolbarRow.Height
                                      + If(locArqShowFilters, conArqFilterRow.Height + Self.LayoutGap, 0)
                                      + Self.PaddingTop
                                      + Self.PaddingBottom
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =nfSpace.Lg
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =nfSpace.Lg
                                    PaddingLeft: =nfSpace.Lg
                                    PaddingRight: =nfSpace.Lg
                                    PaddingTop: =nfSpace.Lg
                                    RadiusBottomLeft: =nfRadius.Lg
                                    RadiusBottomRight: =nfRadius.Lg
                                    RadiusTopLeft: =nfRadius.Lg
                                    RadiusTopRight: =nfRadius.Lg
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conArqToolbarRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          FillPortions: =0
                                          Height: =nfSize.Row
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =nfSpace.Md
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - txtArqSearch:
                                              Control: ModernTextInput@1.1.1
                                              Properties:
                                                AccessibleLabel: ="Search"
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =Appearance.Outline
                                                Color: =nfColor.TextStrong
                                                FillPortions: =1
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Placeholder: ="Search requests"
                                                Size: =nfType.Body
                                          - conArqViewTable:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =nfColor.Border
                                                BorderThickness: =nfSize.Border
                                                DropShadow: =DropShadow.None
                                                Fill: =If(locArqView = "table", nfColor.PrimarySoft, nfColor.Surface)
                                                FillPortions: =0
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =nfRadius.Md
                                                RadiusBottomRight: =nfRadius.Md
                                                RadiusTopLeft: =nfRadius.Md
                                                RadiusTopRight: =nfRadius.Md
                                                Visible: =!nfIsMobile
                                                Width: =nfSize.Row
                                              Children:
                                                - imgArqViewTable:
                                                    Control: Image@2.2.3
                                                    Properties:
                                                      AccessibleLabel: ="View as table icon"
                                                      FocusedBorderThickness: =0.5
                                                      Height: =nfSize.Icon
                                                      Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='#64748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M3 9h18'/><path d='M3 15h18'/></svg>")
                                                      TabIndex: =0
                                                      Width: =nfSize.Icon
                                                      X: =(Parent.Width - Self.Width) / 2
                                                      Y: =(Parent.Height - Self.Height) / 2
                                                - btnArqViewTable:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      BorderColor: =nfColor.Transparent
                                                      BorderThickness: =0
                                                      Color: =nfColor.Transparent
                                                      Fill: =nfColor.Transparent
                                                      FocusedBorderThickness: =0.5
                                                      Height: =Parent.Height
                                                      HoverBorderColor: =nfColor.Transparent
                                                      HoverColor: =nfColor.Transparent
                                                      HoverFill: =nfColor.Transparent
                                                      OnSelect: |-
                                                        =UpdateContext({ locArqView: "table" })
                                                      PressedBorderColor: =nfColor.Transparent
                                                      PressedColor: =nfColor.Transparent
                                                      PressedFill: =nfColor.Transparent
                                                      Text: =""
                                                      Tooltip: ="View as table"
                                                      Width: =Parent.Width
                                          - conArqViewCards:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =nfColor.Border
                                                BorderThickness: =nfSize.Border
                                                DropShadow: =DropShadow.None
                                                Fill: =If(locArqView = "card", nfColor.PrimarySoft, nfColor.Surface)
                                                FillPortions: =0
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =nfRadius.Md
                                                RadiusBottomRight: =nfRadius.Md
                                                RadiusTopLeft: =nfRadius.Md
                                                RadiusTopRight: =nfRadius.Md
                                                Visible: =!nfIsMobile
                                                Width: =nfSize.Row
                                              Children:
                                                - imgArqViewCards:
                                                    Control: Image@2.2.3
                                                    Properties:
                                                      AccessibleLabel: ="View as cards icon"
                                                      FocusedBorderThickness: =0.5
                                                      Height: =nfSize.Icon
                                                      Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='#64748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='7' height='7' rx='1'/><rect x='14' y='3' width='7' height='7' rx='1'/><rect x='3' y='14' width='7' height='7' rx='1'/><rect x='14' y='14' width='7' height='7' rx='1'/></svg>")
                                                      TabIndex: =0
                                                      Width: =nfSize.Icon
                                                      X: =(Parent.Width - Self.Width) / 2
                                                      Y: =(Parent.Height - Self.Height) / 2
                                                - btnArqViewCards:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      BorderColor: =nfColor.Transparent
                                                      BorderThickness: =0
                                                      Color: =nfColor.Transparent
                                                      Fill: =nfColor.Transparent
                                                      FocusedBorderThickness: =0.5
                                                      Height: =Parent.Height
                                                      HoverBorderColor: =nfColor.Transparent
                                                      HoverColor: =nfColor.Transparent
                                                      HoverFill: =nfColor.Transparent
                                                      OnSelect: |-
                                                        =UpdateContext({ locArqView: "card" })
                                                      PressedBorderColor: =nfColor.Transparent
                                                      PressedColor: =nfColor.Transparent
                                                      PressedFill: =nfColor.Transparent
                                                      Text: =""
                                                      Tooltip: ="View as cards"
                                                      Width: =Parent.Width
                                          - conArqFilterToggle:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: |-
                                                  =If(
                                                      lblArqFiltersOn.Text = "1" || locArqShowFilters,
                                                      nfColor.PrimaryBorder,
                                                      nfColor.Border
                                                  )
                                                BorderThickness: =nfSize.Border
                                                DropShadow: =DropShadow.None
                                                Fill: |-
                                                  =If(
                                                      lblArqFiltersOn.Text = "1" || locArqShowFilters,
                                                      nfColor.PrimarySoft,
                                                      nfColor.Surface
                                                  )
                                                FillPortions: =0
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                RadiusBottomLeft: =nfRadius.Md
                                                RadiusBottomRight: =nfRadius.Md
                                                RadiusTopLeft: =nfRadius.Md
                                                RadiusTopRight: =nfRadius.Md
                                                Width: =nfSize.Row
                                              Children:
                                                - cmpArqFilterBadge:
                                                    Control: CanvasComponent
                                                    ComponentName: Badge
                                                    Properties:
                                                      BadgeColor: =nfColor.Primary
                                                      BadgeCount: =lblArqFiltersOn.Text
                                                      HasNotifications: =lblArqFiltersOn.Text = "1"
                                                      Height: =Self.Size
                                                      HoverText: ="Filters"
                                                      IconColor: =
                                                      IconSvg: ="<svg xmlns='http://www.w3.org/2000/svg' width='100%' height='100%' viewBox='0 0 24 24' fill='none' stroke='#64748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>"
                                                      OnSelect: |-
                                                        =UpdateContext({ locArqShowFilters: !locArqShowFilters })
                                                      Size: =30
                                                      Theme: =nfThemeName
                                                      Width: =Self.Size
                                                      X: =(Parent.Width - Self.Width) / 2
                                                      Y: =(Parent.Height - Self.Height) / 2
                                    - conArqFilterRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          FillPortions: =0
                                          Height: =nfSize.RowSm
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =nfSpace.Sm
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Visible: =locArqShowFilters
                                        Children:
                                          - btnArqMineChip:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                AccessibleLabel: ="My Requests Only"
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: |-
                                                  =If(
                                                      Coalesce(locMyRequestsOnly, false),
                                                      ButtonAppearance.Primary,
                                                      ButtonAppearance.Secondary
                                                  )
                                                Color: |-
                                                  =If(
                                                      Coalesce(locMyRequestsOnly, false),
                                                      nfColor.TextOnPrimary,
                                                      nfColor.TextBody
                                                  )
                                                FontWeight: =FontWeight.Semibold
                                                Height: =nfSize.RowSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext(
                                                      {
                                                          locMyRequestsOnly: !Coalesce(locMyRequestsOnly, false)
                                                      }
                                                  )
                                                Size: =nfType.Small
                                                Text: ="My Requests Only"
                                                Width: =150
                                          - btnArqDeletedChip:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                AccessibleLabel: ="Show deleted requests"
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: |-
                                                  =If(
                                                      Coalesce(locArqShowDeleted, false),
                                                      ButtonAppearance.Primary,
                                                      ButtonAppearance.Secondary
                                                  )
                                                Color: |-
                                                  =If(
                                                      Coalesce(locArqShowDeleted, false),
                                                      nfColor.TextOnPrimary,
                                                      nfColor.TextBody
                                                  )
                                                FontWeight: =FontWeight.Semibold
                                                Height: =nfSize.RowSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext(
                                                      {
                                                          locArqShowDeleted: !Coalesce(locArqShowDeleted, false)
                                                      }
                                                  )
                                                  // EXCLUSIVE, NOT ADDITIVE. This SWAPS the table between active and deleted
                                                  // rather than adding deleted rows to the list, because there is no delegable
                                                  // way to show both: IsDeleted = <variable> folds into the server query, and
                                                  // IsDeleted = false || IsDeleted = true is an OR over a column that drops the
                                                  // whole Filter to the client.
                                                Size: =nfType.Small
                                                Text: =If(Coalesce(locArqShowDeleted, false), "Showing deleted", "Deleted")
                                                Width: =150
                                          - cboArqStatus:
                                              Control: ModernCombobox@1.1.1
                                              Properties:
                                                AccessibleLabel: ="Status"
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =Appearance.Outline
                                                DefaultSelectedItems: =Filter(colArqStatusOptions, Value = locArqStatusKey)
                                                Height: =nfSize.RowSm
                                                InputTextPlaceholder: ="All Statuses"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.Label
                                                Items: =colArqStatusOptions
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =UpdateContext(
                                                      {
                                                          locArqStatusKey: Coalesce(cboArqStatus.Selected.Value, "all")
                                                      }
                                                  )
                                                SelectMultiple: =false
                                                Size: =nfType.Body
                                                Width: =If(nfIsMobile, 160, 200)
                                          - cboArqCategory:
                                              Control: ModernCombobox@1.1.1
                                              Properties:
                                                AccessibleLabel: ="Category"
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: =Appearance.Outline
                                                DefaultSelectedItems: =Filter(colArqCategoryOptions, Value = locArqCategoryKey)
                                                Height: =nfSize.RowSm
                                                InputTextPlaceholder: ="All Categories"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.Label
                                                Items: =colArqCategoryOptions
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =UpdateContext(
                                                      {
                                                          locArqCategoryKey: Coalesce(cboArqCategory.Selected.Value, "all")
                                                      }
                                                  )
                                                SelectMultiple: =false
