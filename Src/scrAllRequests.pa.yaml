                                    ThemeConfig: =nfTableTheme
                                    ViewMode: =If(nfIsMobile, "list", locArqView)
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                        - conArqBottomBar:
