                                          StatusKey: locArqStatusKey,
                                          CategoryKey: locArqCategoryKey,
                                          MineOnly: Coalesce(locMyRequestsOnly, false),
                                          UserEmail: nfUserEmail,
                                          ShowDeleted: Coalesce(locArqShowDeleted, false)
