Screens:
  scrReports:
    Properties:
      Fill: =nfColor.Canvas
      OnVisible: =Set(_cmpNavSelID, 4)
    Children:
      - conRptRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingLeft: =If(nfIsDesktop, conRptNavHost.Width, 0)
            Width: =Parent.Width
          Children:
            - conRptMiddle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conRptRight:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conRptTopBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderStyle: =If(nfIsMobile, BorderStyle.None, BorderStyle.Solid)
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =If(nfIsMobile, nfColor.Transparent, nfColor.Surface)
                              FillPortions: =0
                              Height: =nfHeights.topBar
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(nfIsMobile, nfSpace.Sm, nfSpace.Md)
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMaxHeight: =nfHeights.topBar
                              LayoutMinHeight: =nfHeights.topBar
                              LayoutMinWidth: =0
                              PaddingRight: =If(nfIsMobile, nfSpace.Md, nfSpace.Xxl)
                            Children:
                              - conRptTitleGroup:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =2.5
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmpRptCrumbs:
                                        Control: CanvasComponent
                                        ComponentName: cmpBreadcrumbs
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          CharWidths: =nfCharWidths
                                          Config: |-
                                            ={
                                                Theme: If(nfIsDark, "dark", "light"),
                                                SeparatorIcon: "chevron",
                                                Gap: 4,
                                                Size: nfType.ChromeTitle,
                                                MaxItems: 4,
                                                ItemsBeforeCollapse: 1,
                                                ItemsAfterCollapse: 2,
                                                ActiveLastItem: false,
                                                BackButton: false
                                            }
                                          CurrentColor: =If(nfIsDark, "#F1F5F9", "#1E293B")
                                          Height: =nfHeights.breadcrumb
                                          Icons: =nfBreadcrumbIcons
                                          Items: |-
                                            =Table(
                                                { id: "home", label: "Home" },
                                                { id: "reports", label: "Reports" }
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LinkColor: =If(nfIsDark, "#94A3B8", "#64748B")
                                          OnBack: =false
                                          OnSelect: |-
                                            =If(
                                                cmpRptCrumbs.SelectedItem.id = "home",
                                                Navigate(scrHome, ScreenTransition.None)
                                            )
                                          Width: =Parent.Width
                              - cmpRptBell:
                                  Control: CanvasComponent
                                  ComponentName: Badge
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BadgeColor: =nfColor.DangerSolid
                                    BadgeCount: =0
                                    HasNotifications: =false
                                    Height: =Self.Size
                                    HoverText: ="Notifications"
                                    IconColor: =
                                    IconSvg: =
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =false
                                      // INERT ON PURPOSE. Same reason as scrHome: CLAUDE.md
                                      // open question 2 is unresolved and colAudit is the wrong
                                      // shape. Do NOT bind this to colAudit.
                                    Size: =If(nfIsMobile, 32, 35)
                                    Theme: =nfThemeName
                                    Width: =Self.Size
                              - conRptAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Primary
                                    FillPortions: =0
                                    Height: =nfHeights.avatar
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =nfHeights.avatar / 2
                                    RadiusBottomRight: =nfHeights.avatar / 2
                                    RadiusTopLeft: =nfHeights.avatar / 2
                                    RadiusTopRight: =nfHeights.avatar / 2
                                    Width: =nfHeights.avatar
                                  Children:
                                    - lblRptInitials:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          Color: =nfColor.TextOnPrimary
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =nfType.Initials
                                          Text: =nfInitials
                                          Width: =Parent.Width
                                          Wrap: =false
                        - conRptGutter:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Canvas
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =nfSpace.Lg
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingLeft: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingRight: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingTop: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              Width: =Parent.Width
                            Children:
                              - cmpRptStats:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPI
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    AnimationEffect: ="None"
                                    ColumnsLayout: |-
                                      =With(
                                          {
                                              _capOffset: If(nfIsDesktop, conRptNavHost.Width, 0) +
                                                          If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl)
                                          },
                                          {
                                              Mobile: 2,
                                              Tablet: 2,
                                              Desktop: 4,
                                              MobileBreakpoint:  640 + _capOffset,
                                              TabletBreakpoint:  1024 + _capOffset,
                                              DesktopBreakpoint: 1366 + _capOffset
                                          }
                                      )
                                    Data: |-
                                      =Table(
                                          {
                                              ID: 1, Icon: "Target",
                                              Value: CountRows(Filter(colRequests, !IsDeleted)),
                                              Label: "Total Requests", PercentChange: Blank(), PercentLabel: "",
                                              IconBg: "#DBEAFE", IconColor: "#1D4ED8", SparklineData: "", isHidden: false
                                          },
                                          {
                                              ID: 2, Icon: "Check",
                                              Value: CountRows(Filter(colRequests, StatusKey = "Completed", !IsDeleted)),
                                              Label: "Completed", PercentChange: Blank(), PercentLabel: "",
                                              IconBg: "#DCFCE7", IconColor: "#15803D", SparklineData: "", isHidden: false
                                          },
                                          {
                                              ID: 3, Icon: "Clock",
                                              Value: CountRows(Filter(colRequests, StatusKey = "InProgress", !IsDeleted)),
                                              Label: "In Progress", PercentChange: Blank(), PercentLabel: "",
                                              IconBg: "#FEF3C7", IconColor: "#B45309", SparklineData: "", isHidden: false
                                          },
                                          {
                                              ID: 4, Icon: "Warning",
                                              Value:
                                                  CountRows(
                                                      Filter(
                                                          colRequests,
                                                          !IsDeleted,
                                                          StatusKey <> "Completed",
                                                          !IsBlank(RequestDueDate),
                                                          RequestDueDate < Today()
                                                      )
                                                  ),
                                              Label: "Overdue", PercentChange: Blank(), PercentLabel: "",
                                              IconBg: "#FEE2E2", IconColor: "#B91C1C", SparklineData: "", isHidden: false
                                          }
                                      )
                                    Height: |-
                                      =With(
                                          {
                                              bp: Self.ColumnsLayout,
                                              w: App.Width,
                                              cardCount: CountRows(Filter(Self.Data, !IfError(isHidden, false)))
                                          },
                                          With(
                                              {
                                                  cols: Max(
                                                      1,
                                                      If(
                                                          w < bp.MobileBreakpoint, bp.Mobile,
                                                          w < bp.TabletBreakpoint, bp.Tablet,
                                                          bp.Desktop
                                                      )
                                                  )
                                              },
                                              With(
                                                  { rows: RoundUp(cardCount / cols, 0) },
                                                  If(
                                                      Or(Self.Style = "Compact", Self.Style = "Minimal"),
                                                      rows * (96 + Self.StyleConfig.space.md) + Self.StyleConfig.space.md,
                                                      rows * (Self.StyleConfig.heights.statsCardMax + Self.StyleConfig.space.lg) + Self.StyleConfig.space.lg
                                                  )
                                              )
                                          )
                                      )
                                    Icons: |-
                                      =Table(
                                          { Name: "Target", SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='6'/><circle cx='12' cy='12' r='2'/></svg>" },
                                          { Name: "Users", SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'/><circle cx='9' cy='7' r='4'/><path d='M23 21v-2a4 4 0 0 0-3-3.87'/><path d='M16 3.13a4 4 0 0 1 0 7.75'/></svg>" },
                                          { Name: "Clock", SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>" },
                                          { Name: "Check", SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>" },
                                          { Name: "Warning", SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'/><line x1='12' y1='9' x2='12' y2='13'/><line x1='12' y1='17' x2='12.01' y2='17'/></svg>" }
                                      )
                                    IsLoading: =false
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnCardClick: =false
                                    Style: ="Compact"
                                    StyleConfig: |-
                                      ={
                                          colors: {
                                              cardBg: nfColor.Surface,
                                              border: nfColor.Border,
                                              text: nfColor.TextStrong,
                                              textMuted: nfColor.TextMuted,
                                              positive: nfColor.SuccessSolid,
                                              negative: nfColor.DangerSolid,
                                              neutral: nfColor.TextFaint,
                                              skeletonBase: nfColor.Border,
                                              skeletonShine: nfColor.SurfaceAlt
                                          },
                                          space: { xs: nfSpace.Xs, sm: nfSpace.Sm, md: nfSpace.Md, lg: nfSpace.Lg, xl: nfSpace.Xxl },
                                          radius: { md: nfRadius.Md, lg: nfRadius.Lg },
                                          type: {
                                              value: { size: 32, sizeCompact: 20 },
                                              label: { size: nfType.Caption },
                                              body:  { size: nfType.Caption }
                                          },
                                          heights: { statsCardMax: 190 },
                                          abbreviateThreshold: 10000
                                      }
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                              - conRptCharts:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: |-
                                      =With(
                                          {
                                              _pieH: 320,
                                              _barH: 2 * nfSpace.Lg + 64 + Max(1, CountRows(nfCategories)) * 44
                                          },
                                          If(
                                              nfIsMobile,
                                              _pieH + nfSpace.Lg + _barH,
                                              Max(_pieH, _barH)
                                          )
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =If(nfIsMobile, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutGap: =nfSpace.Lg
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conRptStatusCard:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =nfColor.Border
                                          BorderThickness: =nfSize.Border
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Surface
                                          FillPortions: =If(nfIsMobile, 0, 1)
                                          Height: =320
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =nfSpace.Sm
                                          PaddingLeft: =nfSpace.Sm
                                          PaddingRight: =nfSpace.Sm
                                          PaddingTop: =nfSpace.Sm
                                          RadiusBottomLeft: =nfRadius.Md
                                          RadiusBottomRight: =nfRadius.Md
                                          RadiusTopLeft: =nfRadius.Md
                                          RadiusTopRight: =nfRadius.Md
                                        Children:
                                          - cmpRptStatusPie:
                                              Control: CanvasComponent
                                              ComponentName: cmpPieChart
                                              Properties:
                                                Animate: =true
                                                AnimationDuration: =0.8
                                                ChartData: |-
                                                  =ForAll(
                                                      Sort(nfStatusTable, SortOrder) As s,
                                                      {
                                                          Label: s.Title,
                                                          Value: CountRows(Filter(colRequests, StatusKey = s.StatusKey, !IsDeleted)),
                                                          Color: Mid(
                                                              JSON(
                                                                  Switch(
                                                                      s.StatusKey,
                                                                      "Completed",  nfColor.SuccessSolid,
                                                                      "InProgress", nfColor.WarnSolid,
                                                                      "OnHold",     nfColor.DangerSolid,
                                                                      nfColor.NeutralText
                                                                  )
                                                              ),
                                                              2,
                                                              7
                                                          )
                                                      }
                                                  )
                                                ChartTitle: ="Requests by status"
                                                DefaultColors: |-
                                                  =Table(
                                                      { Color: "#3B82F6" },
                                                      { Color: "#10B981" },
                                                      { Color: "#F59E0B" },
                                                      { Color: "#EF4444" },
                                                      { Color: "#8B5CF6" },
                                                      { Color: "#64748B" }
                                                  )
                                                DonutMode: =true
                                                DonutThickness: =0.45
                                                FillPortions: =1
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                ShowLabels: =true
                                                ShowLegend: =!nfIsMobile
                                                ShowPercentages: =true
                                                ShowTitle: =true
                                                ShowValues: =true
                                                Theme: =If(nfIsDark, "Dark", "Light")
                                    - cmpRptCategoryBars:
                                        Control: CanvasComponent
                                        ComponentName: cmpBarList
                                        Properties:
                                          Data: |-
                                            =ForAll(
                                                Sort(nfCategories, SortOrder) As c,
                                                {
                                                    Label: c.Title,
                                                    Value: CountRows(Filter(colRequests, CategoryKey = c.ConfigKey, !IsDeleted)),
                                                    Subtitle: "",
                                                    isHidden: false
                                                }
                                            )
                                          EmptyMessage: ="No requests yet"
                                          FillPortions: =If(nfIsMobile, 0, 1)
                                          Height: =2 * nfSpace.Lg + 64 + Max(1, CountRows(nfCategories)) * 44
                                          IsLoading: =false
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnBarClick: =false
                                          Palette: |-
                                            =Table(
                                                { Color: Mid(JSON(nfColor.Primary), 3, 6) }
                                            )
                                          ShowRowSubtitle: =false
                                          StyleConfig: |-
                                            =With(
                                                {
                                                    _tok: {
                                                        cardBg:        nfColor.Surface,
                                                        border:        nfColor.Border,
                                                        title:         nfColor.TextStrong,
                                                        subtitle:      nfColor.TextMuted,
                                                        label:         nfColor.TextBody,
                                                        value:         nfColor.TextStrong,
                                                        barTrack:      nfColor.NeutralFill,
                                                        skeletonBase:  nfColor.Border,
                                                        skeletonShine: nfColor.SurfaceAlt
                                                    }
                                                },
                                                {
                                                    light: _tok,
                                                    dark:  _tok,
                                                    space: { cardPadV: nfSpace.Lg, cardPadH: nfSpace.Lg, barHeight: 8 },
                                                    type: {
                                                        title:    nfType.SectionHead,
                                                        subtitle: nfType.Caption,
                                                        label:    nfType.Body,
                                                        value:    nfType.Body,
                                                        rowSub:   nfType.Caption
                                                    },
                                                    header: { height: 64 },
                                                    row: { height: 44, heightWithSub: 60 },
                                                    radius: { card: nfRadius.Md, bar: 4 },
                                                    abbreviateThreshold: 10000
                                                }
                                            )
                                          Subtitle: ="Active requests per category"
                                          Theme: =If(nfIsDark, "Dark", "Light")
                                          Title: ="Requests by category"
                                          ValueFormat: ="Number"
                        - conRptBottomBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Surface
                              FillPortions: =0
                              Height: =nfHeights.bottomNav + nfSpace.Lg
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =nfSpace.Sm
                              PaddingTop: =nfSpace.Sm
                              Visible: =!nfIsDesktop
                            Children:
                              - cmpRptBottomNav:
                                  Control: CanvasComponent
                                  ComponentName: cmpBottomNavigation
                                  Properties:
                                    ActiveColor: =nfColor.Primary
                                    ActiveColorHex: =If(nfIsDark, "3B82F6", "2563EB")
                                    ActiveIndicator: ="bar"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BadgeColor: =nfColor.DangerSolid
                                    FillPortions: =1
                                    InactiveColorHex: =If(nfIsDark, "94A3B8", "64748B")
                                    Items: |-
                                      =ForAll(
                                          nfNavMobile As m,
                                          {
                                              Icon: m.Icon,
                                              Label: m.Label,
                                              Badge: If(
                                                  m.ID = 2,
                                                  nfMyOpenCount,
                                                  0
                                              )
                                          }
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(
                                          _cmpNavSelID,
                                          LookUp(nfNavMobile, Idx = cmpRptBottomNav.SelectedItemIndex).ID
                                      );
                                      nfRoute(_cmpNavSelID)
                                    SelectedIndex: =Coalesce(LookUp(nfNavMobile, ID = _cmpNavSelID).Idx, 3)
                                    ShowLabels: ="always"
                                    Theme: =nfThemeName
      - conRptNavHost:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Sidebar
            Height: =Parent.Height
            Visible: =nfIsDesktop
            Width: =cmpRptSidebar.Width
          Children:
            - cmpRptSidebar:
                Control: CanvasComponent
                ComponentName: cmpSidebar
                Properties:
                  AccentColor: =nfColor.Primary
                  AppLogo: =
                  AppName: ="DocRouter"
                  AppNameAccent: =""
                  Expanded: =true
                  Height: =Parent.Height
                  Icons: =nfSidebarIcons
                  Items: |-
                    =Table(
                        { ID: 1,  Title: "Home",         Icon: "Home",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 2,  Title: "My Tasks",     Icon: "CheckSquare",     Letter: "",
                          Badge: nfMyOpenCount,
                          BadgeColor: nfColor.DangerSolid, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 3,  Title: "All Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 7,  Title: "My Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: 3, Visible: true },
                        { ID: 4,  Title: "Reports",      Icon: "Chart",    Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 90, Title: "",             Icon: "",         Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: true,  ParentID: -1, Visible: true },
                        { ID: 5,  Title: "Settings",     Icon: "Settings", Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 6,  Title: "Help",         Icon: "Help",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true }
                    )
                  OnFooterSettings: =false
                  OnHelp: =false
                  OnNavSelect: =nfRoute(cmpRptSidebar.SelectedID)
                  OnThemeToggle: |-
                    =Patch(
                        colUserPrefs,
                        First(colUserPrefs),
                        { ThemeName: If(nfIsDark, "Light", "Dark") }
                    );
                    ClearCollect(
                        colUserPrefs,
                        Filter(colUserPrefs, UserEmail = Lower(nfUserEmail))
                    )
                  OnToggle: =false
                  ShowFooterMenu: =true
                  ShowHeader: =true
                  ShowSearch: =false
                  ShowToggle: =true
                  ShowUser: =true
                  Theme: =If(nfIsDark, "Light", "Dark")
                  Width: =If(_cmpNavIsExpanded, 260, 64)
      - cmpRptFab:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =nfColor.Primary
            Disabled: =false
            Height: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      _fabSize + 12 + CountRows(Self.SpeedDialItems) * Self.ItemSize,
                      _fabSize
                  )
              )
            Icon: ="Plus"
            IconColor: ="#FFFFFF"
            ItemSize: =52
            Label: ="New Request"
            OnSelect: =Navigate(scrNewRequest, ScreenTransition.None)
            OnSpeedDialSelect: =false
            Size: ="regular"
            SpeedDialItems: |-
              =FirstN(
                  Table({ Icon: "Plus", Label: "New Request", Color: nfColor.Primary }),
                  0
              )
            Style: ="standard"
            Theme: =nfThemeName
            Visible: =!nfIsDesktop
            Width: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      ),
                      _iconSize: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 24,
                          "large", 36,
                          24
                      ),
                      _labelPad: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 28,
                          "large", 36,
                          28
                      ),
                      _maxLabelChars: If(
                          CountRows(Self.SpeedDialItems) > 0,
                          Max(Self.SpeedDialItems, Len(Label)),
                          0
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      Min(
                          Min(_maxLabelChars * 8 + 64, 240) + _labelPad + 20,
                          App.Width
                      ),
                      If(
                          Self.Style = "extended",
                          16 + _iconSize + 8 + Min(Len(Self.Label) * 8, 220) + 20,
                          _fabSize
                      )
                  )
              )
            X: =Parent.Width - Self.Width - nfSpace.Xl
            Y: =Parent.Height - Self.Height - (nfSpace.Xxl + nfHeights.bottomNav)
