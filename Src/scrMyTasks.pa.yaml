                        Filter(colUserPrefs, UserEmail = Lower(nfUserEmail))
                    )
                  OnToggle: =
                  ShowFooterMenu: =true
                  ShowHeader: =true
                  ShowSearch: =false
                  ShowToggle: =true
                  ShowUser: =true
                  Theme: =If(nfIsDark, "Light", "Dark")
                  Width: =If(_cmpNavIsExpanded, 260, 64)
      - cmpTskFab:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =nfColor.Primary
            Disabled: =false
            Height: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      _fabSize + 12 + CountRows(Self.SpeedDialItems) * Self.ItemSize,
                      _fabSize
                  )
              )
            Icon: ="Plus"
            IconColor: ="#FFFFFF"
            ItemSize: =52
            Label: ="New Request"
            OnSelect: =Navigate(scrNewRequest, ScreenTransition.None)
            OnSpeedDialSelect: =false
            Size: ="regular"
            SpeedDialItems: |-
              =FirstN(
                  Table({ Icon: "Plus", Label: "New Request", Color: nfColor.Primary }),
                  0
              )
            Style: ="standard"
            Theme: =nfThemeName
            Visible: =!nfIsDesktop
            Width: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      ),
                      _iconSize: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 24,
                          "large", 36,
                          24
                      ),
                      _labelPad: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 28,
                          "large", 36,
                          28
                      ),
                      _maxLabelChars: If(
                          CountRows(Self.SpeedDialItems) > 0,
                          Max(Self.SpeedDialItems, Len(Label)),
                          0
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      Min(
                          Min(_maxLabelChars * 8 + 64, 240) + _labelPad + 20,
                          App.Width
                      ),
                      If(
                          Self.Style = "extended",
                          16 + _iconSize + 8 + Min(Len(Self.Label) * 8, 220) + 20,
                          _fabSize
                      )
                  )
              )
            X: =Parent.Width - Self.Width - nfSpace.Xl
            Y: =Parent.Height - Self.Height - (nfSpace.Xxl + nfHeights.bottomNav)
      - cmpTskReroute:
          Control: CanvasComponent
          ComponentName: cmpDetReroute
          Properties:
            AssignmentKey: =locTskRerouteKey
            Height: =Parent.Height
            OnCancel: |-
              =UpdateContext(
                  {
                      locTskRerouteOpen: false,
                      locTskRerouteKey: ""
                  }
              );
              Reset(cmpTskReroute)
              // RESET ON CLOSE. A canvas component has no OnHidden, so both close
              // paths call Reset and OnReset clears the mode, the chosen person, the
              // reason and the picker.
            OnSubmit: |-
              =UpdateContext(
                  {
                      locTskRrBusy: true
                  }
              )
              // CAPTURE AND HAND OFF to tmrTskReroute, mirroring scrDetails. The
              // outputs are only readable while this event runs, so they are copied
              // into context variables rather than read from the timer.
              //
              // NO TOAST HERE. My Tasks has no toast surface, so the result is
              // reported with Notify on both paths rather than only on failure.
            Visible: =locTskRerouteOpen
            Width: =Parent.Width
      - cmpTskFinish:
          Control: CanvasComponent
          ComponentName: cmpDetFinish
          Properties:
            AssignmentKey: =locTskFinishKey
            Height: =Parent.Height
            OnCancel: |-
              =UpdateContext(
                  {
                      locTskFinishOpen: false,
                      locTskFinishKey: ""
                  }
              );
              Reset(cmpTskFinish)
              // RESET ON CLOSE, same reason as the reroute dialog above. Miss it and
              // the dialog reopens on the NEXT task still showing this one's outcome
              // and comment, which is one tap from completing the wrong task the
              // wrong way.
            OnSubmit: |-
              =// Hand off to tmrTskFinish and END THE CHAIN. Canvas does not repaint while
              // a behaviour formula runs, so calling the flow from here would freeze the
              // screen and the overlay would never appear.
              //
              // Self is the component and is not addressable from the timer, so the
              // outcome and comment are copied into context on the way past.
              //
              // The dialog is NOT closed here. On a failure the timer leaves it open so
              // the typed comment survives a retry.
              //
              // The old note here said this call site was deliberately not built, because
              // copying btnDetFinishApply would duplicate the advance rules onto a second
              // screen. That was right, and the flow owns the advance now, so this is one
              // function call and duplicates nothing.
              UpdateContext(
                  {
                      locTskFinishOutcome: Self.OutcomeKey,
                      locTskFinishComment: Coalesce(Self.Comment, ""),
                      locTskFinBusy: true
                  }
              )
            Visible: =locTskFinishOpen
            Width: =Parent.Width
      - tmrTskReroute:
          Control: Timer@2.1.0
          Properties:
            Duration: =60
            Height: =1
            OnTimerEnd: |-
              =IfError(
                  UpdateContext(
                      {
                          locTskRrRes:
                              { ok: false, code: "unreachable", message: "Rerouting would reassign this task and log the change to the audit trail. " & nfGateSuffix, requeststatus: "" }
                      }
                  ),
                  UpdateContext(
                      {
                          locTskRrRes:
                              {
                                  ok: false,
                                  code: "unreachable",
                                  message: "Could not reach the workflow. " & FirstError.Message,
                                  assignee: ""
                              }
                      }
                  )
              );
              If(
                  !locTskRrRes.ok,
                  UpdateContext({ locTskRrBusy: false });
                  Notify(locTskRrRes.message, NotificationType.Warning),
                  UpdateContext(
                      {
                          locTskRerouteOpen: false,
                          locTskRerouteKey: "",
                          locTskRrBusy: false
                      }
                  );
                  // Refresh IS REQUIRED. An earlier comment here said the opposite: that the
                  // galleries read the list directly so they would pick the change up on their
                  // own. They do read the list, and that is not the same thing.
                  //
                  // The FLOW changed the row SERVER SIDE, and Canvas holds a client-side cache of
                  // 'RequestAssignments' that a server-side write does not invalidate, so formulas
                  // kept answering from the old snapshot. The symptom was two figures on this
                  // screen disagreeing after a reroute.
                  ClearCollect(colTskPending, nfTskPending);
                  ClearCollect(colTskCompleted, nfTskCompleted);
                  Reset(cmpTskReroute);
                  Notify(locTskRrRes.message, NotificationType.Success)
              )
              // THE REQUEST KEY IS LOOKED UP, not passed. My Tasks holds an AssignmentKey
              // and nothing else about the request. AssignmentKey is indexed, so this is a
              // single-row delegable read.
              //
              // NO RELOAD AND NO NAVIGATE. Every gallery and count on this screen reads
              // nfTskPending or nfTskCompleted, which query the list directly, so they pick
              // the change up on their own. There is no collection here to refresh.
            Reset: =!locTskRrBusy
            Start: =locTskRrBusy
            Text: =""
            Visible: =false
            Width: =1
            X: =-20
            Y: =-20
      - tmrTskFinish:
          Control: Timer@2.1.0
          Properties:
            Duration: =60
            Height: =1
            OnTimerEnd: |-
              =Patch(
                  colAssignments,
                  LookUp(colAssignments, AssignmentKey = locTskFinishKey),
                  {
                      StatusKey: "Completed",
                      OutcomeKey: locTskFinishOutcome,
                      Comments: locTskFinishComment,
                      CompletedDate: Today(),
                      ActedByEmail: nfUserEmail
                  }
              );
              Collect(
                  colAudit,
                  {
                      ActionKey: "task",
                      ActorName: nfUserName,
                      Detail: LookUp(colAssignments, AssignmentKey = locTskFinishKey).Goal,
                      EntryStamp: Now(),
                      Meta: "",
                      RequestKey: LookUp(colAssignments, AssignmentKey = locTskFinishKey).RequestKey,
                      Title:
                          Switch(
                              locTskFinishOutcome,
                              "Approve", "Task Completed",
                              "Reject", "Task Rejected",
                              "SendBack", "Task Sent Back",
                              "Task Completed"
                          )
                  }
              );
              ForAll(
                  Filter(
                      colPhases,
                      RequestKey = LookUp(colAssignments, AssignmentKey = locTskFinishKey).RequestKey
                  ) As ph,
                  Patch(
                      colPhases,
                      LookUp(colPhases, PhaseKey = ph.PhaseKey),
                      {
                          PhaseStatusKey:
                              If(
                                  CountRows(
                                      Filter(
                                          colAssignments,
                                          PhaseKey = ph.PhaseKey,
                                          Required,
                                          StatusKey <> "Completed"
                                      )
                                  ) = 0,
                                  "Completed",
                                  ph.PhaseStatusKey
                              )
                      }
                  )
              );
              IfError(
                  UpdateContext(
                      {
                          locTskFinRes:
                              { ok: true, code: "ok", message: "", requeststatus: "" }
                      }
                  ),
                  UpdateContext(
                      {
                          locTskFinRes:
                              {
                                  ok: false,
                                  code: "unreachable",
                                  message: "Could not reach the workflow. " & FirstError.Message,
                                  requeststatus: ""
                              }
                      }
                  )
              );
              If(
                  locTskFinRes.code = "notactive" || locTskFinRes.code = "unreachable",

                  // Nothing was written. Drop the overlay and leave the dialog open so the
                  // typed comment survives. Same two codes scrDetails treats this way.
                  UpdateContext({ locTskFinBusy: false });
                  Notify(locTskFinRes.message, NotificationType.Warning),

                  // The flow completed the task and may have advanced the phase, which can
                  // change this user's open work. Refresh before anything re-reads: the write
                  // was SERVER SIDE and the client-side cache does not notice, so the counts
                  // would otherwise disagree with the list.
                  ClearCollect(colTskPending, nfTskPending);
                  ClearCollect(colTskCompleted, nfTskCompleted);
                  UpdateContext(
                      {
                          locTskFinishOpen: false,
                          locTskFinishKey: "",
                          locTskFinBusy: false
                      }
                  );
                  Reset(cmpTskFinish);
                  Notify(locTskFinRes.message, NotificationType.Success)
              )
              // THE REQUEST KEY IS LOOKED UP, not passed, exactly as the reroute timer does
              // it. My Tasks holds an AssignmentKey and nothing else about the request, and
              // AssignmentKey is indexed, so this is a single-row delegable read.
            Reset: =!locTskFinBusy
            Start: =locTskFinBusy
            Text: =""
            Visible: =false
            Width: =1
            X: =-20
            Y: =-20
      - cmpTskLoading:
          Control: CanvasComponent
          ComponentName: cmpLoadingSpinner
          Properties:
            Height: =Parent.Height
            LoadingText: |-
              =If(
                  locTskLoading,
                  "Loading your tasks",
                  locTskFinBusy,
                  "Completing your task and refreshing",
                  "Moving the task"
              )
            OverlayOpacity: =0.6
            ShowBlur: =true
            Theme: =nfThemeName
            Visible: =locTskLoading || locTskRrBusy || locTskFinBusy
            Width: =Parent.Width
