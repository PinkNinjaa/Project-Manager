                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 7,  Title: "My Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: 3, Visible: true },
                        { ID: 4,  Title: "Reports",      Icon: "Chart",    Letter: "", Badge: 0,
