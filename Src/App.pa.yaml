App:
  Properties:
    Formulas: |
      =// =============================================================================
      //  DocRouter — App.Formulas
      //  Paste into App > Formulas. Not OnStart.
      //
      //  Named formulas are DECLARATIVE. They take no parameters and cannot contain
      //  Patch, Collect, ClearCollect, Set, Navigate, Notify, or any other behavior
      //  function. Every entry below obeys that.
      //
      //  Identical in both product versions. Nothing here reads a list or a
      //  collection that differs between the collections demo and the SharePoint
      //  version, except where marked.
      // =============================================================================


      // -----------------------------------------------------------------------------
      //  IDENTITY
      //  Building blocks for permission checks. See the note on canManageRequest at
      //  the bottom of this file — it cannot live here.
      // -----------------------------------------------------------------------------

      nfIsFullVersion = false;
      nfFullVersionNote = "Available in the full version";
      nfUpgradeUrl = "powerappsui.com/apps";
      nfGatedMode = If(nfIsFullVersion, DisplayMode.Edit, DisplayMode.Disabled);
      nfGateSuffix = nfFullVersionNote & ". See " & nfUpgradeUrl;
      nfAppVersion = "1.0";
      nfCompanyName = "PowerApps UI";
      nfMoney(n: Number): Text = "$" & Text(n, "[$-en-US]#,##0");
      nfDay(d: DateTime): Text = Text(d, "mmm d, yyyy");

      nfDirectory = Table(
              { DisplayName: "Alicia Moreau",  Mail: "alicia.moreau@contoso.com",  JobTitle: "Contracts Lead",     Department: "Legal" },
              { DisplayName: "Ben Okafor",     Mail: "ben.okafor@contoso.com",     JobTitle: "Finance Analyst",    Department: "Finance" },
              { DisplayName: "Carla Jensen",   Mail: "carla.jensen@contoso.com",   JobTitle: "Programme Manager",  Department: "PMO" },
              { DisplayName: "Devin Aluko",    Mail: "devin.aluko@contoso.com",    JobTitle: "Records Officer",    Department: "Records" },
              { DisplayName: "Elena Petrova",  Mail: "elena.petrova@contoso.com",  JobTitle: "Compliance Officer", Department: "Compliance" },
              { DisplayName: "Farid Haddad",   Mail: "farid.haddad@contoso.com",   JobTitle: "Procurement Lead",   Department: "Procurement" },
              { DisplayName: "Grace Lin",      Mail: "grace.lin@contoso.com",      JobTitle: "Director",           Department: "Executive" },
              { DisplayName: "Hugo Marsh",     Mail: "hugo.marsh@contoso.com",     JobTitle: "IT Systems Lead",    Department: "IT" }
          );

      nfConfig = Table(
      // Departments
          { ConfigType: "Department", ConfigKey: "OPS",  Title: "Operations",             SortOrder: 1, Active: true, SlaDays: Blank(), DefaultTemplateKey: Blank() },
          { ConfigType: "Department", ConfigKey: "FIN",  Title: "Finance",                SortOrder: 2, Active: true, SlaDays: Blank(), DefaultTemplateKey: Blank() },
          { ConfigType: "Department", ConfigKey: "LEG",  Title: "Legal",                  SortOrder: 3, Active: true, SlaDays: Blank(), DefaultTemplateKey: Blank() },
          { ConfigType: "Department", ConfigKey: "IT",   Title: "Information Technology", SortOrder: 4, Active: true, SlaDays: Blank(), DefaultTemplateKey: Blank() },
          { ConfigType: "Department", ConfigKey: "HR",   Title: "Human Resources",        SortOrder: 5, Active: true, SlaDays: Blank(), DefaultTemplateKey: Blank() },
          { ConfigType: "Department", ConfigKey: "PROC", Title: "Procurement",            SortOrder: 6, Active: true, SlaDays: Blank(), DefaultTemplateKey: Blank() },
          // Categories — DefaultTemplateKey must match a real TemplateKey in colTemplates
          { ConfigType: "Category", ConfigKey: "StandardApproval", Title: "Standard Approval", SortOrder: 1, Active: true, SlaDays: Blank(), DefaultTemplateKey: "tpl-standard" },
          { ConfigType: "Category", ConfigKey: "ExpeditedReview",  Title: "Expedited Review",  SortOrder: 2, Active: true, SlaDays: Blank(), DefaultTemplateKey: "tpl-quick" },
          { ConfigType: "Category", ConfigKey: "DocumentReview",   Title: "Document Review",   SortOrder: 3, Active: true, SlaDays: Blank(), DefaultTemplateKey: "tpl-document" },
          { ConfigType: "Category", ConfigKey: "ChangeRequest",    Title: "Change Request",    SortOrder: 4, Active: true, SlaDays: Blank(), DefaultTemplateKey: "tpl-procurement" },
          // Processing types — SlaDays is a real number Flow adds to the start date
          { ConfigType: "ProcessingType", ConfigKey: "Standard",  Title: "Standard (3 business days)",  SortOrder: 1, Active: true, SlaDays: 3, DefaultTemplateKey: Blank() },
          { ConfigType: "ProcessingType", ConfigKey: "Expedited", Title: "Expedited (same day)",        SortOrder: 2, Active: true, SlaDays: 0, DefaultTemplateKey: Blank() },
          { ConfigType: "ProcessingType", ConfigKey: "Extended",  Title: "Extended (5+ business days)", SortOrder: 3, Active: true, SlaDays: 5, DefaultTemplateKey: Blank() }
      );

      nfDepartments     = Sort(Filter(nfConfig, ConfigType = "Department"),     SortOrder);
      nfProcessingTypes = Sort(Filter(nfConfig, ConfigType = "ProcessingType"), SortOrder);
      nfCategories      = AddColumns(
          Sort(Filter(nfConfig, ConfigType = "Category"), SortOrder) As c,
          Admins, nfUserEmail
      );

      nfUserEmail = Lower(User().Email);
      nfUserName  = Proper(User().FullName);


      // -----------------------------------------------------------------------------
      //  APP IDENTITY
      //  CLAUDE.md: gblAppName and gblAppNameAccent hold the app name, not
      //  environment variables. They are constants, so they are named formulas here
      //  rather than OnStart globals — always available, cannot be clobbered.
      //  The gbl* names in CLAUDE.md are kept as aliases in OnStart for any screen
      //  already written against them.
      //
      //  RENDERING: the name is ONE word and renders in ONE label. The accent is
      //  deliberately empty.
      //
      //  It used to be split, "Doc" plus "Router" in two adjacent labels with the
      //  accent in nfColor.Primary. It read as two words, because it is two labels
      //  with a gap between them and no way to close it. cmpSidebar hides its accent
      //  label on blank and widens the base label from a clamped 120 to
      //  Parent.Width - 106, so a blank accent is a supported configuration rather
      //  than a workaround.
      //
      //  Keep nfAppNameAccent as an empty string rather than deleting it. It is a
      //  required input on cmpSidebar, and a two tone name is a plausible future
      //  brand decision that should be one edit here.
      // -----------------------------------------------------------------------------

      nfAppName       = "DocRouter";
      nfAppNameAccent = "";


      // -----------------------------------------------------------------------------
      //  THEME — COLOR
      //  Two complete palettes with identical keys, plus a switch. Controls read
      //  nfColor and never a palette directly, so a theme change is one formula.
      //
      //  BOTH RECORDS MUST CARRY THE SAME 37 KEYS. If one is missing a key, every
      //  nfColor.<thatKey> reference fails on that theme only, which is the kind of
      //  defect that ships.
      //
      //  Never hardcode RGBA in a control property. Read from here.
      // -----------------------------------------------------------------------------

      nfColorLight = {

          // Brand and interaction
          Primary:        RGBA(37,  99, 235, 1),   // blue-600  — buttons, active nav, links
          PrimaryHover:   RGBA(29,  78, 216, 1),   // blue-700
          PrimarySoft:    RGBA(239, 246, 255, 1),  // blue-50   — selected row, info panel
          PrimaryBorder:  RGBA(191, 219, 254, 1),  // blue-200

          // Surfaces
          Canvas:         RGBA(248, 250, 252, 1),  // slate-50  — page background
          Surface:        RGBA(255, 255, 255, 1),  // white     — cards, header, table
          SurfaceAlt:     RGBA(241, 245, 249, 1),  // slate-100 — table head, card footer
          Sidebar:        RGBA(15,  23,  42, 1),   // slate-900
          SidebarHover:   RGBA(30,  41,  59, 1),   // slate-800
          Overlay:        RGBA(0,    0,   0, 0.5), // modal scrim

          // Text
          TextStrong:     RGBA(30,  41,  59, 1),   // slate-800 — headings, primary text
          TextBody:       RGBA(71,  85, 105, 1),   // slate-600
          TextMuted:      RGBA(100, 116, 139, 1),  // slate-500 — labels, secondary
          TextFaint:      RGBA(148, 163, 184, 1),  // slate-400 — timestamps, hints
          TextOnDark:     RGBA(255, 255, 255, 1),
          TextOnPrimary:  RGBA(255, 255, 255, 1),

          // Lines
          Border:         RGBA(226, 232, 240, 1),  // slate-200
          BorderStrong:   RGBA(203, 213, 225, 1),  // slate-300
          Divider:        RGBA(241, 245, 249, 1),  // slate-100

          // Semantic — paired fill/text/border per status badge in the mockup
          SuccessFill:    RGBA(220, 252, 231, 1),  // green-100
          SuccessText:    RGBA(21,  128,  61, 1),  // green-700
          SuccessBorder:  RGBA(187, 247, 208, 1),  // green-200
          SuccessSolid:   RGBA(34,  197,  94, 1),  // green-500 — progress fill, dots

          WarnFill:       RGBA(254, 243, 199, 1),  // amber-100
          WarnText:       RGBA(180,  83,   9, 1),  // amber-700
          WarnBorder:     RGBA(253, 230, 138, 1),  // amber-200
          WarnSolid:      RGBA(245, 158,  11, 1),  // amber-500

          DangerFill:     RGBA(254, 226, 226, 1),  // red-100
          DangerText:     RGBA(185,  28,  28, 1),  // red-700
          DangerBorder:   RGBA(254, 202, 202, 1),  // red-200
          DangerSolid:    RGBA(239,  68,  68, 1),  // red-500 — unread dot, overdue

          NeutralFill:    RGBA(241, 245, 249, 1),  // slate-100
          NeutralText:    RGBA(71,  85, 105, 1),   // slate-600
          NeutralBorder:  RGBA(226, 232, 240, 1),  // slate-200

          // Group marker (mockup uses purple only for group assignees)
          GroupFill:      RGBA(243, 232, 255, 1),  // purple-100
          GroupText:      RGBA(147,  51, 234, 1),  // purple-600

          Transparent:    RGBA(0, 0, 0, 0)
      };

      nfColorDark = {

          // Brand. Lifted and desaturated. blue-600 on near-black is muddy, so the
          // primary moves up and hover BRIGHTENS rather than darkens: on dark, a
          // darker hover reads as disabled.
          Primary:        RGBA(59, 130, 246, 1),
          PrimaryHover:   RGBA(96, 165, 250, 1),
          PrimarySoft:    RGBA(30,  58, 138, 0.28),
          PrimaryBorder:  RGBA(59, 130, 246, 0.45),

          // Surfaces. Elevation reads by getting LIGHTER, the opposite of light mode.
          // Sidebar drops below Canvas or the nav disappears into the page.
          Canvas:         RGBA(15,  23,  42, 1),
          Surface:        RGBA(30,  41,  59, 1),
          SurfaceAlt:     RGBA(51,  65,  85, 1),
          Sidebar:        RGBA(2,    6,  23, 1),
          SidebarHover:   RGBA(30,  41,  59, 1),
          Overlay:        RGBA(0,    0,   0, 0.7),

          // Text. Never pure white on dark; slate-100 avoids halation.
          TextStrong:     RGBA(241, 245, 249, 1),
          TextBody:       RGBA(203, 213, 225, 1),
          TextMuted:      RGBA(148, 163, 184, 1),
          TextFaint:      RGBA(100, 116, 139, 1),
          TextOnDark:     RGBA(241, 245, 249, 1),
          TextOnPrimary:  RGBA(255, 255, 255, 1),

          // Lines. Borders LIGHTEN against the surface instead of darkening.
          Border:         RGBA(51,  65,  85, 1),
          BorderStrong:   RGBA(71,  85, 105, 1),
          Divider:        RGBA(51,  65,  85, 1),

          // Semantic. Fills are translucent tints of their own solid, not pale
          // pastels: a light pastel on a dark surface glows and swamps its own text.
          // The tint borrows the surface underneath, so a badge on a card and the
          // same badge on the canvas both read without a second variant.
          SuccessFill:    RGBA(34, 197,  94, 0.18),
          SuccessText:    RGBA(134, 239, 172, 1),
          SuccessBorder:  RGBA(34, 197,  94, 0.40),
          SuccessSolid:   RGBA(34, 197,  94, 1),

          WarnFill:       RGBA(245, 158,  11, 0.18),
          WarnText:       RGBA(252, 211,  77, 1),
          WarnBorder:     RGBA(245, 158,  11, 0.40),
          WarnSolid:      RGBA(245, 158,  11, 1),

          DangerFill:     RGBA(239,  68,  68, 0.18),
          DangerText:     RGBA(252, 165, 165, 1),
          DangerBorder:   RGBA(239,  68,  68, 0.40),
          DangerSolid:    RGBA(248, 113, 113, 1),

          // NeutralFill stays OPAQUE while every other fill went translucent: it is
          // the default badge, and a tint of grey on grey is invisible.
          NeutralFill:    RGBA(51,  65,  85, 1),
          NeutralText:    RGBA(203, 213, 225, 1),
          NeutralBorder:  RGBA(71,  85, 105, 1),

          GroupFill:      RGBA(168,  85, 247, 0.20),
          GroupText:      RGBA(216, 180, 254, 1),

          Transparent:    RGBA(0, 0, 0, 0)
      };


      // -----------------------------------------------------------------------------
      //  THEME — THE SWITCH
      //  Reads colUserPrefs, not a global. One source of truth, and it is reactive:
      //  when Settings patches the preference the whole app recolours with no Set.
      //
      //  Coalesce covers the window before App.OnStart has loaded the collection, so
      //  the app renders Light rather than erroring. A user whose saved preference is
      //  Dark sees a brief light flash on launch. Accepted; fighting it is not worth
      //  the complexity.
      // -----------------------------------------------------------------------------

      nfThemeName = Coalesce(First(colUserPrefs).ThemeName, "Light");
      nfIsDark    = nfThemeName = "Dark";

      nfColor = If(nfIsDark, nfColorDark, nfColorLight);


      // -----------------------------------------------------------------------------
      //  THEME — TYPE SCALE
      //  PIXELS. Modern controls size text in pixels; classic controls size in points.
      //  Never carry a value across families unconverted — see layout-sizing.md s11.
      // -----------------------------------------------------------------------------

      nfType = {
          PageTitle:   28,   // "Good morning, Jordan", "All Requests"
          SectionHead: 20,   // modal titles
          CardTitle:   18,   // "Current Tasks", request title on Details
          Subhead:     16,
          ChromeTitle: 15,   // breadcrumb, top bar labels, tab labels
          Body:        14,   // default control text
          Small:       13,   // task card meta, buttons
          Initials:    13,   // avatar glyph, sized to the circle not to the scale
          Caption:     12,   // badges, table headers, field labels
          Micro:       11    // timestamps, "Assigned by"
      };

      // ChromeTitle is the rung between Body and Subhead. Chrome needs to sit above
      // body text and below any content heading, and without this rung it falls off
      // the bottom of the scale to Caption, which is what happened to the top bar
      // breadcrumb. At 16 it would be indistinguishable from Subhead and the top bar
      // would compete with the first heading in the gutter.
      //
      // Initials is not a rung in the reading hierarchy. It is a glyph sized to fit
      // the avatar circle, so it is deliberately independent of Caption even though
      // the two are close today. Changing Caption must not resize the avatar.
      //
      // SectionHead, CardTitle and Micro have no consumers yet. They are named for
      // screens not built (modals, Details, audit timestamps) and are kept rather
      // than re-derived later. Expect unused notices from the app checker.



      // -----------------------------------------------------------------------------
      //  THEME — SPACING AND RADIUS
      //  4px base grid, matching the mockup's Tailwind scale.
      // -----------------------------------------------------------------------------

      nfSpace = {
          Xxs: 2,
          Tight: 3,
          Xs:  4,
          Sm:  8,
          Md:  12,
          Lg:  16,   // default gap between cards
          Xl:  20,
          Xxl: 24,   // page padding
          Section: 32
      };

      nfSize = {
          Border:    1,   // every BorderThickness on every screen
          FocusRing: 2,   // house-rules s4 caps this at 2 on every control, no exceptions

          IconSm:   16,
          Icon:     20,
          IconLg:   24,

          HitTarget: 36,  // icon only control wells. Minimum comfortable tap area
          RowSm:    32,   // inputs, small buttons, icon wells
          Row:      40,   // primary buttons, avatar wells, filter bar rows
          RowLg:    56,

          Rail:      8,   // progress rail tick height. NOT a spacing value: a
                          // horizontal gallery's Height is its VIEWPORT, so this is
                          // what the whole rail gets. See house-rules section 7

          IconTile: 40    // square icon plate on a card, for example the My Tasks
                          // department badge. Merged in from a second nfSize that
                          // shadowed this one until August 2026. The other five keys
                          // it carried were superseded and unreferenced:
                          // SidebarExpanded and SidebarCollapsed by cmpSidebar owning
                          // its own width, HeaderHeight and AvatarMd by the responsive
                          // nfHeights.topBar and nfHeights.avatar, and RowHeight by
                          // RowLg above, which is the same 56.
      };

      // There are deliberately NO button width rungs here, and none should be added.
      // The seven button widths across the two screens are 72, 96, 100, 104, 110,
      // 120 and 150. They do not cluster: forcing them into three rungs would resize
      // four buttons to make the token table look tidy, which is the token tail
      // wagging the layout dog. A button's width is a function of its label, so it
      // belongs to the control, not to a scale. Where a fixed width is genuinely
      // needed, write the number and let it be visibly a decision.
      //
      // Line box heights are also absent on purpose. A label's height is a function
      // of its font size, not a rung: use AutoHeight, or RoundUp(nfType.X * 1.4, 0)
      // where a parent height formula needs a fixed reference.


      // -----------------------------------------------------------------------------
      //  TABLE COMPONENT CONFIG  (cmpMyTable)
      //
      //  cmpMyTable types its colours as "R,G,B,A" STRINGS, not Color, and parses
      //  them internally with Split and Value. A Color token cannot be passed: Power
      //  Fx has no channel extraction function, so nfColor cannot be converted.
      //
      //  These three blocks are therefore the palette written a second time, in
      //  string form. They live here rather than on a screen so the duplication
      //  happens once for the app instead of once per screen, and so a theme change
      //  is one edit. Three screens will consume them.
      //
      //  Recorded as a catalog defect in the tools repo NOTES.md. The upstream fix
      //  is a Color-typed config; until then this is the containment.
      //
      //  KEEP THESE VALUES IN STEP WITH nfColorLight AND nfColorDark BY HAND.
      // -----------------------------------------------------------------------------

      nfTableTheme = {
          container: {
              background: If(nfIsDark, "30,41,59,1", "255,255,255,1"),
              border: If(nfIsDark, "51,65,85,1", "226,232,240,1"),
              borderThickness: 1,
              radius: 12
          },
          header: {
              background: If(nfIsDark, "51,65,85,1", "241,245,249,1"),
              border: If(nfIsDark, "51,65,85,1", "226,232,240,1"),
              borderThickness: 1,
              textColor: If(nfIsDark, "148,163,184,1", "100,116,139,1"),
              fontSize: 12,
              fontWeight: "Semibold",
              height: 44
          },
          row: {
              background: "0,0,0,0",
              hoverBackground: If(nfIsDark, "51,65,85,0.5", "239,246,255,1"),
              borderColor: If(nfIsDark, "51,65,85,1", "241,245,249,1"),
              borderThickness: 1,
              height: 71
          },
          card: {
              background: If(nfIsDark, "30,41,59,1", "255,255,255,1"),
              border: If(nfIsDark, "51,65,85,1", "226,232,240,1"),
              borderThickness: 1,
              radius: 12,
              height: 184,
              gap: 16
          },
          list: {
              background: If(nfIsDark, "30,41,59,1", "255,255,255,1"),
              border: If(nfIsDark, "51,65,85,1", "226,232,240,1"),
              divider: If(nfIsDark, "51,65,85,1", "241,245,249,1"),
              text: If(nfIsDark, "241,245,249,1", "30,41,59,1"),
              textMuted: If(nfIsDark, "148,163,184,1", "100,116,139,1"),
              radius: 12
          },
          text: {
              primary: If(nfIsDark, "241,245,249,1", "30,41,59,1"),
              secondary: If(nfIsDark, "148,163,184,1", "100,116,139,1"),
              accent: If(nfIsDark, "59,130,246,1", "37,99,235,1"),
              fontFamily: "Segoe UI",
              fontSizeNormal: 13,
              fontSizeSmall: 12
          },
          spacing: { paddingLeft: 16, columnGap: 12 }
      };

      // These key off the nfStatusTable Title, not the StatusKey. That is the whole point of
      // the comment. Case is irrelevant: the component matches
      // Lower(StatusKey) = Lower(Text(ThisItem.Status)), lowercasing both sides, so writing
      // the keys here in any case works. Keying off the wrong field does not.
      //
      // The failure is silent. StatusKey "InProgress" lowercases to "inprogress", matches
      // no row, and the component falls through to its "default" row, which paints a grey
      // pill. Every row renders grey, nothing errors, and it reads as a deliberate neutral
      // style rather than a broken lookup.
      //
      // The Items formula on scrAllRequests resolves the key to the label before passing it,
      // LookUp(nfStatusTable, StatusKey = r.StatusKey).Title, so the label is what arrives and
      // the label is what these rows must carry.
      //  KEYED ON THE REAL StatusKey, AND CARRYING THE LABEL.
      //  This was keyed on lowercased display labels ("in progress"), which is why the
      //  screen had to resolve a label before passing it in. cmpMyTable now receives
      //  StatusKey straight off the row, so the key is what must match here. Label is
      //  new: it lets the component render the human text from the same table it uses
      //  for colour, instead of reaching into nfStatusTable.
      //
      //  A key that matches no row falls through to "default" and paints grey with no
      //  error, so this list must stay in step with nfStatusTable.
      nfTableStatus = Table(
          { StatusKey: "NotStarted", Label: "Not Started", Background: If(nfIsDark, "51,65,85,1",   "241,245,249,1"), TextColor: If(nfIsDark, "203,213,225,1", "71,85,105,1")  },
          { StatusKey: "InProgress", Label: "In Progress", Background: If(nfIsDark, "69,45,7,1",    "254,243,199,1"), TextColor: If(nfIsDark, "252,211,77,1",  "180,83,9,1")   },
          { StatusKey: "OnHold",     Label: "On Hold",     Background: If(nfIsDark, "69,10,10,1",   "254,226,226,1"), TextColor: If(nfIsDark, "252,165,165,1", "185,28,28,1")  },
          { StatusKey: "Completed",  Label: "Completed",   Background: If(nfIsDark, "5,46,22,1",    "220,252,231,1"), TextColor: If(nfIsDark, "134,239,172,1", "21,128,61,1")  },
          { StatusKey: "Suspended",  Label: "Suspended",   Background: If(nfIsDark, "69,45,7,1",    "254,243,199,1"), TextColor: If(nfIsDark, "252,211,77,1",  "180,83,9,1")   },
          { StatusKey: "Cancelled",  Label: "Cancelled",   Background: If(nfIsDark, "51,65,85,1",   "241,245,249,1"), TextColor: If(nfIsDark, "203,213,225,1", "71,85,105,1")  },
          { StatusKey: "default",    Label: "",            Background: If(nfIsDark, "51,65,85,1",   "241,245,249,1"), TextColor: If(nfIsDark, "203,213,225,1", "71,85,105,1")  }
      );

      // My Tasks lists, projected so the gallery template reads flat fields rather
      // than three lookups per row per property.
      //
      // THE PROJECTION IS DUPLICATED ON PURPOSE. It was a UDF, nfTskProject(rows:
      // Table): Table, and Studio rejected it: "Unknown type Table" and
      // "'nfTskProject' is an unknown or unsupported function". UDF parameter and
      // return types are scalars only. Named formulas take no parameters, so there is
      // no shared-projection route at all, and writing the fifteen lines twice is the
      // correct answer rather than a workaround. See house-rules section 7.
      //
      // DELEGATION. These filter colAssignments, an in-memory collection, so nothing
      // here is subject to a delegation limit. The limit is at the seed, in
      // App.OnStart, where colAssignments is filled from the list on the indexed
      // AssigneeEmail and StatusKey columns. A truncated seed gives a silently short
      // task list and wrong counts everywhere downstream. See CLAUDE.md Delegation.
      //
      // The joins to colRequests and colDepartments are LookUps against collections
      // and are local by the same reasoning.
      nfTskPending =
          SortByColumns(
              ForAll(
                  Filter(
                      nfMyAllLive,
                      // NOT "<> Completed": <> DOES NOT DELEGATE ON SHAREPOINT, and the
                      // warning it raises is real rather than cosmetic, because delegation
                      // composes through a named formula: this filter and nfMyAllLive fold
                      // into ONE server query, so one non-delegable operator drops the whole
                      // thing to the client. An OR of equalities delegates.
                      //
                      // Safe because StatusKey is a CLOSED SET of four, fixed by the data
                      // contract precisely so flow logic can depend on it. If a fifth open
                      // status is ever added, this line has to be extended with it.
                      StatusKey = "NotStarted" || StatusKey = "InProgress" || StatusKey = "OnHold"
                  ) As a,
                  //  ONE request fetch per row, from the LIST. It was two LookUps into
                  //  colRequests, a global load capped by the data row limit, so a task
                  //  whose request fell outside the fetched head rendered a BLANK title
                  //  and a blank priority. Raising the limit hid that rather than fixing
                  //  it: the cap moved, it did not go away.
                  //
                  //  RequestKey is indexed, so each fetch delegates. The cost is one
                  //  server call per assignment row, which is bounded because this set is
                  //  ONE user's work. If it ever needs to be cheaper, denormalise Title
                  //  onto RequestAssignments the way PhaseCount is denormalised onto
                  //  Requests, and drop the per-row fetch entirely.
                  With(
                  { r: LookUp(colRequests, RequestKey = a.RequestKey) },
                  {
                      AssignmentKey:  a.AssignmentKey,
                      RequestKey:     a.RequestKey,
                      RequestTitle:   r.Title,
                      DepartmentCode: a.DepartmentCode,
                      DepartmentName: LookUp(nfDepartments, ConfigKey = a.DepartmentCode).Title,
                      Goal:           a.Goal,
                      AssigneeName:   a.AssigneeName,
                      DueDate:        a.DueDate,
                      CompletedDate:  a.CompletedDate,
                      PriorityKey:    r.PriorityKey,
                      IsOverdue:      !IsBlank(a.DueDate) && a.DueDate < Today(),
                      DueLabel:
                          If(
                              IsBlank(a.DueDate),
                              "No due date",
                              a.DueDate = Today(),
                              "Today",
                              a.DueDate = DateAdd(Today(), 1, TimeUnit.Days),
                              "Tomorrow",
                              nfDay(a.DueDate)
                          )
                  }
                  )
              ),
              "DueDate",
              SortOrder.Ascending
          );

      nfTskCompleted =
          SortByColumns(
