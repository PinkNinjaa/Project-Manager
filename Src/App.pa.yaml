      // Category pill styling for the cmpMyTable Category column, which the component's
      // own contract calls Priority. That is why the rows are keyed PriorityKey while the
      // values are category names.
      //
      // These key off the colCategories Title, not the CategoryKey. Case is irrelevant:
      // the component matches Lower(PriorityKey) = Lower(Text(ThisItem.Priority)) and
      // lowercases both sides, so any case works here. Keying off the wrong field does not.
      //
      // The failure is silent, as with nfTableStatus. A CategoryKey that lowercases to
      // something no row carries matches nothing, falls through to the "default" row, and
      // paints a grey pill on every row with no error. It reads as a deliberate neutral
      // style rather than a broken lookup. See house-rules section 5.
      //
      // The Items formula on scrAllRequests resolves the key to the label before passing
      // it, so the label is what arrives and the label is what these rows must carry.
      //  KEYED ON THE REAL CategoryKey, AND CARRYING THE LABEL. Same reasoning as
      //  nfTableStatus. This feeds the component's PriorityConfig because that column
      //  carries categories, which is the recorded catalog defect; passing the key and
      //  a label is what finally makes the column honest.
      nfTableCategory = Table(
