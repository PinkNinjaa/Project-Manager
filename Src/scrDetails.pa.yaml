Screens:
  scrDetails:
    Properties:
      Fill: =nfColor.Canvas
      OnVisible: "=Set(_cmpNavSelID, 0);\n// ORDER MATTERS. ClearCollect(colDetFields, ...) must run AFTER\n// locDetKey is assigned. It previously ran before, so on a first visit\n// every LookUp inside it resolved against a blank key and every field\n// came back blank. It only looked correct because a context variable\n// survives between visits, so the second and later visits used the\n// PREVIOUS request's key.\n//\n// The UpdateContext below DECLARES both keys on this screen. A context\n// variable is only recognised on a screen that sets it; arriving by\n// Navigate does not declare it, and reading an undeclared one fails with\n// \"Name isn't valid\", which reads like a typo.\n//\n// The fallback reads nfActiveRequests, a named formula over the LIST. It was\n// First(colRequests), and the comment here used to explain that a named\n// formula cannot reference a collection built in App.OnStart because named\n// formulas evaluate first. True, and no longer relevant: the fallback no\n// longer needs a collection at all, so the constraint dissolved rather than\n// being worked around.\n//\n// CONSEQUENCE: the screen renders blank when SELECTED in the editor,\n// because OnVisible only fires on preview or navigation. That is\n// STRUCTURAL, not a defect. Press F5 to test.\n//\n// The fallback is also a production safeguard: a stale link to a\n// soft-deleted request renders the first available request rather than a\n// blank screen. If v1 needs a not-found state, this is the line to change.\nUpdateContext(\n    {\n        locRequestKey: Coalesce(locRequestKey, Param(\"RequestKey\"), First(nfActiveRequests).RequestKey),\n        locDetKey: Coalesce(locRequestKey, Param(\"RequestKey\"), First(nfActiveRequests).RequestKey),\n        locDetTab: \"routing\",\n        locDetActionsOpen: false,\n        locDetConfirmOpen: false,\n        locDetConfirmKind: \"\",\n        locDetEmailBusy: false,\n        locDetEmailFailed: false,\n        locDetConfBusy: false,\n        locDetRerouteOpen: false,\n        locDetRerouteKey: \"\",\n        locDetFinishOpen: false,\n        locDetFinishKey: \"\",\n        locDetBusy: false,\n        locDetLoading: true,\n        locDetSaveBusy: false,\n        locWfOpen: false,\n        locWfExpanded: 0}\n);\n// ONE UpdateContext, AND THE COALESCE IS WRITTEN TWICE ON PURPOSE.\n//\n// This was two calls: the first assigned locRequestKey, the second read\n// it to assign locDetKey. colRequests had 2 rows, so\n// First(colRequests).RequestKey was never blank, yet locDetKey came out\n// blank. The only way that happens is the second statement reading\n// locRequestKey as it was at the START of the formula rather than as the\n// first statement had just left it. A context variable written and then\n// read inside the same behaviour chain is not reliable.\n//\n// Both keys now derive from the same expression instead of one deriving\n// from the other, so there is no ordering dependency left to get wrong.\n// Inside a single UpdateContext record every right hand side sees the\n// PRE-UPDATE values, which is exactly what is wanted here: locRequestKey\n// on the right is the value passed in by Navigate, or blank.\n//\n// Do not \"simplify\" this by pointing locDetKey at locRequestKey. That is\n// the bug.\n// colDetFields is the ONE source for the 34 request fields. The rail\n// summary and the Request Details tab are two renderings of it, so a new\n// field is added here and shows up in both. A collection rather than a\n// named formula because it depends on locDetKey, and named formulas have\n// no screen scope.\n// REQUEST SCOPED CHILD LOADS. Each delegates on RequestKey, which is indexed,\n// and returns ONE request's rows rather than the head of the whole list. These\n// replace reads of colRequests, colPhases and colAssignments, which are global\n// loads TRUNCATED by the data row limit: a request whose children fell outside\n// that window rendered an empty Routing tab, an empty Audit trail and a blank\n// title, with no error anywhere to say so.\n//\n// These MUST run after the UpdateContext above, for the same reason colDetFields\n// does: locDetKey has no value before it.\n//\n// Scoped NAMES rather than rebuilding the shared collections, because collections\n// are app-global in Canvas and scrAllRequests reads colPhases for its preview\n// panel. Rebuilding it here would corrupt that screen instead.\nClearCollect(colDetReq,    Filter(colRequests,           RequestKey = locDetKey));\nClearCollect(colDetPhases, Sort(Filter(colPhases, RequestKey = locDetKey), PhaseOrder));\nClearCollect(colDetAssign, Filter(colAssignments, RequestKey = locDetKey));\n\nClearCollect(\n    colDetFields,\n    With(\n    { r: LookUp(colRequests, RequestKey = locDetKey) },\n    With(\n    { d: ParseJSON(r.DetailsJson) },\n    Table(\n    { Section: \"Overview\", FieldLabel: \"Description\",        FieldValue: Text(d.Description) },\n    { Section: \"Overview\", FieldLabel: \"Category\",           FieldValue: LookUp(nfCategories, ConfigKey = r.CategoryKey).Title },\n    { Section: \"Overview\", FieldLabel: \"Processing\",         FieldValue: LookUp(nfProcessingTypes, ConfigKey = r.ProcessingKey).Title },\n    { Section: \"Overview\", FieldLabel: \"Priority\",           FieldValue: r.PriorityKey },\n    { Section: \"Overview\", FieldLabel: \"Status\",             FieldValue: LookUp(nfStatusTable, StatusKey = r.StatusKey).Title },\n    { Section: \"Overview\", FieldLabel: \"Reference\",          FieldValue: Text(d.ReferenceNumber) },\n    { Section: \"Contacts\", FieldLabel: \"Primary contact\",    FieldValue: r.PrimaryPocName },\n    { Section: \"Contacts\", FieldLabel: \"Primary email\",      FieldValue: r.PrimaryPocEmail },\n    { Section: \"Contacts\", FieldLabel: \"Secondary contact\",  FieldValue: Text(d.SecondaryContact) },\n    { Section: \"Contacts\", FieldLabel: \"Secondary email\",    FieldValue: Text(d.SecondaryEmail) },\n    { Section: \"Contacts\", FieldLabel: \"Request admins\",     FieldValue: r.RequestAdmins },\n    { Section: \"Contacts\", FieldLabel: \"Parties of interest\",FieldValue: Text(d.PartiesOfInterest) },\n    { Section: \"Org\",      FieldLabel: \"Department\",         FieldValue: LookUp(nfDepartments, ConfigKey = r.DepartmentCode).Title },\n    { Section: \"Org\",      FieldLabel: \"Department name\",    FieldValue: Text(d.DepartmentName) },\n    { Section: \"Org\",      FieldLabel: \"Teams\",              FieldValue: Text(d.Teams) },\n    { Section: \"Org\",      FieldLabel: \"Approval level\",     FieldValue: Text(d.ApprovalLevel) },\n    { Section: \"Dates\",    FieldLabel: \"Created\",            FieldValue: nfDay(r.Created) },\n    { Section: \"Dates\",    FieldLabel: \"Last modified\",      FieldValue: nfDay(r.Modified) },\n    { Section: \"Dates\",    FieldLabel: \"Due\",                FieldValue: nfDay(r.RequestDueDate) },\n    { Section: \"Dates\",    FieldLabel: \"Requested by\",       FieldValue: nfDay(DateValue(Text(d.DateRequestedBy))) },\n    { Section: \"Dates\",    FieldLabel: \"Approved deadline\",  FieldValue: nfDay(r.ApprovedDeadline) },\n    { Section: \"Dates\",    FieldLabel: \"Extension\",          FieldValue: If(IsBlank(Text(d.ExtensionDate)), \"None\", nfDay(DateValue(Text(d.ExtensionDate)))) },\n    { Section: \"Dates\",    FieldLabel: \"Completed\",          FieldValue: If(IsBlank(r.CompletedDate), \"Not completed\", nfDay(r.CompletedDate)) },\n    { Section: \"Finance\",  FieldLabel: \"Budget\",             FieldValue: nfMoney(r.BudgetAmount) },\n    { Section: \"Finance\",  FieldLabel: \"Cost centre\",        FieldValue: r.CostCenter },\n    { Section: \"Finance\",  FieldLabel: \"Fiscal year\",        FieldValue: r.FiscalYear },\n    { Section: \"Finance\",  FieldLabel: \"Funding source\",     FieldValue: r.FundingSource },\n    { Section: \"Finance\",  FieldLabel: \"Project code\",       FieldValue: Text(d.ProjectCode) },\n    { Section: \"Document\", FieldLabel: \"Document type\",      FieldValue: Text(d.DocumentType) },\n    { Section: \"Document\", FieldLabel: \"Version\",            FieldValue: Text(d.DocVersion) },\n    { Section: \"Document\", FieldLabel: \"Classification\",     FieldValue: r.Classification },\n    { Section: \"Document\", FieldLabel: \"Links\",              FieldValue: Text(d.Links) },\n    { Section: \"Document\", FieldLabel: \"Restricted\",         FieldValue: If(Boolean(d.Restricted), \"Yes\", \"No\") },\n    { Section: \"Document\", FieldLabel: \"Expedited\",          FieldValue: If(Boolean(d.Expedited), \"Yes\", \"No\") }\n    )\n    )\n    )\n);\n\nClearCollect(\n            colDetAudit,\n            ForAll(\n                Sort(\n                    Filter(colAudit, RequestKey = locDetKey),\n                    EntryStamp,\n                    SortOrder.Descending\n                ) As a,\n                {\n                    EventTitle: Coalesce(\n                        a.Title,\n                        Switch(\n                            a.ActionKey,\n                            \"email\", \"Email Sent\",\n                            \"document\", \"Document Activity\",\n                            \"task\", \"Task Activity\",\n                            \"status\", \"Status Changed\",\n                            \"phase\", \"Phase Activity\",\n                            \"created\", \"Request Created\",\n                            \"Activity\"\n                        )\n                    ),\n                    EventDescription: Coalesce(a.Detail, \"\"),\n                    Author: Coalesce(a.ActorName, \"System\"),\n                    DisplayDateTime: If(\n                        DateValue(Text(a.EntryStamp, \"mm/dd/yyyy\")) = Today(),\n                        \"Today \" & Text(a.EntryStamp, \"h:mm AM/PM\"),\n                        nfDay(a.EntryStamp) & \" \" & Text(a.EntryStamp, \"h:mm AM/PM\")\n                    ),\n                    Category: Switch(\n                        a.ActionKey,\n                        \"email\", \"Emails\",\n                        \"document\", \"Documents\",\n                        \"task\", \"Tasks\",\n                        \"status\", \"Status Changes\",\n                        \"phase\", \"Phases\",\n                        \"System Events\"\n                    ),\n                    HasSubDetail: a.ActionKey = \"email\" && !IsBlank(a.Meta),\n                    SubTo: If(\n                        a.ActionKey = \"email\" && !IsBlank(a.Meta),\n                        Text(ParseJSON(a.Meta).to),\n                        \"\"\n                    ),\n                    SubCC: If(\n                        a.ActionKey = \"email\" && !IsBlank(a.Meta),\n                        Text(ParseJSON(a.Meta).cc),\n                        \"\"\n                    ),\n                    SubPriority: If(\n                        a.ActionKey = \"email\" && !IsBlank(a.Meta),\n                        Text(ParseJSON(a.Meta).priority),\n                        \"\"\n                    ),\n                    SubMessage: If(\n                        a.ActionKey = \"email\" && !IsBlank(a.Meta),\n                        Left(Text(ParseJSON(a.Meta).message), 600),\n                        \"\"\n                    )\n                }\n            )\n        );\n        // ADAPTER FROM RequestAudit TO cmpActivityTimeline. Source is the seven\n        // column contract: Title, RequestKey, ActionKey, ActorName, Detail,\n        // EntryStamp, Meta. The component reads a fixed ten column shape, so\n        // this ForAll is the seam and the only place the audit schema is\n        // touched. Category must match a Value in FilterOptions and a Category\n        // in IconMap on cmpDetAudit.\n        //\n        // META KEYS ARE THE ONE REMAINING GUESS: to, cc, priority, message,\n        // camelCase to match DefinitionJson. If the envelope uses different\n        // names, those four ParseJSON reads are the whole fix. A wrong key\n        // returns Blank() with no error, so the symptom is an email card whose\n        // envelope rows are empty rather than anything that fails loudly.\n        //\n        // Every Meta read is gated on ActionKey = \"email\". Meta carries a SECOND\n        // shape for send back keys, and that shape has none of these fields.\n        // Without the gate a send back row renders an empty email envelope.\n        //\n        // Meta is also gated on IsBlank. ParseJSON on an empty string errors and\n        // Meta is optional.\n        //\n        // Category never falls through to blank. A blank Category matches no\n        // filter and the row would vanish from every view including All\n        // Activities, so \"created\" and anything unmapped land in System Events.\n        //\n        // Detail is NOT capped. It is a Note and a long comment is legitimately\n        // shown in full. SubMessage IS capped at 600 per the component's own\n        // guidance to bound long values at the source.\n        //\n        // DELEGATION: RequestKey is the ONLY indexed column on RequestAudit, so\n        // the App.OnStart seed must filter on it server side. An audit trail is\n        // the list most likely to pass 2000 rows first, since entries accumulate\n        // forever and are never deleted.\n\n\n\n       \n        ClearCollect(\n            colDetOpen,\n            ForAll(\n                Distinct(colDetFields, Section) As d,\n                { SectionKey: d.Value }\n            )\n        );\n        Select(btnDetFieldsRebuild_1);\n        \n        Reset(tabDetTabs);\n        UpdateContext({ locDetLoading: false })\n        // EVERY SECTION OPEN ON ARRIVAL for Request Details. A detail tab that\n        // starts fully collapsed makes the user work to see anything, and the\n        // whole point of that tab is that the sidebar shows eight fields and it\n        // shows all 34.\n        //\n        // SMART DEFAULT ON ROUTING, which is different on purpose. Only the in\n        // progress phase opens. A uniform default is wrong in both directions:\n        // all closed makes the user hunt for the one thing they came for, all\n        // open is unusable once a request has a dozen phases. If nothing is\n        // InProgress every phase starts closed and the summary line on each\n        // header still says what happened.\n        //\n        // BOTH COLLECTIONS MUST BE SEEDED HERE rather than inside their rebuild\n        // buttons, because each rebuild READS its open set. Seeding inside would\n        // make first render depend on the order of two statements, which is the\n        // exact trap that left locDetKey blank.\n        //\n        // colRouteOpen holds phase AND comment expansion, separated by Kind."
    Children:
      - conDetRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingLeft: =If(nfIsDesktop, conDetNavHost.Width, 0)
            Width: =Parent.Width
          Children:
            - conDetMiddle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conDetRight:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conDetTopBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderStyle: =If(nfIsMobile, BorderStyle.None, BorderStyle.Solid)
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =If(nfIsMobile, nfColor.Transparent, nfColor.Surface)
                              FillPortions: =0
                              Height: =nfHeights.topBar
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(nfIsMobile, nfSpace.Sm, nfSpace.Md)
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMaxHeight: =nfHeights.topBar
                              LayoutMinHeight: =nfHeights.topBar
                              LayoutMinWidth: =0
                              PaddingRight: =If(nfIsMobile, nfSpace.Md, nfSpace.Xxl)
                            Children:
                              - conDetTitleGroup:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =2.5
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmpDetCrumbs:
                                        Control: CanvasComponent
                                        ComponentName: cmpBreadcrumbs
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          CharWidths: =nfCharWidths
                                          Config: |-
                                            ={
                                                Theme: If(nfIsDark, "dark", "light"),
                                                SeparatorIcon: "chevron",
                                                Gap: 4,
                                                Size: nfType.ChromeTitle,
                                                MaxItems: 4,
                                                ItemsBeforeCollapse: 1,
                                                ItemsAfterCollapse: 2,
                                                ActiveLastItem: false,
                                                BackButton: false
                                            }
                                          CurrentColor: =If(nfIsDark, "#F1F5F9", "#1E293B")
                                          Height: =nfHeights.breadcrumb
                                          Icons: =nfBreadcrumbIcons
                                          Items: |-
                                            =Table(
                                                { id: "home", label: "Home" },
                                                { id: "request", label: locDetKey }
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LinkColor: =If(nfIsDark, "#94A3B8", "#64748B")
                                          OnBack: =false
                                          OnSelect: =false
                                          Width: =Parent.Width
                              - lblDetUser:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =true
                                    Color: =nfColor.TextBody
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =nfType.Small
                                    Text: =nfUserName
                                    Visible: =nfIsDesktop
                                    Width: =180
                                    Wrap: =false
                              - conDetAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Primary
                                    FillPortions: =0
                                    Height: =nfHeights.avatar
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =nfHeights.avatar / 2
                                    RadiusBottomRight: =nfHeights.avatar / 2
                                    RadiusTopLeft: =nfHeights.avatar / 2
                                    RadiusTopRight: =nfHeights.avatar / 2
                                    Width: =nfHeights.avatar
                                  Children:
                                    - lblDetInitials:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          Color: =nfColor.TextOnPrimary
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =nfType.Initials
                                          Text: =nfInitials
                                          Width: =Parent.Width
                                          Wrap: =false
                        - conDetGutter:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Canvas
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =nfSpace.Xxl
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =nfSpace.Xxl
                              PaddingLeft: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingRight: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingTop: =nfSpace.Xxl
                              Width: =Parent.Width
                            Children:
                              - conDetDeletedBanner:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =nfColor.DangerBorder
                                    BorderThickness: =nfSize.Border
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.DangerFill
                                    FillPortions: =0
                                    Height: =nfSize.RowLg
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =nfSpace.Md
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =nfSpace.Lg
                                    PaddingRight: =nfSpace.Lg
                                    RadiusBottomLeft: =nfRadius.Lg
                                    RadiusBottomRight: =nfRadius.Lg
                                    RadiusTopLeft: =nfRadius.Lg
                                    RadiusTopRight: =nfRadius.Lg
                                    Visible: =Coalesce(LookUp(colDetReq, RequestKey = locDetKey).IsDeleted, false)
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - lblDetDeletedBanner:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Center
                                          AutoHeight: =true
                                          Color: =nfColor.DangerText
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Semibold
                                          Height: =nfType.Subhead
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =nfType.Body
                                          Text: ="This request is deleted. It is hidden from every view and nobody is being asked to act on it."
                                          Width: =Parent.Width
                                          Wrap: =false
                              - conDetHeader:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =nfColor.Border
                                    BorderThickness: =nfSize.Border
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Surface
                                    FillPortions: =0
                                    Height: |-
                                      =conDetActionBar.Height
                                      + conDetHeadTop.Height
                                      + conDetProgress.Height
                                      + 2 * Self.LayoutGap
                                      + Self.PaddingTop
                                      + Self.PaddingBottom
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =nfSpace.Md
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =nfSpace.Lg
                                    PaddingLeft: =nfSpace.Lg
                                    PaddingRight: =nfSpace.Lg
                                    PaddingTop: =nfSpace.Lg
                                    RadiusBottomLeft: =nfRadius.Lg
                                    RadiusBottomRight: =nfRadius.Lg
                                    RadiusTopLeft: =nfRadius.Lg
                                    RadiusTopRight: =nfRadius.Lg
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conDetActionBar:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          FillPortions: =0
                                          Height: =nfSize.RowSm
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =nfSpace.Md
                                          LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - conDetBackLink:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                FillPortions: =0
                                                Height: =nfSize.RowSm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =164
                                              Children:
                                                - imgDetBackIcon:
                                                    Control: Image@2.2.3
                                                    Properties:
                                                      AccessibleLabel: ="Det Back Icon icon"
                                                      FocusedBorderThickness: =0.5
                                                      Height: =nfSize.IconSm
                                                      Image: |-
                                                        ="data:image/svg+xml;utf8,"
                                                        & EncodeUrl(
                                                            Substitute(
                                                                "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='SWAPCOLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'/></svg>",
                                                                "SWAPCOLOR",
                                                                If(nfIsDark, "#60A5FA", "#2563EB")
                                                            )
                                                        )
                                                      TabIndex: =0
                                                      Width: =nfSize.IconSm
                                                      Y: =(Parent.Height - Self.Height) / 2
                                                - lblDetBackText:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Color: =nfColor.Primary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =Parent.Height
                                                      Size: =nfType.Small
                                                      Text: ="Back to Requests"
                                                      Width: =Parent.Width - nfSize.IconSm - nfSpace.Xs
                                                      Wrap: =false
                                                      X: =nfSize.IconSm + nfSpace.Xs
                                                - btnDetBackTop:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      BorderColor: =nfColor.Transparent
                                                      BorderThickness: =0
                                                      Color: =nfColor.Transparent
                                                      Fill: =nfColor.Transparent
                                                      FocusedBorderThickness: =0.5
                                                      Height: =Parent.Height
                                                      HoverBorderColor: =nfColor.Transparent
                                                      HoverColor: =nfColor.Transparent
                                                      HoverFill: =nfColor.Transparent
                                                      OnSelect: |-
                                                        =If(
                                                            IsBlank(locOriginScreen),
                                                            Back(),
                                                            Switch(
                                                                locOriginScreen,
                                                                "scrMyTasks", Navigate(scrMyTasks, ScreenTransition.None),
                                                                "scrAllRequests", Navigate(scrAllRequests, ScreenTransition.None),
                                                                "scrHome", Navigate(scrHome, ScreenTransition.None),
                                                                Back()
                                                            )
                                                        )
                                                      PressedBorderColor: =nfColor.Transparent
                                                      PressedColor: =nfColor.Transparent
                                                      PressedFill: =nfColor.Transparent
                                                      Text: =""
                                                      Tooltip: ="Back to Requests"
                                                      Width: =Parent.Width
                                          - conDetHeadBtns:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                FillPortions: =0
                                                Height: =nfSize.RowSm
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =nfSpace.Md
                                                LayoutJustifyContent: =LayoutJustifyContent.End
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =If(nfIsDesktop, 124 + 104 + nfSpace.Md, 104)
                                              Children:
                                                - btnDetEdit:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      AccessibleLabel: ="Edit Request"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Secondary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =nfSize.RowSm
                                                      Layout: =ButtonLayout.TextOnly
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =If(
                                                            nfIsFullVersion,
                                                            false,
                                                            Notify(
                                                                "Editing " & LookUp(colDetReq, RequestKey = locDetKey).Title
                                                                & " would update its fields and log the change to the audit trail. " & nfGateSuffix,
                                                                NotificationType.Information,
                                                                6000
                                                            )
                                                        )
                                                      Size: =nfType.Small
                                                      Text: ="Edit Request"
                                                      Visible: =nfIsDesktop
                                                      Width: =124
                                                - btnDetActions:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      AccessibleLabel: ="Actions"
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Appearance: =ButtonAppearance.Secondary
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =nfSize.RowSm
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =UpdateContext({ locDetActionsOpen: !locDetActionsOpen })
                                                      Size: =nfType.Small
                                                      Text: ="Actions"
                                                      Width: =104
                                    - conDetHeadTop:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          FillPortions: =0
                                          Height: =Max(conDetTitleCol.Height, nfSize.RowSm)
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =nfSpace.Md
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - conDetTitleCol:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                Height: |-
                                                  =conDetTitleRow.Height
                                                  + lblDetSub.Height
                                                  + Self.LayoutGap
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =nfSpace.Sm
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - conDetTitleRow:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: =RoundUp(nfType.PageTitle * 1.4, 0)
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =nfSpace.Md
                                                      LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblDetTitle:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Center
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            FillPortions: =1
                                                            FontWeight: =FontWeight.Semibold
                                                            Height: =Parent.Height
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.PageTitle
                                                            Text: =LookUp(colDetReq, RequestKey = locDetKey).Title
                                                            Wrap: =false
                                                      - conDetStatusPill:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: ManualLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Center
                                                            DropShadow: =DropShadow.None
                                                            Fill: |-
                                                              =Switch(
                                                                  LookUp(colDetReq, RequestKey = locDetKey).StatusKey,
                                                                  "InProgress", nfColor.WarnFill,
                                                                  "Completed", nfColor.SuccessFill,
                                                                  "OnHold", nfColor.DangerFill,
                                                                  nfColor.NeutralFill
                                                              )
                                                            FillPortions: =0
                                                            Height: =nfSize.RowSm
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            RadiusBottomLeft: =nfRadius.Pill
                                                            RadiusBottomRight: =nfRadius.Pill
                                                            RadiusTopLeft: =nfRadius.Pill
                                                            RadiusTopRight: =nfRadius.Pill
                                                            Width: =132
                                                          Children:
                                                            - lblDetStatus:
                                                                Control: ModernText@1.0.0
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  Align: =Align.Center
                                                                  Color: |-
                                                                    =Switch(
                                                                        LookUp(colDetReq, RequestKey = locDetKey).StatusKey,
                                                                        "InProgress", nfColor.WarnText,
                                                                        "Completed", nfColor.SuccessText,
                                                                        "OnHold", nfColor.DangerText,
                                                                        nfColor.NeutralText
                                                                    )
                                                                  FontWeight: =FontWeight.Semibold
                                                                  Height: =Parent.Height
                                                                  Size: =nfType.Small
                                                                  Text: =LookUp(nfStatusTable, StatusKey = LookUp(colDetReq, RequestKey = locDetKey).StatusKey).Title
                                                                  Width: =Parent.Width
                                                                  Wrap: =false
                                                - lblDetSub:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextMuted
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Small
                                                      Text: |-
                                                        =locDetKey
                                                        & "   •   "
                                                        & LookUp(nfCategories, ConfigKey = LookUp(colDetReq, RequestKey = locDetKey).CategoryKey).Title
                                                        & "   •   "
                                                        & LookUp(nfDepartments, ConfigKey = LookUp(colDetReq, RequestKey = locDetKey).DepartmentCode).Title
                                                        & "   •   "
                                                        & LookUp(colDetReq, RequestKey = locDetKey).PriorityKey
                                                        & " priority"
                                    - conDetProgress:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =nfColor.PrimaryBorder
                                          BorderThickness: =nfSize.Border
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.PrimarySoft
                                          FillPortions: =0
                                          Height: |-
                                            =cmpDetRail.Height
                                            + Self.PaddingTop
                                            + Self.PaddingBottom
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =nfSpace.Md
                                          PaddingLeft: =nfSpace.Md
                                          PaddingRight: =nfSpace.Md
                                          PaddingTop: =nfSpace.Md
                                          RadiusBottomLeft: =nfRadius.Md
                                          RadiusBottomRight: =nfRadius.Md
                                          RadiusTopLeft: =nfRadius.Md
                                          RadiusTopRight: =nfRadius.Md
                                        Children:
                                          - cmpDetRail:
                                              Control: CanvasComponent
                                              ComponentName: cmpProgressRail
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Colors: |-
                                                  ={
                                                      Ring:    nfColor.PrimarySoft,
                                                      Track:   nfColor.Border,
                                                      Header:  nfColor.TextStrong,
                                                      Muted:   nfColor.TextMuted,
                                                      Percent: nfColor.Primary
                                                  }
                                                HeaderText: |-
                                                  =With(
                                                      {
                                                          s: LookUp(colDetReq, RequestKey = locDetKey).StatusKey,
                                                          cur: Coalesce(
                                                              LookUp(
                                                                  colDetPhases,
                                                                  RequestKey = locDetKey && PhaseStatusKey = "InProgress"
                                                              ).Title,
                                                              ""
                                                          )
                                                      },
                                                      Switch(
                                                          s,
                                                          "NotStarted", "Not started",
                                                          "Completed", "All phases complete",
                                                          "OnHold",
                                                              If(IsBlank(cur), "On hold", "On hold at " & cur),
                                                          If(IsBlank(cur), "In progress", "Current: " & cur)
                                                      )
                                                  )
                                                Height: =Self.DesiredHeight
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PercentSuffix: ="% Complete"
                                                ShowEndLabels: =nfIsDesktop
                                                ShowHeader: =true
                                                ShowNodes: =true
                                                ShowPercent: =true
                                                StateMap: |-
                                                  =Table(
                                                      {
                                                          State: "Completed",
                                                          Label: "Completed",
                                                          NodeColor: nfColor.SuccessSolid,
                                                          TrackColor: nfColor.SuccessSolid,
                                                          TrackFill: 1,
                                                          Emphasize: false,
                                                          CountsAsDone: true,
                                                          IsCurrent: false
                                                      },
                                                      {
                                                          State: "InProgress",
                                                          Label: "In Progress",
                                                          NodeColor: nfColor.Primary,
                                                          TrackColor: nfColor.Primary,
                                                          TrackFill: 0.5,
                                                          Emphasize: true,
                                                          CountsAsDone: false,
                                                          IsCurrent: true
                                                      },
                                                      {
                                                          State: "OnHold",
                                                          Label: "On Hold",
                                                          NodeColor: nfColor.DangerSolid,
                                                          TrackColor: nfColor.DangerSolid,
                                                          TrackFill: 0.5,
                                                          Emphasize: true,
                                                          CountsAsDone: false,
                                                          IsCurrent: false
                                                      },
                                                      {
                                                          State: "NotStarted",
                                                          Label: "Not Started",
                                                          NodeColor: nfColor.BorderStrong,
                                                          TrackColor: nfColor.Border,
                                                          TrackFill: 0,
                                                          Emphasize: false,
                                                          CountsAsDone: false,
                                                          IsCurrent: false
                                                      },
                                                      {
                                                          State: "default",
                                                          Label: "Unknown",
                                                          NodeColor: nfColor.BorderStrong,
                                                          TrackColor: nfColor.Border,
                                                          TrackFill: 0,
                                                          Emphasize: false,
                                                          CountsAsDone: false,
                                                          IsCurrent: false
                                                      }
                                                  )
                                                Steps: |-
                                                  =ForAll(
                                                      Sort(
                                                          Filter(colDetPhases, RequestKey = locDetKey),
                                                          PhaseOrder
                                                      ) As p,
                                                      {
                                                          Order: p.PhaseOrder,
                                                          Title: p.Title,
                                                          State: p.PhaseStatusKey,
                                                          Detail: ""
                                                      }
                                                  )
                                                  // The ForAll is a COLUMN RENAME, not a state translation. The
                                                  // component takes Order, Title, State, Detail and colDetPhases
                                                  // carries PhaseOrder, Title, PhaseStatusKey. PhaseStatusKey goes
                                                  // through untouched, because StateMap above keys off the same
                                                  // four values the contract fixes. Keys never labels holds: no
                                                  // label is written into a filter or a comparison anywhere here.
                                                  //
                                                  // DELEGATION: colDetPhases is in memory, so this predicate is
                                                  // local and cannot hit a limit. It is loaded in OnVisible from
                                                  // 'RequestPhases' filtered on THIS request, delegated on the
                                                  // indexed RequestKey, so it holds one request's phases in full.
                                                  //
                                                  // It used to read colPhases, a GLOBAL load of the whole list
                                                  // truncated by the data row limit. The predicate was local then
                                                  // too, which is why this comment read as reassuring while the
                                                  // rail rendered empty for any request outside the fetched head.
                                                  // A local predicate over an incomplete collection is exactly as
                                                  // wrong as a non-delegable one, and says nothing at all.
                                                Style: |-
                                                  ={
                                                      RailHeight:      nfSize.Icon,
                                                      TrackThickness:  nfSize.Rail / 2,
                                                      NodeSize:        nfSize.Rail,
                                                      NodeCurrentSize: nfSize.Rail + nfSpace.Xs,
                                                      NodeRing:        nfSize.Border * 2,
                                                      NodeGap:         nfSpace.Xs,
                                                      StackGap:        nfSpace.Sm,
                                                      StepWidth:       96,
                                                      HeaderSize:      nfType.Small,
                                                      StepSize:        nfType.Micro,
                                                      LabelSize:       nfType.Micro
                                                  }
                                                Width: =Parent.Width - 2 * nfSpace.Md
                              - conDetSplit:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    LayoutDirection: |-
                                      =If(
                                          nfIsDesktop,
                                          LayoutDirection.Horizontal,
                                          LayoutDirection.Vertical
                                      )
                                    LayoutGap: =nfSpace.Lg
                                    LayoutMinHeight: |-
                                      =With(
                                          {
                                              mainMin:
                                                  If(conDetCurrent.Visible, conDetCurrent.Height + nfSpace.Lg, 0)
                                                  + tabDetTabs.Height
                                                  + nfSpace.Lg
                                                  + lblDetTabMinH.Height
                                          },
                                          If(
                                              nfIsDesktop,
                                              Max(conDetSidebar.Height, mainMin),
                                              conDetSidebar.Height + mainMin + Self.LayoutGap
                                          )
                                      )
                                      // Reads lblDetTabMinH.Height, the single carrier.
                                      //
                                      // On desktop this resolves to Max(sidebar, mainMin) and the sidebar
                                      // wins at about 560 whenever a tab needs less than that. That is why
                                      // every floor under 14 rows had no visible effect: the Switch was
                                      // being computed and then discarded by the Max.
                                      //
                                      // nfSpace.Lg above is conDetMain.LayoutGap, restated because Self
                                      // here is the split. It is the only duplication left.
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conDetMain:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Lg
                                          LayoutMinHeight: |-
                                            =If(conDetCurrent.Visible, conDetCurrent.Height + Self.LayoutGap, 0)
                                            + tabDetTabs.Height
                                            + Self.LayoutGap
                                            + lblDetTabMinH.Height
                                            // The split reserves the room from the gutter, this reserves it
                                            // from the split, and conDetTabBody claims it. All three read
                                            // the same carrier, so they cannot silently disagree.
                                          LayoutMinWidth: =0
                                        Children:
                                          - conDetCurrent:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =nfColor.Border
                                                BorderThickness: =nfSize.Border
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Surface
                                                FillPortions: =0
                                                Height: |-
                                                  =conDetCurHead.Height
                                                  + galDetCurrent.Height
                                                  + Self.LayoutGap
                                                  + Self.PaddingTop
                                                  + Self.PaddingBottom
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =nfSpace.Md
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =nfSpace.Lg
                                                PaddingLeft: =nfSpace.Lg
                                                PaddingRight: =nfSpace.Lg
                                                PaddingTop: =nfSpace.Lg
                                                RadiusBottomLeft: =nfRadius.Lg
                                                RadiusBottomRight: =nfRadius.Lg
                                                RadiusTopLeft: =nfRadius.Lg
                                                RadiusTopRight: =nfRadius.Lg
                                                Visible: |-
                                                  =CountRows(
                                                      Filter(colDetAssign, RequestKey = locDetKey, StatusKey = "InProgress")
                                                  ) > 0
                                              Children:
                                                - conDetCurHead:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: =nfSize.RowSm
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =nfSpace.Sm
                                                      LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblDetCurHeadTitle:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Center
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            FillPortions: =1
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.CardTitle
                                                            Text: ="Current Tasks"
                                                            Wrap: =false
                                                      - lblDetCurHeadCount:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            Align: =Align.Center
                                                            AlignInContainer: =AlignInContainer.Center
                                                            AutoHeight: =true
                                                            Color: =nfColor.WarnText
                                                            Fill: =nfColor.WarnFill
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =nfSpace.Xs
                                                            PaddingLeft: =nfSpace.Md
                                                            PaddingRight: =nfSpace.Md
                                                            PaddingTop: =nfSpace.Xs
                                                            RadiusBottomLeft: =nfRadius.Pill
                                                            RadiusBottomRight: =nfRadius.Pill
                                                            RadiusTopLeft: =nfRadius.Pill
                                                            RadiusTopRight: =nfRadius.Pill
                                                            Size: =nfType.Caption
                                                            Text: |-
                                                              =CountRows(
                                                                  Filter(colDetAssign, RequestKey = locDetKey, StatusKey = "InProgress")
                                                              )
                                                              & " pending"
                                                            Width: =92
                                                            Wrap: =false
                                                - galDetCurrent:
                                                    Control: Gallery@2.15.0
                                                    Variant: Vertical
                                                    Properties:
                                                      AccessibleLabel: ="Current list"
                                                      BorderColor: =nfColor.Transparent
                                                      DelayItemLoading: =false
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      FocusedBorderThickness: =0.5
                                                      Height: |-
                                                        =CountRows(
                                                            Filter(colDetAssign, RequestKey = locDetKey, StatusKey = "InProgress")
                                                        )
                                                        * If(
                                                            nfIsDesktop,
                                                            nfSize.RowLg + nfSpace.Md,
                                                            nfSize.RowLg + nfSize.RowSm + nfSpace.Xxl + nfSpace.Md
                                                        )
                                                        // WAS Self.AllItemsCount * Self.TemplateHeight, WHICH IS CIRCULAR.
                                                        // AllItemsCount is how many rows the gallery has actually loaded,
                                                        // and that depends on how tall the gallery is. It happens to
                                                        // settle correctly here, but the same expression collapsed a
                                                        // gallery to 4px inside cmpFileUpload. Counting the source and
                                                        // restating TemplateSize removes the cycle. Keep the multiplier
                                                        // in step with TemplateSize below.
                                                      Items: |-
                                                        =Sort(
                                                            Filter(
                                                                colDetAssign,
                                                                RequestKey = locDetKey,
                                                                StatusKey = "InProgress"
                                                            ),
                                                            AssignmentOrder
                                                        )
                                                      LoadingSpinner: =LoadingSpinner.None
                                                      ShowScrollbar: =false
                                                      TabIndex: =0
                                                      TemplatePadding: =0
                                                      TemplateSize: |-
                                                        =If(
                                                            nfIsDesktop,
                                                            nfSize.RowLg + nfSpace.Md,
                                                            nfSize.RowLg + nfSize.RowSm + nfSpace.Xxl + nfSpace.Md
                                                        )
                                                    Children:
                                                      - conDetCurRow:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            BorderColor: =nfColor.PrimaryBorder
                                                            BorderThickness: =nfSize.Border
                                                            DropShadow: =DropShadow.None
                                                            Fill: =nfColor.PrimarySoft
                                                            Height: =Parent.TemplateHeight - nfSpace.Md
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: |-
                                                              =If(
                                                                  nfIsDesktop,
                                                                  LayoutDirection.Horizontal,
                                                                  LayoutDirection.Vertical
                                                              )
                                                            LayoutGap: =nfSpace.Md
                                                            PaddingBottom: =If(nfIsDesktop, 0, nfSpace.Sm)
                                                            PaddingLeft: =nfSpace.Md
                                                            PaddingRight: =nfSpace.Md
                                                            PaddingTop: =If(nfIsDesktop, 0, nfSpace.Sm)
                                                            RadiusBottomLeft: =nfRadius.Lg
                                                            RadiusBottomRight: =nfRadius.Lg
                                                            RadiusTopLeft: =nfRadius.Lg
                                                            RadiusTopRight: =nfRadius.Lg
                                                            Width: =Parent.TemplateWidth - nfSpace.Sm
                                                            X: =nfSpace.Xs
                                                            Y: =(Parent.TemplateHeight - Self.Height) / 2
                                                          Children:
                                                            - conDetCurLead:
                                                                Control: GroupContainer@1.5.0
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  DropShadow: =DropShadow.None
                                                                  Fill: =nfColor.Transparent
                                                                  LayoutAlignItems: =LayoutAlignItems.Center
                                                                  LayoutDirection: =LayoutDirection.Horizontal
                                                                  LayoutGap: =nfSpace.Md
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                Children:
                                                                  - conDetCurDeptTile:
                                                                      Control: GroupContainer@1.5.0
                                                                      Variant: ManualLayout
                                                                      Properties:
                                                                        AlignInContainer: =AlignInContainer.Center
                                                                        DropShadow: =DropShadow.None
                                                                        Fill: =nfColor.Primary
                                                                        FillPortions: =0
                                                                        Height: =nfSize.IconTile
                                                                        LayoutMinHeight: =0
                                                                        LayoutMinWidth: =0
                                                                        RadiusBottomLeft: =nfRadius.MdLg
                                                                        RadiusBottomRight: =nfRadius.MdLg
                                                                        RadiusTopLeft: =nfRadius.MdLg
                                                                        RadiusTopRight: =nfRadius.MdLg
                                                                        Width: =nfSize.IconTile
                                                                      Children:
                                                                        - lblDetCurDept:
                                                                            Control: ModernText@1.0.0
                                                                            Properties:
                                                                              AccessibleLabel: ="Cur Dept"
                                                                              Align: =Align.Center
                                                                              Color: =nfColor.TextOnPrimary
                                                                              FontWeight: =FontWeight.Bold
                                                                              Height: =Parent.Height
                                                                              Size: =nfType.Caption
                                                                              Text: =Upper(ThisItem.DepartmentCode)
                                                                              Width: =Parent.Width
                                                                              Wrap: =false
                                                                  - conDetCurText:
                                                                      Control: GroupContainer@1.5.0
                                                                      Variant: AutoLayout
                                                                      Properties:
                                                                        DropShadow: =DropShadow.None
                                                                        Fill: =nfColor.Transparent
                                                                        LayoutAlignItems: =LayoutAlignItems.Stretch
                                                                        LayoutDirection: =LayoutDirection.Vertical
                                                                        LayoutGap: =nfSpace.Xxs
                                                                        LayoutJustifyContent: =LayoutJustifyContent.Center
                                                                        LayoutMinHeight: =0
                                                                        LayoutMinWidth: =0
                                                                      Children:
                                                                        - lblDetCurWho:
                                                                            Control: ModernText@1.0.0
                                                                            Properties:
                                                                              AccessibleLabel: ="Cur Who"
                                                                              AlignInContainer: =AlignInContainer.Stretch
                                                                              AutoHeight: =true
                                                                              Color: =nfColor.TextStrong
                                                                              FontWeight: =FontWeight.Semibold
                                                                              LayoutMinHeight: =0
                                                                              LayoutMinWidth: =0
                                                                              Size: =nfType.Small
                                                                              Text: |-
                                                                                =ThisItem.AssigneeName
                                                                                & "   •   "
                                                                                & LookUp(nfDepartments, ConfigKey = ThisItem.DepartmentCode).Title
                                                                                & "   •   "
                                                                                & LookUp(nfStatusTable, StatusKey = ThisItem.StatusKey).Title
                                                                              Wrap: =false
                                                                        - lblDetCurGoal:
                                                                            Control: ModernText@1.0.0
                                                                            Properties:
                                                                              AccessibleLabel: ="Cur Goal"
                                                                              AlignInContainer: =AlignInContainer.Stretch
                                                                              AutoHeight: =true
                                                                              Color: =nfColor.TextMuted
                                                                              LayoutMinHeight: =0
                                                                              LayoutMinWidth: =0
                                                                              Size: =nfType.Micro
                                                                              Text: |-
                                                                                =ThisItem.Goal
                                                                                & If(
                                                                                    IsBlank(ThisItem.DueDate),
                                                                                    "",
                                                                                    "   •   Due " & nfDay(ThisItem.DueDate)
                                                                                )
                                                                              Wrap: =false
                                                            - conDetCurBtns:
                                                                Control: GroupContainer@1.5.0
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  AlignInContainer: =If(nfIsDesktop, AlignInContainer.Center, AlignInContainer.End)
                                                                  DropShadow: =DropShadow.None
                                                                  Fill: =nfColor.Transparent
                                                                  FillPortions: =0
                                                                  Height: =nfSize.RowSm
                                                                  LayoutAlignItems: =LayoutAlignItems.Center
                                                                  LayoutDirection: =LayoutDirection.Horizontal
                                                                  LayoutGap: =nfSpace.Sm
                                                                  LayoutJustifyContent: =LayoutJustifyContent.End
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  Width: =2 * 96 + nfSpace.Sm
                                                                Children:
                                                                  - btnDetCurFinish:
                                                                      Control: ModernButton@1.0.0
                                                                      Properties:
