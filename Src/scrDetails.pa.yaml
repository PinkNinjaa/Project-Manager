                                                                        Image: |-
                                                                          ="data:image/svg+xml;utf8,"
                                                                          & EncodeUrl(
                                                                              Substitute(
                                                                                  Substitute(
                                                                                      "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='SWAPCOLOR' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='SWAPPTS'/></svg>",
                                                                                      "SWAPPTS",
                                                                                      If(ThisItem.IsOpen, "6 9 12 15 18 9", "9 18 15 12 9 6")
                                                                                  ),
                                                                                  "SWAPCOLOR",
                                                                                  If(nfIsDark, "#94A3B8", "#64748B")
