                                                              // that was itself sized from the component, and the
                                                              // component scrolls internally, so any overflow hid inside
                                                              // a nested scrollbar instead of extending the page.
                                                              // DesiredHeight breaks that: the component states its true
                                                              // height, the panel takes it, and the gutter scrolls.
                                                            Items: |-
                                                              =Table(
                                                                  { Id: "1", Name: "Requirements_v2.1.pdf",  SizeBytes: 2516582, UploadedOn: DateValue("11/08/2024"), UploadedBy: "Jordan Mitchell", Ext: "pdf" },
                                                                  { Id: "2", Name: "Budget_Breakdown.xlsx",  SizeBytes: 159744,  UploadedOn: DateValue("11/10/2024"), UploadedBy: "Sarah Johnson",   Ext: "xlsx" },
                                                                  { Id: "3", Name: "Technical_Specs.docx",   SizeBytes: 1153434, UploadedOn: DateValue("11/12/2024"), UploadedBy: "Taylor Bennett",  Ext: "docx" },
                                                                  { Id: "4", Name: "System_Architecture.png",SizeBytes: 911360,  UploadedOn: DateValue("11/14/2024"), UploadedBy: "Mike Chen",       Ext: "png" }
                                                              )
                                                              // PLACEHOLDER DATA, STILL. This is the same four row literal
                                                              // the harness uses, because the RequestDocuments schema has
                                                              // not been supplied. Replace with a colDetDocs adapter in
                                                              // OnVisible, the way colDetAudit adapts RequestAudit. The
                                                              // component needs Id, Name, SizeBytes, UploadedOn,
                                                              // UploadedBy, Ext, and SizeBytes must be a number of bytes
                                                              // because the footer totals it.
                                                            LayoutMinHeight: |
                                                              =Self.DesiredHeight
                                                            LayoutMinWidth: =0
                                                            MaxFileSize: =25
                                                            MaxFiles: =5
                                                            OnCancel: =false
                                                            OnDelete: |-
                                                              =false
                                                              // CALL SITE, NOT BUILT. Deleting a document in the library
                                                              // is a write and Flow owns it. The component raises this
                                                              // and removes nothing. Read cmpDetDocs.TappedId.
                                                            OnDownload: |-
                                                              =false
                                                              // CALL SITE, NOT BUILT.
                                                            OnDownloadAll: |-
                                                              =false
                                                              // CALL SITE, NOT BUILT.
                                                            OnSave: |-
                                                              =false
                                                              // CALL SITE, NOT BUILT. Upload hands cmpDetDocs.StagedFiles
                                                              // to Flow, which writes to RequestDocuments and appends a
                                                              // document row to RequestAudit. Clear _cmpDocStaged only
