                  Text: ="Resume Workflow"
                  Visible: |-
                    =!Coalesce(LookUp(colDetReq, RequestKey = locDetKey).IsDeleted, false)
                    && (LookUp(colDetReq, RequestKey = locDetKey).StatusKey = "Suspended")
            - btnDetActRestart:
