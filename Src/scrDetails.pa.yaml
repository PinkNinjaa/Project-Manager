                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AllowDelete: |-
                                                              =!(LookUp(colDetReq, RequestKey = locDetKey).StatusKey = "Completed")
                                                              // INVERTED ON PURPOSE. This property was ReadOnly on the old component and a
                                                              // straight carry-across would have enabled deletion on exactly the requests
                                                              // that are meant to be locked, with nothing to error on. ReadOnly true meant
                                                              // no editing; AllowDelete true means deletion is allowed.
                                                              //
                                                              // The old ReadOnly did two jobs the new component splits apart, the dropzone
