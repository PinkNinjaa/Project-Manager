      - lblDetTabMinH:
          Control: ModernText@1.0.0
          Properties:
            AccessibleLabel: ="Layout measurement"
            Height: |-
              =Switch(
                  locDetTab,
                  "documents", cmpDetDocs.Height + 2 * nfSpace.Md,
                  "audit", If(nfIsDesktop, 16 * nfSize.Row, 14 * nfSize.Row),
                  "routing", conRtRouting.Height + 2 * nfSpace.Md,
                  "details", If(nfIsDesktop, 14 * nfSize.Row, 16 * nfSize.Row),
                  If(nfIsDesktop, 10 * nfSize.Row, 12 * nfSize.Row)
              )
              // THE ONE PLACE TABS ARE ENUMERATED. Three formulas read this
              // number: conDetTabBody.LayoutMinHeight, conDetMain
              // .LayoutMinHeight and conDetSplit.LayoutMinHeight. It used to be
              // a Switch copied into all three, which meant building a tab was
              // a three file edit and forgetting one left the tallest winning
              // silently.
              //
              // A hidden control carrying a computed number is the house
              // pattern already: cmpActivityTimeline uses lblCardHeight the same
              // way, and btnDetWfRebuild does it for behaviour. Height rather
              // than Text avoids a Value() conversion at every read site.
              //
              // "documents" is CONTENT DRIVEN. cmpDetDocs.Height is that
              // component's DesiredHeight, computed from its own inputs, so the
              // panel grows with the number of files rather than holding a guess
              // that is wrong at 2 and wrong again at 20. Not circular:
              // DesiredHeight never reads layout.
              //
              // The rest are deliberate floors, not measurements. Raise the
              // number for a tab that feels cramped. Mobile is taller than
              // desktop because a narrow column wraps more and the page is
              // expected to scroll.
              //
              // AutoHeight false is REQUIRED. This control exists to report a
              // Height, and AutoHeight would override it with the height of its
              // blank text.
            Text: =""
            Visible: =false
            Width: =1
      - cmpDetEmail:
          Control: CanvasComponent
          ComponentName: cmpSendEmail
          Properties:
            Busy: =Coalesce(locDetEmailBusy, false)
            Config: |-
              ={
                  Theme: If(nfIsDark, "dark", "light"),
                  Accent: "#2563EB",
                  Radius: nfRadius.Xl,
                  Width: 480,
                  MaxNote: 2000,
                  ShowPriority: true,
                  ShowCc: true,
                  LockSubject: false
              }
              // PASSED EXPLICITLY. The docs warn that a Record input's default does not
              // reach a pasted instance, so a partly-specified Config is not an option:
              // every key is given a value here.
            ContextHtml: |-
              =With(
                  { r: LookUp(colDetReq, RequestKey = locDetKey) },
                  "<table role='presentation' cellpadding='0' cellspacing='0' border='0' width='100%'>"
                  & "<tr><td style='padding:2px 0;color:#64748B;width:90px;'>Request</td>"
                  & "<td style='padding:2px 0;color:#0F172A;font-weight:600;'>" & locDetKey & "</td></tr>"
                  & "<tr><td style='padding:2px 0;color:#64748B;'>Title</td>"
                  & "<td style='padding:2px 0;color:#0F172A;'>" & Coalesce(r.Title, "") & "</td></tr>"
                  & "<tr><td style='padding:2px 0;color:#64748B;'>Status</td>"
                  & "<td style='padding:2px 0;color:#0F172A;'>"
                  & Coalesce(LookUp(nfStatusTable, StatusKey = r.StatusKey).Title, r.StatusKey) & "</td></tr>"
                  & "<tr><td style='padding:2px 0;color:#64748B;'>Due</td>"
                  & "<td style='padding:2px 0;color:#0F172A;'>"
                  & If(IsBlank(r.RequestDueDate), "not set", nfDay(r.RequestDueDate))
                  & "</td></tr></table>"
              )
              // SINGLE-QUOTED ATTRIBUTES throughout, per the docs: doubling every double
              // quote inside a Power Fx string makes a template this size unreadable, and
              // every mail client accepts single quotes.
              //
              // A TABLE, NOT DIVS, because Outlook on Windows renders through Word.
              //
              // ContextHtml IS THE ONE SLOT PASSED RAW. The note and the signature are
              // escaped by the component; this is not. r.Title is USER TEXT and is the one
              // value here that could carry markup, which the docs call out as the usual
              // candidate. Left unescaped deliberately for now: Power Fx has no HTML encoder,
              // and a Substitute chain here would be a half-measure worth doing properly.
            ContextLine: =locDetKey & "  -  " & Coalesce(LookUp(colDetReq, RequestKey = locDetKey).Title, "")
            DefaultSubject: =locDetKey & " - " & Coalesce(LookUp(colDetReq, RequestKey = locDetKey).Title, "")
            Directory: |-
              =If(
                  IsBlank(Trim(Self.SearchText)),
                  nfDirectory,
                  nfDirectory
              )
              // SUGGESTIONS WHEN IDLE, DIRECTORY WHEN TYPING: the pattern the component docs
              // call the one worth building for a real app. An untouched picker opens from
              // nfDirectory with no connector call at all, and the live search runs only
              // once the sender types.
              //
              // THIS IS WHAT SearchText WAS ADDED FOR. An earlier attempt put an
              // unconditional Office365Users.SearchUser in this property and the compile
              // failed with NO diagnostics, reporting as a dead session; the component had no
              // way to feed a query back then.
              //
              // Self.SearchText, not the instance name: both resolve, Self survives a rename.
              //
              // DelayOutput is set on both pickers inside the component, so this re-evaluates
              // when the sender pauses rather than once per keystroke, against a connector
              // that throttles per user per connection.
            Height: =App.Height
            OnCancel: |-
              =UpdateContext({ locDetEmailOpen: false, locDetEmailBusy: false });
              Reset(cmpDetEmail)
            OnSend: |-
              =UpdateContext({ locDetEmailBusy: true, locDetEmailFailed: false });
              IfError(
                  Notify("Trial mode: the email was not sent.", NotificationType.Information),
                  UpdateContext({ locDetEmailFailed: true });
                  Notify("Could not send. " & FirstError.Message, NotificationType.Error)
              );
              UpdateContext({ locDetEmailBusy: false });
              If(
                  !locDetEmailFailed,
                  Collect(colAudit,
                      {
                          Title: "Email Notification Sent",
                          RequestKey: locDetKey,
                          ActionKey: "email",
                          ActorName: nfUserName,
                          Detail: Self.Subject,
                          EntryStamp: Now(),
                          Meta:
                              "{""to"":""" & Self.ToAddresses
                              & """,""cc"":""" & Self.CcAddresses
                              & """,""priority"":""" & If(IsBlank(Self.Priority), "Normal", Self.Priority)
                              & """,""message"":""" & Substitute(Self.Note, """", "'")
                              & """}"
                      }
                  );
                  UpdateContext(
                      {
                          locDetEmailOpen: false}
                  );
                  Reset(cmpDetEmail)
              )
              // RESET ONLY ON SUCCESS, per the docs: a failed send that also clears the
              // dialog throws away the recipients and the note the sender just typed, with no
              // way back. On failure the dialog stays open, still populated, and Busy is
              // cleared so they can try again.
              //
              // A SEPARATE FAILED FLAG rather than reusing Busy as the success test. Busy has
              // to be cleared on BOTH paths, so it cannot also carry the outcome.
              //
              // AUDIT OFF Note, NOT Body, per the docs: Body is escaped markup and would read
              // as entity soup in the audit trail. Detail carries the subject, Meta the note.
              //
              // Meta IS BUILT BY HAND rather than with JSON(), which would escape the record
              // again. Quotes inside the note become apostrophes: one unescaped quote breaks
              // the JSON for every reader of the row, and the Audit tab parses it per entry.
            Signature: ="Sent by " & nfUserName & " from DocRouter."
            Title: ="Send an email"
            Visible: =locDetEmailOpen
            Width: |-
              =App.Width
              // SET EXPLICITLY. The docs note a pasted instance arrives at 600 whatever
              // the property says, and that Height survives a paste while Width does not.
      - cmpDetWorkflow:
          Control: CanvasComponent
          ComponentName: cmpDetEditWorkflow
          Properties:
            Height: =Parent.Height
            OnCancel: |-
              =UpdateContext({ locWfOpen: false })
            OnSave: |-
              =UpdateContext(
                  {
                      locDetSaveBusy: true
                  }
              )
              // RAISES A FLAG AND STOPS. tmrDetSave watches locDetSaveBusy and makes the
              // call, which is how every other flow call site on this screen works. Two
              // reasons it is not called from here.
              //
              // THE OVERLAY NEEDS A FRAME TO PAINT IN. A blocking flow call in this same
              // handler leaves the screen unchanged until it returns.
              //
              // AND THE RESPONSE HAS TO BE READ IN A FRESH CHAIN. The previous version
              // called the flow here and then branched on If(locDetBusy, ...), a context
              // variable set by the first statement of the SAME chain. When that reads as
              // its pre-chain value the entire success block, Refresh and ClearCollect
              // included, does not run: the flow had already written to SharePoint, so the
              // save worked and nothing reloaded.
              //
              // ITS OWN FLAG, NOT locDetBusy. tmrDetWork carries Start: =locDetBusy, so
              // raising that flag from here also fired CompleteAssignment with a blank
              // assignment key.
              //
              // THE DRAFTS ARE STASHED AS JSON HERE because Self is this component and is
              // not reachable from a timer sitting at screen level.
            RequestKey: =locDetKey
            RequireResolved: =
            SeedTemplateKey: =
            Visible: =locWfOpen
            Width: =Parent.Width
      - cmpDetReroute_1:
          Control: CanvasComponent
          ComponentName: cmpDetReroute
          Properties:
            AssignmentKey: =locDetRerouteKey
            Height: =Parent.Height
            OnCancel: |-
              =UpdateContext(
                  {
                      locDetRerouteOpen: false,
                      locDetRerouteKey: ""
                  }
              );
              Reset(cmpDetReroute_1)
              // RESET ON CLOSE. A canvas component has no OnHidden, so both close
              // paths call Reset and OnReset clears the mode, the chosen person, the
              // reason and the picker.
            OnSubmit: |-
              =UpdateContext(
                  {
                      locDetRrBusy: true
                  }
              )
              // CAPTURE AND HAND OFF. The flow call is in tmrDetReroute, not here,
              // for the same reason Finish does it that way: a call made in this
              // handler runs before the loading overlay paints, so the user gets a
              // frozen dialog and no feedback.
              //
              // Self.Mode, Self.AssigneeEmail and Self.Reason are only readable while
              // this event is running, which is why they are copied into context
              // variables rather than read from the timer.
              //
              // THE DIALOG DOES NOT CLOSE HERE and Reset is not called. On any failure
              // the timer leaves both alone so the typed reason survives a retry. Only
              // the success branch closes and resets.
            Visible: =locDetRerouteOpen
            Width: =Parent.Width
      - cmpDetFinish_1:
          Control: CanvasComponent
          ComponentName: cmpDetFinish
          Properties:
            AssignmentKey: =locDetFinishKey
            Height: =Parent.Height
            OnCancel: |-
              =UpdateContext(
                  {
                      locDetFinishOpen: false,
                      locDetFinishKey: ""
                  }
              );
              Reset(cmpDetFinish_1)
              // RESET ON CLOSE. A canvas component has no OnHidden, so nothing inside
              // it can notice that it stopped being visible. Both close paths call
              // Reset here, and OnReset inside the component clears the outcome and
              // the comment.
              //
              // Miss it and the dialog reopens on the NEXT task still showing this
              // one's answer, with the Approve button lit and a comment already in
              // the box. That is one tap from completing the wrong task the wrong way.
            OnSubmit: |-
              =// Hand off to tmrDetWork and END THE CHAIN. Canvas does not repaint while a
              // behaviour formula runs, so calling the flow from here would freeze the screen
              // and the overlay would never appear.
              //
              // Self is the component and is not addressable from the timer, so the outcome
              // and comment are copied into context on the way past.
              UpdateContext(
                  {
                      locDetBusy: true
                  }
              )
            Visible: =locDetFinishOpen
            Width: =Parent.Width
      - cmpDetOverride:
          Control: CanvasComponent
          ComponentName: cmpEnhancedDialog
          Properties:
            BorderRadius: =
            Buttons: |-
              =Table(
                  { Label: "Cancel",       ButtonType: "Secondary", Action: "Cancel",  Visible: true },
                  { Label: "Not Started",  ButtonType: "Outline",   Action: "NotStarted", Visible: true },
                  { Label: "In Progress",  ButtonType: "Outline",   Action: "InProgress", Visible: true },
                  { Label: "Completed",    ButtonType: "Primary",   Action: "Completed",  Visible: true }
              )
              // THREE TARGETS, NOT SIX. OnHold and Suspended are request level and
              // setting one on a single assignment produces a state the engine would
              // never generate. Cancelled is not a task state at all.
              //
              // THE TARGET IS THE BUTTON. The action a dialog button carries is
              // exactly the status to write, so there is no separate picker and no way
              // to press confirm without having chosen.
            DialogHeight: =
            DialogType: ="Form"
            DialogWidth: =460
            HeaderText: ="Override task status"
            Height: =Parent.Height
            IconName: ="Warning"
            IsTextInputRequired: |-
              =true
              // A REASON IS MANDATORY. An override writes no OutcomeKey and no
              // completion comment, so this audit row is the ONLY record of why a task
              // changed state with nobody having done the work. Without it an override
              // is indistinguishable from a bug in the advance rules.
            MessageText: |-
              =With(
                  { a: LookUp(colDetAssign, AssignmentKey = locDetOvrKey) },
                  a.AssigneeName & "  -  " & a.Goal
                  & Char(10)
                  & "Currently "
                  & Coalesce(LookUp(nfStatusTable, StatusKey = a.StatusKey).Title, a.StatusKey)
                  & ". Choose the status to set, and say why."
              )
            OnButtonSelect: |-
              =If(
                  Self.SelectedButton.Action <> "Cancel",
                  UpdateContext(
                      {
                          locDetOvrTarget: Self.SelectedButton.Action,
                          locDetOvrReason: Self.InputText
                      }
                  );
                  Select(btnDetOverrideApply)
              );
              UpdateContext({ locDetOvrOpen: false })
              // Self, NOT cmpDetOverride. On an INSTANCE the control is Self; the
              // component name form is for inside a definition. Naming yourself here
              // resolves to nothing and the handler silently never fires.
            OnCloseSelect: |-
              =UpdateContext({ locDetOvrOpen: false })
            OverlayBlurColor: =
            PlaceholderText: ="Why is this being overridden"
            ShowCloseIcon: =true
            Theme: =If(nfIsDark, "Dark", "Light")
            Visible: =locDetOvrOpen
            Width: =Parent.Width
      - btnDetOverrideApply:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Fill: =nfColor.Transparent
            FocusedBorderThickness: =0.5
            Height: =1
            OnSelect: |-
              =With(
                  { a: LookUp(colDetAssign, AssignmentKey = locDetOvrKey) },
                  Patch(
                      colDetAssign,
                      LookUp(colDetAssign, AssignmentKey = locDetOvrKey),
                      {
                          StatusKey: locDetOvrTarget,
                          ActedByEmail: nfUserEmail,
                          OutcomeKey: If(locDetOvrTarget = "Completed", a.OutcomeKey),
                          CompletedDate:
                              If(
                                  locDetOvrTarget = "Completed",
                                  Coalesce(a.CompletedDate, Today())
                              ),
                          StartDate:
                              If(
                                  locDetOvrTarget <> "NotStarted",
                                  Coalesce(a.StartDate, Today())
                              ),
                          DueDate:
                              If(
                                  locDetOvrTarget <> "NotStarted",
                                  Coalesce(a.DueDate, DateAdd(Today(), a.DurationDays, TimeUnit.Days))
                              )
                      }
                  );
                  Collect(
                      colAudit,
                      {
                          ActionKey: "status",
                          ActorName: nfUserName,
                          Detail:
                              a.AssigneeName & " - " & a.Goal
                              & ": " & Coalesce(LookUp(nfStatusTable, StatusKey = a.StatusKey).Title, a.StatusKey)
                              & " to " & Coalesce(LookUp(nfStatusTable, StatusKey = locDetOvrTarget).Title, locDetOvrTarget)
                              & "  -  " & locDetOvrReason,
                          EntryStamp: Now(),
                          Meta:
                              "{""assignmentKey"":""" & a.AssignmentKey
                              & """,""from"":""" & a.StatusKey
                              & """,""to"":""" & locDetOvrTarget
                              & """,""override"":true}",
                          RequestKey: locDetKey,
                          Title: "Status Overridden"
                      }
                  )
              );
              Select(btnDetAdvance)
              // MOVING BACKWARDS CLEARS FORWARD FIELDS. Setting a completed task to
              // NotStarted with its OutcomeKey and CompletedDate still on it produces a
              // row that reads as approved and not started at once, and the routing
              // panel renders both at the same time. Every If here without an else
              // branch returns a TYPED blank, which is what clears the column without
              // upsetting the collection's schema.
              //
              // MOVING FORWARDS PRESERVES WHAT WAS THERE. Coalesce keeps an existing
              // StartDate or CompletedDate rather than restamping it with today, so an
              // override does not rewrite history that was already correct.
              //
              // AN OVERRIDE NEVER SETS AN OutcomeKey. Forcing a task to Completed is
              // not a decision about the work, and stamping Approve would put a
              // judgement in the record that nobody made. A completed task with no
              // outcome is exactly right here and the audit row explains it.
              //
              // IT ALWAYS ENDS IN THE ADVANCE. The admin sets ONE assignment and the
              // reconcile derives the phases, the active order and the request status
              // from the rows. Letting an admin set a phase or a request directly would
              // let them build a state the engine would never produce, and the next
              // Finish would fight them.
              //
              // IF THIS GETS USED OFTEN, the advance rules are wrong and this is
              // hiding it. Worth watching how many "status" rows carry override true.
            Text: =""
            Visible: =false
            Width: =1
      - btnDetAdvance:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Fill: =nfColor.Transparent
            FocusedBorderThickness: =0.5
            Height: =1
            OnSelect: |-
              =ForAll(
                  Sort(Filter(colPhases, RequestKey = locDetKey), PhaseOrder) As ph,
                  Patch(
                      colPhases,
                      LookUp(colPhases, PhaseKey = ph.PhaseKey),
                      {
                          PhaseStatusKey:
                              If(
                                  CountRows(
                                      Filter(
                                          colAssignments,
                                          RequestKey = locDetKey,
                                          PhaseKey = ph.PhaseKey,
                                          Required,
                                          StatusKey <> "Completed"
                                      )
                                  ) = 0
                                  && CountRows(
                                      Filter(colAssignments, RequestKey = locDetKey, PhaseKey = ph.PhaseKey)
                                  ) > 0,
                                  "Completed",
                                  "NotStarted"
                              )
                      }
                  )
              );
              UpdateContext(
                  {
                      locAdvPhase:
                          Coalesce(
                              First(
                                  Sort(
                                      Filter(colPhases, RequestKey = locDetKey, PhaseStatusKey <> "Completed"),
                                      PhaseOrder
                                  )
                              ).PhaseKey,
                              ""
                          )
                  }
              );
              If(
                  IsBlank(locAdvPhase),
                  Patch(
                      colRequests,
                      LookUp(colRequests, RequestKey = locDetKey),
                      {
                          StatusKey: "Completed",
                          CompletedDate: Today(),
                          CurrentPhaseOrder: CountRows(Filter(colPhases, RequestKey = locDetKey))
                      }
                  ),
                  UpdateContext(
                      {
                          locAdvOrder:
                              Coalesce(
                                  Min(
                                      Filter(
                                          colAssignments,
                                          RequestKey = locDetKey,
                                          PhaseKey = locAdvPhase,
                                          StatusKey <> "Completed"
                                      ),
                                      AssignmentOrder
                                  ),
                                  0
                              )
                      }
                  );
                  Patch(
                      colPhases,
                      LookUp(colPhases, PhaseKey = locAdvPhase),
                      { PhaseStatusKey: "InProgress" }
                  );
                  ForAll(
                      Filter(
                          colAssignments,
                          RequestKey = locDetKey,
                          PhaseKey = locAdvPhase,
                          AssignmentOrder = locAdvOrder,
                          StatusKey = "NotStarted"
                      ) As a,
                      Patch(
                          colAssignments,
                          a,
                          {
                              StatusKey: "InProgress",
                              StartDate: Today(),
                              DueDate: DateAdd(Today(), a.DurationDays, TimeUnit.Days)
                          }
                      )
                  );
                  Patch(
                      colRequests,
                      LookUp(colRequests, RequestKey = locDetKey),
                      {
                          StatusKey: "InProgress",
                          CurrentPhaseOrder: LookUp(colPhases, PhaseKey = locAdvPhase).PhaseOrder,
                          CompletedDate: Blank()
                      }
                  )
              )
              // THE ADVANCE RULES, WRITTEN ONCE. Finish calls this, Reroute calls it,
              // and Edit Workflow should once its structure edits can move the active
              // point. The flow will implement the same walk server side, and this is
              // the version it mirrors.
              //
              // IT IS A FULL RECONCILE, NOT AN INCREMENT. Nothing here asks what just
              // happened; it derives the whole state from the assignment rows as they
              // now stand. That makes it idempotent, so running it twice is harmless,
              // and it means a structure edit that inserts a phase before the current
              // one is handled by the same code that handles a completion.
              //
              // PASS ONE marks every phase Completed or NotStarted purely from whether
              // its REQUIRED assignments are all done. Optional assignments never hold
              // up a phase, which is the whole point of the Required toggle. A phase
              // with no assignments at all is NOT complete: an empty phase is a
              // half-built workflow, not a finished one.
              //
              // PASS TWO finds the earliest phase that is not Completed, sets it
              // InProgress, and starts the LOWEST assignment order in it that still
              // has open work. Everyone sharing that order starts together, which is
              // what parallel means here.
              //
              // ONLY NotStarted ROWS ARE STARTED. An assignment already InProgress
              // keeps its StartDate and DueDate, so re-running this does not push
              // someone's deadline out every time a colleague finishes something.
              //
              // NO PHASE LEFT means the request is Completed. The CompletedDate is
              // cleared on the other branch, so a send-back reopening a finished
              // request does not leave a completion date on a live request.
              //
              // WHAT THIS DELIBERATELY DOES NOT DO: touch a request that is OnHold,
              // Suspended or Cancelled. Callers check that before calling. A reconcile
              // that restarted a suspended request would defeat the suspension.
            Text: =""
            Visible: =false
            Width: =1
      - btnDetFinishApply:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Fill: =nfColor.Transparent
            FocusedBorderThickness: =0.5
            Height: =1
            OnSelect: |-
              =Patch(
                  colAssignments,
                  LookUp(colAssignments, AssignmentKey = locDetFinishKey),
                  {
                      StatusKey: "Completed",
                      OutcomeKey: cmpDetFinish_1.OutcomeKey,
                      Comments: cmpDetFinish_1.Comment,
                      CompletedDate: Today(),
                      ActedByEmail: nfUserEmail
                  }
              );
              Collect(
                  colAudit,
                  {
                      ActionKey: "task",
                      ActorName: nfUserName,
                      Detail:
                          LookUp(colAssignments, AssignmentKey = locDetFinishKey).Goal
                          & If(IsBlank(cmpDetFinish_1.Comment), "", "  -  " & cmpDetFinish_1.Comment),
                      EntryStamp: Now(),
                      Meta: "",
                      RequestKey: locDetKey,
                      Title:
                          Switch(
                              cmpDetFinish_1.OutcomeKey,
                              "Approve", "Task Completed",
                              "Reject", "Task Rejected",
                              "SendBack", "Task Sent Back",
                              "Task Completed"
                          )
                  }
              );
              Switch(
                  cmpDetFinish_1.OutcomeKey,
                  "Reject",
                  Patch(
                      colPhases,
                      LookUp(colPhases, PhaseKey = LookUp(colAssignments, AssignmentKey = locDetFinishKey).PhaseKey),
                      { PhaseStatusKey: "OnHold" }
                  );
                  Patch(
                      colRequests,
                      LookUp(colRequests, RequestKey = locDetKey),
                      { StatusKey: "OnHold" }
                  ),
                  "SendBack",
                  With(
                      {
                          me: LookUp(colAssignments, AssignmentKey = locDetFinishKey),
                          prev:
                              Last(
                                  Sort(
                                      Filter(
                                          colPhases,
                                          RequestKey = locDetKey,
                                          PhaseOrder < LookUp(
                                              colPhases,
                                              PhaseKey = LookUp(colAssignments, AssignmentKey = locDetFinishKey).PhaseKey
                                          ).PhaseOrder
                                      ),
                                      PhaseOrder
                                  )
                              )
                      },
                      Collect(
                          colAssignments,
                          {
                              RequestKey: locDetKey,
                              PhaseKey: prev.PhaseKey,
                              AssignmentKey: locDetKey & "-A" & CountRows(colAssignments) + 1,
                              AssignmentOrder:
                                  Max(
                                      Filter(colAssignments, RequestKey = locDetKey, PhaseKey = prev.PhaseKey),
                                      AssignmentOrder
                                  ),
                              AssigneeName:
                                  LookUp(
                                      Sort(
                                          Filter(colAssignments, RequestKey = locDetKey, PhaseKey = prev.PhaseKey),
                                          AssignmentOrder,
                                          SortOrder.Descending
                                      ),
                                      true
                                  ).AssigneeName,
                              AssigneeEmail:
                                  LookUp(
                                      Sort(
                                          Filter(colAssignments, RequestKey = locDetKey, PhaseKey = prev.PhaseKey),
                                          AssignmentOrder,
                                          SortOrder.Descending
                                      ),
                                      true
                                  ).AssigneeEmail,
                              DepartmentCode: me.DepartmentCode,
                              Goal: "Sent back: " & cmpDetFinish_1.Comment,
                              Required: true,
                              DurationDays: 2,
                              IsGroup: false,
                              GroupId: Blank(),
                              StatusKey: "NotStarted",
                              RerouteReturnTo: me.AssignmentKey
                          }
                      );
                      Patch(
                          colAssignments,
                          LookUp(colAssignments, AssignmentKey = me.AssignmentKey),
                          {
                              StatusKey: "NotStarted",
                              OutcomeKey: Blank(),
                              CompletedDate: Blank()
                          }
                      );
                      Patch(
                          colPhases,
                          LookUp(colPhases, PhaseKey = prev.PhaseKey),
                          { PhaseStatusKey: "InProgress" }
                      )
                  ),
                  Select(btnDetAdvance)
              );
              If(
                  !IsBlank(LookUp(colAssignments, AssignmentKey = locDetFinishKey).RerouteReturnTo)
                      && cmpDetFinish_1.OutcomeKey = "Approve",
                  Patch(
                      colAssignments,
                      LookUp(
                          colAssignments,
                          AssignmentKey = LookUp(colAssignments, AssignmentKey = locDetFinishKey).RerouteReturnTo
                      ),
                      { StatusKey: "NotStarted" }
                  );
                  Select(btnDetAdvance)
              )
              // THE LOCAL FINISH. This is the free build; the paid build replaces the
              // whole handler with one CompleteAssignment.Run and keeps the dialog
              // untouched.
              //
              // THE ASSIGNMENT IS WRITTEN FIRST AND UNCONDITIONALLY, because it
              // happened regardless of what the outcome then triggers. Comments is the
              // real column name; CompletionComment does not exist and reading it was
              // silently blank for weeks.
              //
              // ActedByEmail RECORDS WHO ACTUALLY PRESSED IT, which is not always the
              // assignee: a group assignment can be completed by any member, and
              // without this the audit says the group did it.
              //
              // APPROVE FALLS THROUGH TO THE ADVANCE and does nothing else. Whether
              // this completes an order, a phase or the whole request is not decided
              // here; btnDetAdvance derives all of it from the rows.
              //
              // REJECT HOLDS THE PHASE AND THE REQUEST and does NOT advance. The
              // routing panel tints the whole band from PhaseStatusKey, so holding
              // only the request would leave a phase that still looks live.
              //
              // SEND BACK CREATES A NEW ASSIGNMENT rather than reopening an old one,
              // so the previous round stays in the record. It lands at the LAST order
              // of the previous phase, addressed to whoever held that last order, and
              // carries RerouteReturnTo pointing at the assignment that sent it back.
              // The sender's own row goes back to NotStarted so the walk finds it
              // again later.
              //
              // THE RETURN POINTER IS HONOURED AT THE END: completing an assignment
              // that carries RerouteReturnTo reopens its target, and the advance then
              // resumes exactly where the send back came from instead of walking the
              // previous phase forward again.
              //
              // SEND BACK FROM PHASE ONE IS IMPOSSIBLE. There is no previous phase and
              // prev comes back blank. The dialog must disable the option, which is
              // the guard that actually prevents it; this handler assumes it was.
            Text: =""
            Visible: =false
            Width: =1
      - btnDetWfRebuild:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Fill: =nfColor.Transparent
            FocusedBorderThickness: =0.5
            Height: =1
            OnSelect: |-
              =ClearCollect(
                  colWfRowsTmp,
                  ForAll(
                      Filter(colWfDraftPhases, !IsRemoved) As p,
                      {
                          RowType: "phase",
                          SortPhase: p.PhaseOrder,
                          SortRow: 0,
                          PhaseClientId: p.ClientId,
                          RowClientId: p.ClientId,
                          Title: p.Title,
                          Subtitle: p.PhaseGoal,
                          StatusKey: p.PhaseStatusKey,
                          IsLocked: p.IsLocked,
                          IsExpanded: p.ClientId = locWfExpanded,
                          WorkerCount: CountRows(Filter(colWfDraftWorkers, PhaseClientId = p.ClientId, !IsRemoved)),
                          AssignmentOrder: 0,
                          DepartmentCode: "",
                          Required: false,
                          DurationDays: 0,
                          IsGroup: false,
                          AssigneeEmail: "",
                          GroupId: ""
                      }
                  )
              );
              If(
                  locWfExpanded > 0,
                  Collect(
                      colWfRowsTmp,
                      ForAll(
                          Sort(Filter(colWfDraftWorkers, PhaseClientId = locWfExpanded, !IsRemoved), AssignmentOrder) As w,
                          {
                              RowType: "worker",
                              SortPhase: LookUp(colWfDraftPhases, ClientId = locWfExpanded).PhaseOrder,
                              SortRow: w.AssignmentOrder,
                              PhaseClientId: w.PhaseClientId,
                              RowClientId: w.ClientId,
                              Title: w.AssigneeName,
                              Subtitle: w.Goal,
                              StatusKey: w.StatusKey,
                              IsLocked: LookUp(colWfDraftPhases, ClientId = locWfExpanded).IsLocked,
                              IsExpanded: false,
                              WorkerCount: 0,
                              AssignmentOrder: w.AssignmentOrder,
                              DepartmentCode: w.DepartmentCode,
                              Required: w.Required,
                              DurationDays: w.DurationDays,
                              IsGroup: w.IsGroup,
                              AssigneeEmail: w.AssigneeEmail,
                              GroupId: w.GroupId
                          }
                      )
                  );
                  If(
                      !LookUp(colWfDraftPhases, ClientId = locWfExpanded).IsLocked,
                      Collect(
                      colWfRowsTmp,
                      {
                          RowType: "add",
                          SortPhase: LookUp(colWfDraftPhases, ClientId = locWfExpanded).PhaseOrder,
                          SortRow: 9999,
                          PhaseClientId: locWfExpanded,
                          RowClientId: 0,
                          Title: "",
                          Subtitle: "",
                          StatusKey: "",
                          IsLocked: false,
                          IsExpanded: false,
                          WorkerCount: 0,
                          AssignmentOrder: 0,
                          DepartmentCode: "",
                          Required: false,
                          DurationDays: 0,
                          IsGroup: false,
                          AssigneeEmail: "",
                          GroupId: ""
                      }
                      )
                  )
              );
              ClearCollect(
                  colWfRows,
                  SortByColumns(colWfRowsTmp, "SortPhase", SortOrder.Ascending, "SortRow", SortOrder.Ascending)
              )
              // HIDDEN REBUILD. Called with Select(btnDetWfRebuild) at the end of
              // every draft mutation. It lives in one control rather than being
              // pasted into a dozen OnSelect handlers, and it is a control rather
              // than a behaviour UDF so it can read locWfExpanded, which a UDF in
              // App.Formulas has no screen scope to see.
              //
              // The two step collect through colWfRowsTmp is required: a
              // ClearCollect whose source reads the collection it is clearing has
              // undefined behaviour.
              //
              // A locked phase never contributes worker rows, which is how the
              // read only rule for a Completed phase lives in the data rather
              // than in a dozen Visible formulas.
            Text: =""
            Visible: =false
            Width: =1
      - btnDetFieldsRebuild_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Fill: =nfColor.Transparent
            FocusedBorderThickness: =0.5
            Height: =1
            OnSelect: |-
              =Clear(colDetFieldRows);
              ForAll(
                  Distinct(colDetFields, Section) As s,
                  Collect(
                      colDetFieldRows,
                      {
                          RowType: "section",
                          Section: s.Value,
                          FieldLabel: "",
                          FieldValue: "",
                          IsOpen: !IsBlank(LookUp(colDetOpen, SectionKey = s.Value)),
                          FieldCount: CountRows(Filter(colDetFields, Section = s.Value))
                      }
                  );
                  If(
                      !IsBlank(LookUp(colDetOpen, SectionKey = s.Value)),
                      Collect(
                          colDetFieldRows,
                          ForAll(
                              Filter(colDetFields, Section = s.Value) As f,
                              {
                                  RowType: "field",
                                  Section: f.Section,
                                  FieldLabel: f.FieldLabel,
                                  FieldValue: f.FieldValue,
                                  IsOpen: false,
                                  FieldCount: 0
                              }
                          )
                      )
                  )
              )
              // FLAT ROW PROJECTION, because Canvas galleries CANNOT NEST. A
              // section gallery containing a field gallery is not expressible, so
              // sections and fields share one gallery and RowType decides which
              // template shows. Same shape as colWfRows in Edit Workflow.
              //
              // ForAll is used here as a BEHAVIOUR function, iterating sections in
              // order and appending as it goes, so the interleaving falls out of
              // execution order and no sort column is needed. The alternative was
              // two tables plus a SortSec and SortRow pair, which is what Edit
              // Workflow needed only because its rows come from two different
              // collections.
              //
              // SECTION ORDER FOLLOWS Distinct(colDetFields, Section), which is
              // first appearance in colDetFields. Reordering the rows in the
              // OnVisible literal reorders the sections here. There is no second
              // ordering contract to keep in step, which is deliberate.
              //
              // A COLLAPSED SECTION CONTRIBUTES NO FIELD ROWS AT ALL, rather than
              // rows with Visible false. A gallery still lays out invisible rows,
              // so hiding 30 of 34 fields would leave 30 rows of empty space.
            Text: =""
            Visible: =false
            Width: =1
            X: =20
            Y: =20
      - tmrDetWork:
          Control: Timer@2.1.0
          Properties:
            Duration: =60
            Height: =1
            OnTimerEnd: |-
              =Select(btnDetFinishApply);
              IfError(
                  UpdateContext(
                      {
                          locDetFinishRes:
                              { ok: true, code: "ok", message: "", requeststatus: "" }
                      }
                  ),
                  UpdateContext(
                      {
                          locDetFinishRes:
                              {
                                  ok: false,
                                  code: "unreachable",
                                  message: "Could not reach the workflow. " & FirstError.Message,
                                  requeststatus: ""
                              }
                      }
                  )
              );
              If(
                  locDetFinishRes.code = "notactive" || locDetFinishRes.code = "unreachable",

                  // Nothing was written. Drop the overlay and leave the dialog open so the
                  // typed comment survives.
                  UpdateContext({ locDetBusy: false });
                  Notify(locDetFinishRes.message, NotificationType.Warning),

                  // REQUEST SCOPED, both of them. These read the WHOLE list once,
                  // which silently refilled two request-scoped collections with the
                  // truncated head of every request's rows. It was masked only because
                  // the Navigate below re-runs OnVisible and rebuilds them correctly,
                  // so the bug was one removed line away from returning.
                  //
                  // Refresh FIRST, for the same reason as the reroute branch below:
                  // CompleteAssignment writes SERVER SIDE and the client-side cache of
                  // these lists does not notice, so a re-read can return the old rows.
                  ClearCollect(
                      colDetAssign,
                      Filter(colAssignments, RequestKey = locDetKey)
                  );
                  ClearCollect(
                      colDetPhases,
                      Sort(Filter(colPhases, RequestKey = locDetKey), PhaseOrder)
                  );
                  ClearCollect(
                      colAudit,
                      ShowColumns(
                          colAudit,
                          RequestKey, Title, ActionKey, ActorName, Detail,
                          EntryStamp, Meta
                      )
                  );
                  ClearCollect(
                      colDetReq,
                      Filter(colRequests, RequestKey = locDetKey)
                  );
                  UpdateContext(
                      {
                          locDetFinishOpen: false,
                          locDetFinishKey: "",
                          locDetBusy: false
                      }
                  );
                  Reset(cmpDetFinish_1);
                  Navigate(scrDetails, ScreenTransition.None, { locRequestKey: locDetKey })
              )
            Reset: =!locDetBusy
            Start: =locDetBusy
            Text: =""
            Visible: =false
            Width: =1
            X: =-20
            Y: =-20
      - tmrDetSave:
          Control: Timer@2.1.0
          Properties:
            Duration: =60
            Height: =1
            OnTimerEnd: |-
              =IfError(
                  UpdateContext(
                      {
                          locDetSaveRes:
                              { ok: false, code: "unreachable", message: "Saving would update the request fields and log the change to the audit trail. " & nfGateSuffix, requeststatus: "" }
                      }
                  ),
                  UpdateContext(
                      {
                          locDetSaveRes:
                              {
                                  ok: false,
                                  code: "unreachable",
                                  message: "Could not reach the workflow. " & FirstError.Message,
                                  created: "0", updated: "0", deleted: "0", skipped: "0"
                              }
                      }
                  )
              );
              If(
                  !locDetSaveRes.ok,
                  UpdateContext({ locDetSaveBusy: false });
                  Notify(locDetSaveRes.message, NotificationType.Warning),
                  UpdateContext({ locDetSaveBusy: false, locWfOpen: false });
                  Notify(locDetSaveRes.message, NotificationType.Success);
                  Reset(cmpDetWorkflow);
                  Navigate(scrDetails, ScreenTransition.None, { locRequestKey: locDetKey })
              )
              // IfError ASSIGNS locDetSaveRes ON BOTH BRANCHES, so the test below can
              // never depend on which one ran. Branching on a busy flag instead is what
              // made the previous version skip its whole reload.
              //
              // NOT CLOSED WHEN ok IS FALSE. "emptyworkflow" comes back having changed
              // nothing and the draft is the only copy of the edit, so the dialog stays
              // open and populated and just warns.
              //
              // THE RELOAD IS A Navigate, not a hand written re-read, and that is the
              // point. OnVisible rebuilds colDetReq, colDetPhases, colDetAssign,
              // colDetFields, colDetAudit, colDetOpen and colRouteOpen and fires both
              // rebuild buttons. tmrDetReroute and tmrDetConfirm already end this way.
              // It also means the Audit tab shows the row this flow just wrote, which a
              // hand written re-read on this screen has never done.
              //
              // Refresh BEFORE the Navigate: the writes were SERVER SIDE and the client
              // cache does not notice, so OnVisible would rebuild from stale rows.
            Reset: =!locDetSaveBusy
            Start: =locDetSaveBusy
            Text: =""
            Visible: =false
            Width: =1
            X: =-20
            Y: =-20
      - tmrDetReroute:
          Control: Timer@2.1.0
          Properties:
            Duration: =60
            Height: =1
            OnTimerEnd: |-
              =IfError(
                  UpdateContext(
                      {
                          locDetRrRes:
                              { ok: false, code: "unreachable", message: "Rerouting would reassign this task and log the change to the audit trail. " & nfGateSuffix, requeststatus: "" }
                      }
                  ),
                  UpdateContext(
                      {
                          locDetRrRes:
                              {
                                  ok: false,
                                  code: "unreachable",
                                  message: "Could not reach the workflow. " & FirstError.Message,
                                  assignee: ""
                              }
                      }
                  )
              );
              If(
                  !locDetRrRes.ok,

                  // NOTHING WAS WRITTEN on notfound, alreadydone, nochange or unreachable.
                  // Drop the overlay and leave the dialog open so the typed reason survives.
                  UpdateContext({ locDetRrBusy: false });
                  Notify(locDetRrRes.message, NotificationType.Warning),

                  // The flow moved the task. Reload the two collections a reroute can
                  // change, request scoped, then navigate so OnVisible rebuilds the rest.
                  ClearCollect(
                      colDetAssign,
                      Filter(colAssignments, RequestKey = locDetKey)
                  );
                  UpdateContext(
                      {
                          locDetRerouteOpen: false,
                          locDetRerouteKey: "",
                          locDetRrBusy: false
                      }
                  );
                  // Refresh BEFORE re-reading. The write happened server side, so the
                  // ClearCollect above would otherwise be answered from the client cache,
                  // which still holds the previous assignee.
                  Reset(cmpDetReroute_1);
                  Navigate(scrDetails, ScreenTransition.None, { locRequestKey: locDetKey })
              )
            Reset: =!locDetRrBusy
            Start: =locDetRrBusy
            Text: =""
            Visible: =false
            Width: =1
            X: =-20
            Y: =-20
      - tmrDetConfirm:
          Control: Timer@2.1.0
          Properties:
            Duration: =60
            Height: =1
            OnTimerEnd: |-
              =IfError(
                  UpdateContext(
                      {
                          locDetConfRes:
                              If(
                                  Coalesce(locDetConfirmKind, "suspend") = "delete"
                                  || Coalesce(locDetConfirmKind, "suspend") = "restore",
                                  { ok: false, code: "unreachable", message: "This would change the request status and log the change to the audit trail. " & nfGateSuffix, requeststatus: "" },
                                  { ok: false, code: "unreachable", message: "This would change the request status and log the change to the audit trail. " & nfGateSuffix, requeststatus: "" }
                              )
                      }
                  ),
                  UpdateContext(
                      {
                          locDetConfRes:
                              {
                                  ok: false,
                                  code: "unreachable",
                                  message: "Could not reach the workflow. " & FirstError.Message,
                                  requeststatus: ""
                              }
                      }
                  )
              );
              If(
                  !locDetConfRes.ok,
                  UpdateContext({ locDetConfBusy: false });
                  Notify(locDetConfRes.message, NotificationType.Warning),

                  UpdateContext({ locDetConfBusy: false });
                  Notify(locDetConfRes.message, NotificationType.Success);
                  If(
                      Coalesce(locDetConfirmKind, "suspend") = "delete",
                      Navigate(scrAllRequests, ScreenTransition.None),
                      Navigate(scrDetails, ScreenTransition.None, { locRequestKey: locDetKey })
                  )
              )
              // BOTH FLOWS RETURN THE SAME FOUR FIELDS, which is why one If can choose
              // between them and one branch can read the result. DeleteRequest returns a
              // blank requeststatus; nothing here reads it.
              //
              // DELETE NAVIGATES AWAY. The request no longer passes IsDeleted = false, and
              // this screen's OnVisible fallback resolves a blank key to the FIRST active
              // request, so staying would quietly show somebody else's request and look
              // like the delete hit the wrong row.
              //
              // Refresh before the Navigate: the writes were SERVER SIDE and the client
              // cache does not notice, so OnVisible would rebuild from stale rows.
            Reset: =!locDetConfBusy
            Start: =locDetConfBusy
            Text: =""
            Visible: =false
            Width: =1
            X: =-20
            Y: =-20
      - cmpDetConfirm:
          Control: CanvasComponent
          ComponentName: cmpEnhancedDialog
          Properties:
            BorderRadius: =nfRadius.Xl
            Buttons: |-
              =Table(
                  { Label: "Cancel", ButtonType: "Secondary", Action: "Cancel", Visible: true },
                  {
                      Label:
                          Switch(
                              Coalesce(locDetConfirmKind, "suspend"),
                              "suspend", "Suspend workflow",
                              "resume",  "Resume workflow",
                              "restart", "Restart from the beginning",
                              "restore", "Restore request",
                              "Delete request"
                          ),
                      ButtonType: "Primary",
                      Action: "Go",
                      Visible: true
                  }
              )
              // THE PRIMARY LABEL SAYS WHAT HAPPENS, never "Confirm". Restart discards
              // completed work and Delete removes the request from every view; a button
              // reading "Confirm" on either is how someone presses it without reading.
            DialogHeight: =0
            DialogType: ="Form"
            DialogWidth: =460
            HeaderText: |-
              =Switch(
                  Coalesce(locDetConfirmKind, "suspend"),
                  "suspend", "Suspend this workflow",
                  "resume",  "Resume this workflow",
                  "restart", "Restart this workflow",
                  "restore", "Restore this request",
                  "Delete this request"
              )
            Height: =Parent.Height
            IconName: |-
              =If(
                  Coalesce(locDetConfirmKind, "suspend") = "restart"
                  || Coalesce(locDetConfirmKind, "suspend") = "delete",
                  "Danger",
                  If(Coalesce(locDetConfirmKind, "suspend") = "restore", "Success", "Warning")
              )
              // Restore is the only one of the five that UNDOES something, so it is the
              // only one that is not a warning. Danger stays reserved for the two that
              // destroy: restart discards completed work, delete hides the request.
            IsTextInputRequired: |-
              =true
              // A REASON IS MANDATORY on all four. Every one of these changes state with
              // nobody having done the work, so the audit row is the only record of why it
              // happened. The component enforces it: with DialogType "Form" the Primary
              // button is disabled while the input is blank, so there is nothing to
              // validate here and no way to confirm without saying why.
            MessageText: |-
              =With(
                  { _t: Coalesce(LookUp(colDetReq, RequestKey = locDetKey).Title, locDetKey) },
                  Switch(
                      Coalesce(locDetConfirmKind, "suspend"),
                      "suspend",
                      _t & Char(10)
                      & "Work in progress is put on hold and nobody is asked to act. Nothing is lost, and Resume picks it up again.",
                      "resume",
                      _t & Char(10)
                      & "The workflow continues from where it stopped. Due dates are set again from today, so a date that expired while it was suspended does not come back overdue.",
                      "restart",
                      _t & Char(10)
                      & "EVERY task goes back to Not Started and the workflow begins again at phase one. Completed work, outcomes and comments on this request are discarded and cannot be recovered.",
                      "restore",
                      _t & Char(10)
                      & "The request becomes visible again and returns to the status it held before it was deleted, read back from the audit trail. If that record is gone it returns as Not Started.",
                      _t & Char(10)
                      & "The request is hidden from every view. It is a soft delete, so the record and its audit trail are kept and an administrator can restore it."
                  )
              )
            OnButtonSelect: |-
              =If(
                  Self.SelectedButton.Action <> "Cancel",
                  UpdateContext(
                      {
                          locDetConfBusy: true
                      }
                  )
              );
              UpdateContext({ locDetConfirmOpen: false })
              // Self, NOT cmpDetConfirm. On an instance the control is Self; naming the
              // component resolves to nothing and the handler silently never fires.
              //
              // The flow call is in tmrDetConfirm. Calling it here would run before the
              // overlay paints, so the screen would freeze with no feedback.
            OnCloseSelect: |-
              =UpdateContext({ locDetConfirmOpen: false })
            OverlayBlurColor: ="RGBA(0, 0, 0, 0.4)"
            PlaceholderText: |-
              =Switch(
                  Coalesce(locDetConfirmKind, "suspend"),
                  "suspend", "Why is this being suspended",
                  "resume",  "Why is this being resumed",
                  "restart", "Why is this being restarted",
                  "restore", "Why is this being restored",
                  "Why is this being deleted"
              )
            ShowCloseIcon: =true
            Theme: =If(nfIsDark, "Dark", "Light")
            Visible: =locDetConfirmOpen
            Width: =Parent.Width
      - cmpDetLoading:
          Control: CanvasComponent
          ComponentName: cmpLoadingSpinner
          Properties:
            Height: =Parent.Height
            LoadingText: |-
              =If(
                  locDetLoading,
                  "Loading the request",
                  locDetSaveBusy,
                  "Saving the workflow",
                  locDetConfBusy,
                  Switch(
                      Coalesce(locDetConfirmKind, ""),
                      "suspend", "Suspending the workflow",
                      "resume",  "Resuming the workflow",
                      "restart", "Restarting the workflow",
                      "Deleting the request"
                  ),
                  locDetRrBusy,
                  "Moving the task and refreshing",
                  "Completing your task and refreshing"
              )
            OverlayOpacity: =0.6
            ShowBlur: =true
            Theme: =nfThemeName
            Visible: =locDetLoading || locDetBusy || locDetRrBusy || locDetConfBusy || locDetSaveBusy
            Width: =Parent.Width
