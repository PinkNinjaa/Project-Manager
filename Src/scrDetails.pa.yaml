                                                                  { Category: "default",        IconType: "comment",    DotColor: nfColor.BorderStrong, IconColor: If(nfIsDark, "#CBD5E1", "#475569") }
                                                              )
                                                              // DotColor is a Color, so nfColor passes straight in. IconColor is a
                                                              // HEX STRING, because it is substituted into an SVG data URI, and
                                                              // nfColor has no hex mirror. This is the nfHex gap again, the same
                                                              // duplication nfTableTheme already accepts.
