                                                                  StackGap:     nfSpace.Md,
                                                                  Radius:       nfRadius.Md,
                                                                  HeaderSize:   nfType.CardTitle,
                                                                  NameSize:     nfType.Small,
                                                                  MetaSize:     nfType.Micro,
                                                                  TileTextSize: nfType.Micro
                                                              }
                                                            TypeColors: |-
                                                              =Table(
                                                                  { Ext: "pdf",  Fill: nfColor.DangerFill,  Text: nfColor.DangerText },
                                                                  { Ext: "xlsx", Fill: nfColor.SuccessFill, Text: nfColor.SuccessText },
