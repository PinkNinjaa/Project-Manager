                                    AutoHeight: =true
                                    Color: =nfColor.TextMuted
                                    FontWeight: =FontWeight.Semibold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =nfType.Micro
                                    Text: =ThisItem.AssignmentOrder
                                    Width: =Parent.Width
                                    Wrap: =false
                                    Y: =(Parent.Height - Self.Height) / 2
                        - lblWfWkDept:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =nfColor.TextOnPrimary
                              Fill: =nfColor.Primary
                              FontWeight: =FontWeight.Bold
                              PaddingBottom: =nfSpace.Xs
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =nfSpace.Xs
                              RadiusBottomLeft: =nfRadius.Sm
                              RadiusBottomRight: =nfRadius.Sm
                              RadiusTopLeft: =nfRadius.Sm
                              RadiusTopRight: =nfRadius.Sm
                              Size: =nfType.Micro
                              Text: =Upper(ThisItem.DepartmentCode)
                              Width: =48
                              Wrap: =false
                              X: =nfSize.IconLg + 2 * nfSpace.Md
                              Y: =(Parent.Height - Self.Height) / 2
                        - lblWfWkName:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              AutoHeight: =true
                              Color: =nfColor.TextStrong
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =nfType.Small
                              Text: |-
                                =ThisItem.Title
                                & If(ThisItem.IsGroup, "   (group)", "")
                              Width: |-
                                =Max(
                                    72,
                                    Parent.Width
                                        - (nfSize.IconLg + 48 + 3 * nfSpace.Md)
                                        - If(
                                              Parent.Width >= 600, 412,
                                              Parent.Width >= 500, 312,
                                              216
                                          )
                                )
                              Wrap: =false
                              X: =nfSize.IconLg + 48 + 3 * nfSpace.Md
                              Y: =(Parent.Height - Self.Height - lblWfWkGoal.Height) / 2
                        - lblWfWkGoal:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              AutoHeight: =true
                              Color: =nfColor.TextMuted
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =nfType.Micro
                              Text: |-
                                =If(
                                    IsBlank(ThisItem.AssigneeEmail) && IsBlank(ThisItem.GroupId),
                                    "Unresolved, pick a person or group",
                                    ThisItem.Subtitle
                                )
                              Width: =lblWfWkName.Width
                              Wrap: =false
                              X: =lblWfWkName.X
                              Y: =lblWfWkName.Y + lblWfWkName.Height
                        - lblWfWkStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: |-
                                =Switch(
                                    ThisItem.StatusKey,
                                    "Completed", nfColor.SuccessText,
                                    "InProgress", nfColor.WarnText,
                                    "OnHold", nfColor.DangerText,
                                    nfColor.NeutralText
                                )
                              Fill: |-
                                =Switch(
                                    ThisItem.StatusKey,
                                    "Completed", nfColor.SuccessFill,
                                    "InProgress", nfColor.WarnFill,
                                    "OnHold", nfColor.DangerFill,
                                    nfColor.NeutralFill
                                )
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =nfSpace.Xs
                              PaddingLeft: =nfSpace.Sm
                              PaddingRight: =nfSpace.Sm
                              PaddingTop: =nfSpace.Xs
                              RadiusBottomLeft: =nfRadius.Pill
                              RadiusBottomRight: =nfRadius.Pill
                              RadiusTopLeft: =nfRadius.Pill
                              RadiusTopRight: =nfRadius.Pill
                              Size: =nfType.Micro
                              Text: |-
                                =Coalesce(
                                    ThisItem.StatusTitle,
                                    LookUp(nfStatusTable, StatusKey = ThisItem.StatusKey).Title,
                                    "Not Started"
                                )
                                // THREE WAY FALLBACK, and the order matters. The rebuild
                                // projection is read first because it costs nothing. If it is
                                // blank, either nfStatusTable had not loaded when the rebuild ran
                                // or the collection schema is stale, so the live lookup runs.
                                // A frozen blank pill can never heal on its own, which is
                                // exactly what snapshotting this alone caused.
                              Visible: =Parent.Width >= 600
                              Width: =92
                              Wrap: =false
                              X: =Parent.Width - 404
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfWkRequired:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: |-
                                =If(ThisItem.Required, "Required. ", "Not required. ")
                                & If(
                                    ThisItem.IsLocked,
                                    "This phase is complete, so it cannot be changed.",
                                    "Select to change."
                                )
                                // STATE FIRST, ACTION ONLY IF THERE IS ONE. The worker name is
                                // gone from here because the row already announces it, and
                                // repeating it makes every control in the row read back the
                                // same name before saying anything useful.
                              Appearance: |-
                                =If(
                                    ThisItem.Required,
                                    ButtonAppearance.Secondary,
                                    ButtonAppearance.Subtle
                                )
                                // THE STATE IS CARRIED THREE WAYS: the glyph, the weight and
                                // the presence of a border. Subtle draws no border at all, so
                                // ticked reads as a raised control and unticked reads as flat
                                // even on a screen where the icon font has not resolved. The
                                // previous version put the whole burden on the glyph, and if
                                // the icon name is wrong the two states become identical.
                              Color: =If(ThisItem.Required, nfColor.Primary, nfColor.TextMuted)
                              DisplayMode: =If(ThisItem.IsLocked, DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =If(ThisItem.Required, FontWeight.Semibold, FontWeight.Normal)
                              Height: =nfSize.RowSm
                              Icon: =If(ThisItem.Required, "CheckmarkCircle", "Circle")
                              OnSelect: |-
                                =Patch(
                                    colWfDraftWorkers,
                                    LookUp(colWfDraftWorkers, ClientId = ThisItem.RowClientId),
                                    { Required: !ThisItem.Required }
                                );
                                Set(_cmpWfDirty, true);
                                Select(btnWfRebuild)
                              Size: =nfType.Micro
                              Text: ="Required"
                              Tooltip: |-
                                =If(
                                    ThisItem.Required,
                                    "Required. The phase waits for this worker.",
                                    "Not required. The phase does not wait for this worker."
                                )
                                & If(
                                    ThisItem.IsLocked,
                                    "  This phase is complete, so it cannot be changed.",
                                    If(
                                        ThisItem.Required,
                                        "  Select to make them optional.",
                                        "  Select to make them required."
                                    )
                                )
                                // INFORMATION FIRST. The old text opened with an instruction to
                                // select a control that is Disabled on every worker in a
                                // Completed phase, which is most of what anyone reading an
                                // existing workflow sees. What Required MEANS is the part that
                                // is always true and always useful; the instruction is
                                // conditional and comes second.
                                //
                                // The state has to be spoken because neither the border nor the
                                // glyph is announced, and the label is deliberately static.
                              Visible: =Parent.Width >= 500
                              Width: =88
                              X: =Parent.Width - 304
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfWkDaysDown:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="One day fewer for " & ThisItem.Title
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: |-
                                =If(
                                    ThisItem.IsLocked || ThisItem.DurationDays <= 1,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Subtract"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Patch(
                                    colWfDraftWorkers,
                                    LookUp(colWfDraftWorkers, ClientId = ThisItem.RowClientId),
                                    { DurationDays: Max(ThisItem.DurationDays - 1, 1) }
                                );
                                Set(_cmpWfDirty, true);
                                Select(btnWfRebuild)
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="One day fewer"
                              Width: =32
                              X: =Parent.Width - 208
                              Y: =(Parent.Height - Self.Height) / 2
                        - lblWfWkDays:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: |-
                                ="Duration "
                                & ThisItem.DurationDays
                                & " days"
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =nfColor.TextBody
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =nfType.Micro
                              Text: |-
                                =ThisItem.DurationDays
                                & "d"
                              Width: =36
                              Wrap: =false
                              X: =Parent.Width - 172
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfWkDaysUp:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="One day more for " & ThisItem.Title
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =If(ThisItem.IsLocked, DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Add"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Patch(
                                    colWfDraftWorkers,
                                    LookUp(colWfDraftWorkers, ClientId = ThisItem.RowClientId),
                                    { DurationDays: Min(ThisItem.DurationDays + 1, 60) }
                                );
                                Set(_cmpWfDirty, true);
                                Select(btnWfRebuild)
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="One day more"
                              Width: =32
                              X: =Parent.Width - 132
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfWkEdit:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Edit worker " & ThisItem.Title
                              Appearance: =ButtonAppearance.Subtle
                              Color: =nfColor.Primary
                              FontWeight: =FontWeight.Semibold
                              Height: =nfSize.RowSm
                              Icon: ="Edit"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Set(_cmpAwEditId, ThisItem.RowClientId);
                                Set(_cmpAwPhaseClientId, ThisItem.PhaseClientId);
                                Set(_cmpAwIsGroup, ThisItem.IsGroup);
                                Set(_cmpAwName, ThisItem.Title);
                                Set(_cmpAwId, If(ThisItem.IsGroup, ThisItem.GroupId, ThisItem.AssigneeEmail));
                                Set(_cmpAwGoal, ThisItem.Subtitle);
                                Set(_cmpAwDept, ThisItem.DepartmentCode);
                                Set(_cmpAwOrder, ThisItem.AssignmentOrder);
                                Set(_cmpAwDays, ThisItem.DurationDays);
                                Set(_cmpAwRequired, ThisItem.Required);
                                Set(_cmpAwOpen, true);
                                Reset(cmbAwPerson)
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="Change who does this and what they do"
                              Visible: =!ThisItem.IsLocked
                              Width: =36
                              X: =Parent.Width - 88
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfWkDelete:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Remove worker " & ThisItem.Title
                              Appearance: =ButtonAppearance.Subtle
                              Color: =nfColor.DangerText
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Delete"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Patch(
                                    colWfDraftWorkers,
                                    LookUp(colWfDraftWorkers, ClientId = ThisItem.RowClientId),
                                    { IsRemoved: true }
                                );
                                Set(_cmpWfDirty, true);
                                Select(btnWfRebuild)
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="Remove this worker"
                              Visible: =!ThisItem.IsLocked
                              Width: =36
                              X: =Parent.Width - 44
                              Y: =(Parent.Height - Self.Height) / 2
                  - conWfRowAdd:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =nfColor.BorderStrong
                        BorderStyle: =BorderStyle.Dashed
                        BorderThickness: =nfSize.Border
                        DropShadow: =DropShadow.None
                        Fill: =nfColor.Transparent
                        Height: =Parent.TemplateHeight - nfSpace.Xxl
                        RadiusBottomLeft: =nfRadius.Md
                        RadiusBottomRight: =nfRadius.Md
                        RadiusTopLeft: =nfRadius.Md
                        RadiusTopRight: =nfRadius.Md
                        Visible: =ThisItem.RowType = "add"
                        Width: =Parent.TemplateWidth - 2 * nfSpace.Lg - nfSpace.Xxl
                        X: =nfSpace.Lg + nfSpace.Xxl
                        Y: =nfSpace.Md
                      Children:
                        - lblWfAddWorker:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AutoHeight: =true
                              Color: =nfColor.Primary
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =nfType.Small
                              Text: ="Add Worker"
                              Width: =Parent.Width
                              Wrap: =false
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfAddWorker:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfColor.Transparent
                              BorderThickness: =0
                              Color: =nfColor.Transparent
                              Fill: =nfColor.Transparent
                              FocusedBorderThickness: =0.5
                              Height: =Parent.Height - 2 * nfSize.FocusRing
                              HoverBorderColor: =nfColor.Transparent
                              HoverColor: =nfColor.Transparent
                              HoverFill: =nfColor.Transparent
                              OnSelect: |-
                                =Set(_cmpAwEditId, 0);
                                Set(_cmpAwPhaseClientId, ThisItem.PhaseClientId);
                                Set(_cmpAwIsGroup, false);
                                Set(_cmpAwName, "");
                                Set(_cmpAwId, "");
                                Set(_cmpAwGoal, "");
                                Set(_cmpAwDept, "OPS");
                                Set(
                                    _cmpAwOrder,
                                    Last(
                                        Sort(
                                            Filter(colWfDraftWorkers, PhaseClientId = ThisItem.PhaseClientId, !IsRemoved),
                                            AssignmentOrder
                                        )
                                    ).AssignmentOrder + 1
                                );
                                // IDENTICAL TO THE PHASE ROW ADD BUTTON, DELIBERATELY. See the
                                // note there for the reasoning and for why it cannot be shared.
                                // If you change one, change both, and diff them afterwards.
                                Set(_cmpAwDays, 3);
                                Set(_cmpAwRequired, true);
                                Set(_cmpAwOpen, true);
                                Reset(cmbAwPerson)
                              PressedBorderColor: =nfColor.Transparent
                              PressedColor: =nfColor.Transparent
                              PressedFill: =nfColor.Transparent
                              Text: =""
                              Tooltip: ="Add a worker to this phase"
                              Width: =Parent.Width - 2 * nfSize.FocusRing
                              X: =nfSize.FocusRing
                              Y: =nfSize.FocusRing
            - lblWfEmpty:
                Control: ModernText@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =nfColor.TextMuted
                  FillPortions: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =nfSpace.Xxl
                  PaddingRight: =nfSpace.Xxl
                  Size: =nfType.Small
                  Text: ="No phases yet. Load a template from the header, or use Add Phase to build one from scratch."
                  Visible: =CountRows(colWfRows) = 0
            - shpWfRuleFooter:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfColor.Border
                  FillPortions: =0
                  Height: =nfSize.Border
            - conWfFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.SurfaceAlt
                  FillPortions: =0
                  Height: =nfSize.Row + 2 * nfSpace.Md
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =nfSpace.Sm
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =nfSpace.Md
                  PaddingLeft: =nfSpace.Lg
                  PaddingRight: =nfSpace.Lg
                  PaddingTop: =nfSpace.Md
                  RadiusBottomLeft: =If(nfIsDesktop, nfRadius.Xl, 0)
                  RadiusBottomRight: =If(nfIsDesktop, nfRadius.Xl, 0)
                Children:
                  - lblWfTotals:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =If(!nfIsFullVersion && cmpDetEditWorkflow.RequestKey <> "", nfColor.WarnText, nfColor.TextMuted)
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =nfType.Small
                        Text: |-
                          =If(
                              !nfIsFullVersion && cmpDetEditWorkflow.RequestKey <> "",
                              CountRows(Filter(colWfDraftPhases, !IsRemoved)) & " phases, "
                                  & CountRows(Filter(colWfDraftWorkers, !IsRemoved)) & " workers. Saving is " & Lower(nfFullVersionNote) & ", see " & nfUpgradeUrl,
                              CountRows(Filter(colWfDraftPhases, !IsRemoved))
                              & " phases   "
                              & CountRows(Filter(colWfDraftWorkers, !IsRemoved))
                              & If(
                                  CountRows(Filter(colWfDraftWorkers, !IsRemoved)) = 1,
                                  " worker   ~",
                                  " workers   ~"
                              )
                              & Coalesce(Sum(Filter(colWfRows, RowType = "phase"), PhaseDays), 0)
                              & " days estimated"
                          )
                        Wrap: =false
                  - lblWfUnresolved:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =nfColor.WarnText
                        Fill: =nfColor.WarnFill
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =nfSpace.Xs
                        PaddingLeft: =nfSpace.Md
                        PaddingRight: =nfSpace.Md
                        PaddingTop: =nfSpace.Xs
                        RadiusBottomLeft: =nfRadius.Pill
                        RadiusBottomRight: =nfRadius.Pill
                        RadiusTopLeft: =nfRadius.Pill
                        RadiusTopRight: =nfRadius.Pill
                        Size: =nfType.Micro
                        Text: |-
                          =cmpDetEditWorkflow.UnresolvedCount
                          & " unresolved"
                        Visible: =cmpDetEditWorkflow.UnresolvedCount > 0
                        Width: =116
                        Wrap: =false
                  - btnWfCancel:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Cancel"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        FontWeight: =FontWeight.Semibold
                        Height: =nfSize.RowSm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Clear(colWfDraftPhases);
                          Clear(colWfDraftWorkers);
                          Clear(colWfRows);
                          Clear(colWfRowsTmp);
                          Clear(colWfKeepPhases);
                          Clear(colWfKeepWorkers);
                          Set(_cmpWfExpanded, 0);
                          Set(_cmpWfDirty, false);
                          Set(_cmpWfReqTitle, "");
                          Set(_cmpAwOpen, false);
                          Set(_cmpPhOpen, false);
                          cmpDetEditWorkflow.OnCancel()
                          // Nothing was written outside the draft, so cancel is a clear and
                          // an event. The host only has to drop its open flag.
                          //
                          // THE SCRIM AND THE HEADER X BOTH Select() THIS BUTTON. The scrim
                          // used to raise OnCancel directly, which left the whole draft and
                          // the dirty flag standing after the dialog closed.
                        Size: =nfType.Small
                        Text: ="Cancel"
                        Width: =104
                  - btnWfSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Save Changes"
                        AlignInContainer: =AlignInContainer.Center
                        DisplayMode: |-
                          =If(
                              (!nfIsFullVersion && cmpDetEditWorkflow.RequestKey <> "")
                              || !_cmpWfDirty
                              || (cmpDetEditWorkflow.RequireResolved && cmpDetEditWorkflow.UnresolvedCount > 0),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                          // RESOLUTION IS THE HOST'S POLICY, NOT THIS COMPONENT'S.
                          // A template assignment ARRIVES unresolved by design, so a
                          // host seeding a new request from a template starts at
                          // UnresolvedCount equal to the assignment count and Save
                          // could never light up however much was edited. That is
                          // what RequireResolved is for.
                          //
                          // _cmpWfDirty is still required in both modes. Save on an
                          // untouched draft is a no op worth refusing.
                        FontWeight: =FontWeight.Semibold
                        Height: =nfSize.RowSm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =cmpDetEditWorkflow.OnSave()
                          // RAISES THE EVENT AND NOTHING ELSE. The host reads DraftPhases and
                          // DraftWorkers and does the write, which is the one swap point
                          // between a collection only build and a flow backed one.
                          //
                          // Canvas has minted NO key. ClientId and PhaseClientId are local
                          // join columns and the receiver must strip them.
                          //
                          // The draft is NOT cleared here. A failed save must leave the work
                          // on screen, so the host calls Reset on this instance once the
                          // write succeeds.
                        Size: =nfType.Small
                        Text: ="Save Changes"
                        Tooltip: |-
                          =If(
                              !nfIsFullVersion && cmpDetEditWorkflow.RequestKey <> "",
                              "Saving would apply " & CountRows(Filter(colWfDraftPhases, !IsRemoved))
                                  & " phases and " & CountRows(Filter(colWfDraftWorkers, !IsRemoved))
                                  & " workers to this request and log the change to the audit trail. " & nfGateSuffix,
                              cmpDetEditWorkflow.RequireResolved && cmpDetEditWorkflow.UnresolvedCount > 0,
                              "Every worker needs a person or a group before you can save",
                              !_cmpWfDirty,
                              "Nothing has changed yet",
                              cmpDetEditWorkflow.UnresolvedCount > 0,
                              "Save the workflow. Some rows still carry a role rather than a person",
                              "Save the edited workflow"
                          )
                        Width: =136
      - conAwScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Overlay
            Height: =Parent.Height
            Visible: =_cmpAwOpen
            Width: =Parent.Width
          Children:
            - btnAwDismiss:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =nfColor.Transparent
                  BorderThickness: =0
                  Color: =nfColor.Transparent
                  Fill: =nfColor.Transparent
                  FocusedBorderThickness: =0.5
                  Height: =Parent.Height
                  HoverBorderColor: =nfColor.Transparent
                  HoverColor: =nfColor.Transparent
                  HoverFill: =nfColor.Transparent
                  OnSelect: =Set(_cmpAwOpen, false)
                  PressedBorderColor: =nfColor.Transparent
                  PressedColor: =nfColor.Transparent
                  PressedFill: =nfColor.Transparent
                  Text: =""
                  Tooltip: ="Dismiss"
                  Width: =Parent.Width
      - conAwPanel:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =nfColor.Border
            BorderThickness: =nfSize.Border
            DropShadow: =DropShadow.ExtraBold
            Fill: =nfColor.Surface
            Height: =conAwHeader.Height + conAwBody.Height + conAwFooter.Height + 2 * nfSize.Border
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =nfRadius.Xl
            RadiusBottomRight: =nfRadius.Xl
            RadiusTopLeft: =nfRadius.Xl
            RadiusTopRight: =nfRadius.Xl
            Visible: =_cmpAwOpen
            Width: =Min(Parent.Width - 2 * nfSpace.Lg, 460)
            X: =(Parent.Width - Self.Width) / 2
            Y: =Max(nfSpace.Xl, (Parent.Height - Self.Height) / 2)
          Children:
            - conAwHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.Transparent
                  FillPortions: =0
                  Height: =nfSize.Row + 2 * nfSpace.Md
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =nfSpace.Sm
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =nfSpace.Md
                  PaddingLeft: =nfSpace.Md
                  PaddingRight: =nfSpace.Md
                  PaddingTop: =nfSpace.Md
                Children:
                  - lblAwTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =nfColor.TextStrong
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =nfType.Body
                        Text: |-
                          =If(_cmpAwEditId = 0, "Add Worker", "Edit Worker")
                          & "   "
                          & LookUp(colWfDraftPhases, ClientId = _cmpAwPhaseClientId).Title
                        Wrap: =false
                  - btnAwClose:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Close the worker dialog"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Color: =nfColor.TextMuted
                        FontWeight: =FontWeight.Bold
                        Height: =nfSize.RowSm
                        Icon: ="Dismiss"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(_cmpAwOpen, false)
                        Size: =nfType.Small
                        Text: =""
                        Tooltip: ="Close without changing this worker"
                        Width: =32
            - shpAwRuleHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfColor.Border
                  FillPortions: =0
                  Height: =nfSize.Border
            - conAwBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.Transparent
                  FillPortions: =0
                  Height: |-
                    =Min(
                        6 * nfSize.Row + lblAwCurrent.Height
                        + 5 * Self.LayoutGap + Self.PaddingTop + Self.PaddingBottom,
                        // SIX CHILDREN, SO FIVE GAPS. The six rows are mode, current,
                        // picker, goal at DOUBLE height, department and options. Hand
                        // counted, and the one thing here that rots when a field is added.
                        // It fails safe: an undercount only grows the scrollbar that
                        // LayoutOverflowY already provides, it never clips.
                        App.Height - conAwHeader.Height - conAwFooter.Height - 4 * nfSpace.Xl
                    )
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =nfSpace.Md
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =nfSpace.Lg
                  PaddingLeft: =nfSpace.Md
                  PaddingRight: =nfSpace.Md
                  PaddingTop: =nfSpace.Lg
                Children:
                  - conAwMode:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =nfColor.Transparent
                        FillPortions: =0
                        Height: =nfSize.Row
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =nfSpace.Sm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnAwModePerson:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Assign a person"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: |-
                                =If(
                                    !_cmpAwIsGroup,
                                    ButtonAppearance.Primary,
                                    ButtonAppearance.Secondary
                                )
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(_cmpAwIsGroup, false);
                                Set(_cmpAwName, "");
                                Set(_cmpAwId, "");
                                Reset(cmbAwPerson)
                              Size: =nfType.Small
                              Text: ="Person"
                        - btnAwModeGroup:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Assign a group, not available yet"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: |-
                                =If(
                                    _cmpAwIsGroup,
                                    ButtonAppearance.Primary,
                                    ButtonAppearance.Secondary
                                )
                              DisplayMode: =DisplayMode.Disabled
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(_cmpAwIsGroup, true);
                                Set(_cmpAwName, "");
                                Set(_cmpAwId, "");
                                Reset(cmbAwPerson)
                              Size: =nfType.Small
                              Text: ="Group"
                              Tooltip: ="Group assignment is not wired up yet"
                  - lblAwCurrent:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfColor.TextMuted
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =nfType.Micro
                        Text: |-
                          =If(
                              IsBlank(_cmpAwId),
                              "No one assigned yet.",
                              "Assigned to " & _cmpAwName & "   " & _cmpAwId
                          )
                          // STATED IN WORDS, because the combo box below shows a blank input
                          // until someone picks. On an edit that would read as though the
                          // worker had no assignee, and the confirm button would look
                          // wrongly enabled.
                        VerticalAlign: =VerticalAlign.Top
                  - cmbAwPerson:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        AccessibleLabel: ="Search for a person"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        DelayOutput: |-
                          =true
                          // SearchText UPDATES ON A PAUSE, NOT PER KEYSTROKE. Without this,
                          // Items fires one Office365Users call per character typed, against
                          // a throttle that is per user per connection.
                        Height: =nfSize.Row
                        InputTextPlaceholder: |-
                          =If(
                              _cmpAwEditId = 0 || IsBlank(_cmpAwName),
                              "Search by name or email",
                              "Currently " & _cmpAwName & "  -  search only to change"
                          )
                          // THE PICKER OPENS BLANK ON AN EDIT AND THAT IS DELIBERATE: both entry
                          // points Reset this control so SearchText is empty and the directory
                          // slice appears. The cost was that an edit looked like it had LOST the
                          // assignee, so people reselected the same person to be safe.
                          //
                          // Nothing was lost. _cmpAwName and _cmpAwId are both seeded from the row
                          // by btnWfWkEdit, and Save writes them back untouched, so an edit that
                          // only changes the goal keeps the original assignee. This says so.
                          //
                          // NOT DefaultSelectedItems. Items is Office365Users.SearchUser, so a
                          // default would have to be a record of that exact shape; a partial one
                          // fails with "the table passed in has none of the expected columns",
                          // which is the same failure StagedFilesData hit on cmpFileUpload. The
                          // pac route does not validate formulas, so that would have shipped
                          // silently.
                        ItemDisplayText: |-
                          =ThisItem.DisplayName & "   -   " & ThisItem.Mail
                          // ItemDisplayText IS WHY THIS IS NOW THE MODERN CONTROL. The
                          // classic picker chooses its display columns from DisplayFields,
                          // and the Single, Double or Person TEMPLATE that lays them out
                          // lives at Layout, a sibling of Control, not under Properties.
                          // Nothing written under Properties can reach it, so a pasted
                          // classic picker always lands on Single and has to be repaired by
                          // hand. ItemDisplayText is a formula, so it is a Property, so it
                          // survives the paste.
                        Items: |-
                          =nfDirectory
                          // Self.SearchText EXPOSES THE TYPED TEXT as a property, so Items
                          // is a genuine directory search rather than a client side filter
                          // over a preloaded list. IsSearchable on its own only filters what
                          // the control was already given, which cannot reach a whole tenant.
                          //
                          // NO MINIMUM LENGTH. A blank searchTerm returns a default slice of
                          // the tenant, so the list is populated the moment the dialog opens
                          // rather than showing an empty box that gives no clue what it wants.
                          // DelayOutput above is what keeps this off a per keystroke call, so
                          // the two properties have to move together: turning DelayOutput off
                          // while this has no gate is one connector call per character.
                          //
                          // btnWfWkEdit and btnWfAddWorker both Reset this control before
                          // opening the dialog, so SearchText is blank on every open and the
                          // default slice is what appears first.
                          //
                          // Office365Users is a STANDARD connector, so this is safe in a
                          // collection only build too and drags nobody onto premium
                          // licensing.
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =If(
                              !IsBlank(Self.Selected.Mail),
                              Set(_cmpAwName, Self.Selected.DisplayName);
                              Set(_cmpAwId, Lower(Self.Selected.Mail))
                          )
                        SelectMultiple: |-
                          =false
                          // WRITTEN EXPLICITLY. The modern default is true, and a picker
                          // that silently accepts two people when the draft row holds one
                          // assignee is not a failure anyone notices until the flow runs.
                        Size: =nfType.Small
                  - txtAwGoal:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        AccessibleLabel: ="What this worker should do"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        Default: =_cmpAwGoal
                        Height: =2 * nfSize.Row
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxLength: =255
                        OnChange: =Set(_cmpAwGoal, Self.Text)
                        Placeholder: ="What should this worker do"
                        Size: =nfType.Small
                        Type: |-
                          =TextInputType.Multiline
                          // Type, NOT Mode. Mode with TextMode.MultiLine is the CLASSIC
                          // text input property and is rejected here.
                          //
                          // MaxLength stays at 255 to match the SharePoint Goal column. The
                          // taller box invites more text than the column can hold, and the
                          // truncation would happen silently in the flow.
                  - cmbAwDept:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        AccessibleLabel: ="Department"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        DefaultSelectedItems: =Filter(nfDepartments, ConfigKey = _cmpAwDept)
                        Height: =nfSize.Row
                        InputTextPlaceholder: ="Office"
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Title
                        Items: =nfDepartments
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(_cmpAwDept, Self.Selected.ConfigKey)
                        SelectMultiple: =false
                        Size: =nfType.Small
                  - conAwOpts:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =nfColor.Transparent
                        FillPortions: =0
                        Height: =nfSize.Row
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =nfSpace.Sm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnAwOrderDown:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Run earlier"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =If(_cmpAwOrder <= 1, DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Subtract"
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(_cmpAwOrder, Max(_cmpAwOrder - 1, 1))
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="Run earlier"
                              Width: =32
                        - lblAwOrder:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =true
                              Color: =nfColor.TextBody
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =nfType.Micro
                              Text: |-
                                ="Order "
                                & _cmpAwOrder
                              Width: =72
                              Wrap: =false
                        - btnAwOrderUp:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Run later"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Add"
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(_cmpAwOrder, Min(_cmpAwOrder + 1, 20))
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="Run later"
                              Width: =32
                        - btnAwDaysDown:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="One day fewer"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              DisplayMode: =If(_cmpAwDays <= 1, DisplayMode.Disabled, DisplayMode.Edit)
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Subtract"
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(_cmpAwDays, Max(_cmpAwDays - 1, 1))
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="One day fewer"
                              Width: =32
                        - lblAwDays:
                            Control: ModernText@1.0.0
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =true
                              Color: =nfColor.TextBody
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =nfType.Micro
                              Text: |-
                                =_cmpAwDays
                                & " days"
                              Width: =72
                              Wrap: =false
                        - btnAwDaysUp:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="One day more"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Secondary
                              FontWeight: =FontWeight.Bold
                              Height: =nfSize.RowSm
                              Icon: ="Add"
                              Layout: =ButtonLayout.IconOnly
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(_cmpAwDays, Min(_cmpAwDays + 1, 60))
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="One day more"
                              Width: =32
                        - chkAwRequired:
                            Control: ModernCheckbox@1.0.1
                            Properties:
                              AccessibleLabel: ="Aw Required"
                              AlignInContainer: =AlignInContainer.Center
                              Default: |-
                                =_cmpAwRequired
                                // Default, NOT Checked. Checked is the property name on the
                                // UPDATED Checkbox; ModernCheckbox@1.0.0 predates that rename
                                // and Studio rejects Checked with PA2108. If a newer version
                                // is available in this environment, bump it and rename this to
                                // Checked, which also brings Tooltip and a View mode that
                                // reads as read only rather than disabled.
                                //
                                // A REAL CHECKBOX IS SAFE HERE and was not safe in the gallery
                                // row on this version. The value is a DEFAULT rather than a
                                // binding, and this dialog never rebuilds a collection
                                // underneath itself, so the control is only re-evaluated when
                                // the host opens the dialog, and every open sets
                                // _cmpAwRequired before the panel becomes visible.
                              FillPortions: =1
                              Label: ="Required?"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnCheck: =Set(_cmpAwRequired, true)
                              OnUncheck: |-
                                =Set(_cmpAwRequired, false)
                                // OnCheck AND OnUncheck, NOT OnChange. The checkbox family
                                // raises the two separately and has no OnChange, so wiring
                                // only one leaves the flag stuck true once it has been set.
            - shpAwRuleFooter:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfColor.Border
                  FillPortions: =0
                  Height: =nfSize.Border
            - conAwFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.SurfaceAlt
                  FillPortions: =0
                  Height: =nfSize.Row + 2 * nfSpace.Md
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =nfSpace.Sm
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =nfSpace.Md
                  PaddingLeft: =nfSpace.Md
                  PaddingRight: =nfSpace.Md
                  PaddingTop: =nfSpace.Md
                  RadiusBottomLeft: =nfRadius.Xl
                  RadiusBottomRight: =nfRadius.Xl
                Children:
                  - btnAwCancel:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Cancel"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        FontWeight: =FontWeight.Semibold
                        Height: =nfSize.RowSm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(_cmpAwOpen, false)
                        Size: =nfType.Small
                        Text: ="Cancel"
                        Width: =104
                  - btnAwConfirm:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(_cmpAwEditId = 0, "Add Worker", "Save Worker")
                        AlignInContainer: =AlignInContainer.Center
                        DisplayMode: |-
                          =If(
                              IsBlank(_cmpAwId) || IsBlank(Trim(txtAwGoal.Text)),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        FontWeight: =FontWeight.Semibold
                        Height: =nfSize.RowSm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              _cmpAwEditId = 0,
                              Collect(
                                  colWfDraftWorkers,
                                  {
                                      ClientId: _cmpWfNextId,
                                      PhaseClientId: _cmpAwPhaseClientId,
                                      AssignmentKey: "",
                                      AssignmentOrder: _cmpAwOrder,
                                      AssigneeName: _cmpAwName,
                                      AssigneeEmail: If(_cmpAwIsGroup, "", _cmpAwId),
                                      DepartmentCode: _cmpAwDept,
                                      Goal: Trim(txtAwGoal.Text),
                                      Required: _cmpAwRequired,
                                      DurationDays: _cmpAwDays,
                                      IsGroup: _cmpAwIsGroup,
                                      GroupId: If(_cmpAwIsGroup, _cmpAwId, ""),
                                      StatusKey: "NotStarted",
                                      IsNew: true,
                                      IsRemoved: false
                                  }
                              );
                              Set(_cmpWfNextId, _cmpWfNextId + 1),
                              Patch(
                                  colWfDraftWorkers,
                                  LookUp(colWfDraftWorkers, ClientId = _cmpAwEditId),
                                  {
                                      AssignmentOrder: _cmpAwOrder,
                                      AssigneeName: _cmpAwName,
                                      AssigneeEmail: If(_cmpAwIsGroup, "", _cmpAwId),
                                      DepartmentCode: _cmpAwDept,
                                      Goal: Trim(txtAwGoal.Text),
                                      Required: _cmpAwRequired,
                                      DurationDays: _cmpAwDays,
                                      IsGroup: _cmpAwIsGroup,
                                      GroupId: If(_cmpAwIsGroup, _cmpAwId, "")
                                  }
                              )
                          );
                          Set(_cmpAwOpen, false);
                          Set(_cmpWfDirty, true);
                          Select(btnWfRebuild)
                          // _cmpAwId carries an email for a person and a group id for a
                          // group, and the split into two columns happens here so the
                          // picker above does not have to know the draft schema.
                          //
                          // DRAFT ONLY. No list write, no flow call. Canvas mints no
                          // AssignmentKey: a new row carries a blank key and a local
                          // ClientId.
                        Size: =nfType.Small
                        Text: =If(_cmpAwEditId = 0, "Add Worker", "Save Worker")
                        Tooltip: |-
                          =If(
                              IsBlank(_cmpAwId),
                              "Pick a person first",
                              IsBlank(Trim(txtAwGoal.Text)),
                              "Say what this worker should do",
                              "Apply this worker to the draft"
                          )
                        Width: =128
      - conPhScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Overlay
            Height: =Parent.Height
            Visible: =_cmpPhOpen
            Width: =Parent.Width
          Children:
            - btnPhDismiss:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =nfColor.Transparent
                  BorderThickness: =0
                  Color: =nfColor.Transparent
                  Fill: =nfColor.Transparent
                  FocusedBorderThickness: =0.5
                  Height: =Parent.Height
                  HoverBorderColor: =nfColor.Transparent
                  HoverColor: =nfColor.Transparent
                  HoverFill: =nfColor.Transparent
                  OnSelect: =Set(_cmpPhOpen, false)
                  PressedBorderColor: =nfColor.Transparent
                  PressedColor: =nfColor.Transparent
                  PressedFill: =nfColor.Transparent
                  Text: =""
                  Tooltip: ="Dismiss"
                  Width: =Parent.Width
      - conPhPanel:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =nfColor.Border
            BorderThickness: =nfSize.Border
            DropShadow: =DropShadow.ExtraBold
            Fill: =nfColor.Surface
            Height: =conPhHeader.Height + conPhBody.Height + conPhFooter.Height + 2 * nfSize.Border
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =nfRadius.Xl
            RadiusBottomRight: =nfRadius.Xl
            RadiusTopLeft: =nfRadius.Xl
            RadiusTopRight: =nfRadius.Xl
            Visible: =_cmpPhOpen
            Width: =Min(Parent.Width - 2 * nfSpace.Lg, 460)
            X: =(Parent.Width - Self.Width) / 2
            Y: =Max(nfSpace.Xl, (Parent.Height - Self.Height) / 2)
          Children:
            - conPhHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.Transparent
                  FillPortions: =0
                  Height: =nfSize.Row + 2 * nfSpace.Md
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =nfSpace.Sm
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =nfSpace.Md
                  PaddingLeft: =nfSpace.Md
                  PaddingRight: =nfSpace.Md
                  PaddingTop: =nfSpace.Md
                Children:
                  - lblPhTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =nfColor.TextStrong
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =nfType.Body
                        Text: ="Edit Phase"
                        Wrap: =false
                  - btnPhClose:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Close the phase dialog"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Color: =nfColor.TextMuted
                        FontWeight: =FontWeight.Bold
                        Height: =nfSize.RowSm
                        Icon: ="Dismiss"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(_cmpPhOpen, false)
                        Size: =nfType.Small
                        Text: =""
                        Tooltip: ="Close without renaming this phase"
                        Width: =32
            - shpPhRuleHeader:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfColor.Border
                  FillPortions: =0
                  Height: =nfSize.Border
            - conPhBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.Transparent
                  FillPortions: =0
                  Height: |-
                    =lblPhNameLabel.Height
                    + nfSize.Row
                    + lblPhGoalLabel.Height
                    + nfSize.Row
                    + 3 * Self.LayoutGap
                    + Self.PaddingTop
                    + Self.PaddingBottom
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =nfSpace.Sm
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =nfSpace.Lg
                  PaddingLeft: =nfSpace.Md
                  PaddingRight: =nfSpace.Md
                  PaddingTop: =nfSpace.Lg
                Children:
                  - lblPhNameLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfColor.TextMuted
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =nfType.Micro
                        Text: ="PHASE NAME"
                        Wrap: =false
                  - txtPhName:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        AccessibleLabel: ="Phase name"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        Default: =_cmpPhTitle
                        Height: =nfSize.Row
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxLength: =120
                        OnChange: =Set(_cmpPhTitle, Self.Text)
                        Placeholder: ="Name this phase"
                        Size: =nfType.Small
                  - lblPhGoalLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AccessibleLabel: =Self.Text
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =nfColor.TextMuted
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =nfType.Micro
                        Text: ="PHASE GOAL"
                        Wrap: =false
                  - txtPhGoal:
                      Control: ModernTextInput@1.1.1
                      Properties:
                        AccessibleLabel: ="Phase goal"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        Default: =_cmpPhGoal
                        Height: =nfSize.Row
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxLength: =255
                        OnChange: =Set(_cmpPhGoal, Self.Text)
                        Placeholder: ="What happens in this phase"
                        Size: =nfType.Small
            - shpPhRuleFooter:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =nfColor.Border
                  FillPortions: =0
                  Height: =nfSize.Border
            - conPhFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfColor.SurfaceAlt
                  FillPortions: =0
                  Height: =nfSize.Row + 2 * nfSpace.Md
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =nfSpace.Sm
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =nfSpace.Md
                  PaddingLeft: =nfSpace.Md
                  PaddingRight: =nfSpace.Md
                  PaddingTop: =nfSpace.Md
                  RadiusBottomLeft: =nfRadius.Xl
                  RadiusBottomRight: =nfRadius.Xl
                Children:
                  - btnPhCancel:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Cancel"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        FontWeight: =FontWeight.Semibold
                        Height: =nfSize.RowSm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(_cmpPhOpen, false)
                        Size: =nfType.Small
                        Text: ="Cancel"
                        Width: =104
                  - btnPhSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Save Phase"
                        AlignInContainer: =AlignInContainer.Center
                        DisplayMode: |-
                          =If(
                              IsBlank(Trim(_cmpPhTitle)),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        FontWeight: =FontWeight.Semibold
                        Height: =nfSize.RowSm
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Patch(
                              colWfDraftPhases,
                              LookUp(colWfDraftPhases, ClientId = _cmpPhClientId),
                              {
                                  Title: Trim(_cmpPhTitle),
                                  PhaseGoal: Trim(_cmpPhGoal)
                              }
                          );
                          Set(_cmpPhOpen, false);
                          Set(_cmpWfDirty, true);
                          Select(btnWfRebuild)
                          // DRAFT ONLY. A phase added in this session still carries a
                          // blank PhaseKey, and the receiver mints it on insert.
                        Size: =nfType.Small
                        Text: ="Save Phase"
                        Tooltip: ="Apply the phase name and goal to the draft"
                        Width: =128
