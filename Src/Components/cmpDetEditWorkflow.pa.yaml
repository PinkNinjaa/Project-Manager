                              OnSelect: |-
                                =Patch(
                                    colWfDraftPhases,
                                    LookUp(colWfDraftPhases, ClientId = ThisItem.PhaseClientId),
                                    { IsRemoved: true }
                                );
                                ForAll(
                                    Filter(colWfDraftWorkers, PhaseClientId = ThisItem.PhaseClientId) As w,
                                    Patch(colWfDraftWorkers, w, { IsRemoved: true })
                                );
                                ForAll(
                                    Sort(Filter(colWfDraftPhases, !IsRemoved), PhaseOrder) As p,
                                    Patch(
                                        colWfDraftPhases,
                                        p,
                                        {
                                            PhaseOrder: CountRows(
                                                Filter(colWfDraftPhases, !IsRemoved, PhaseOrder <= p.PhaseOrder)
                                            )
                                        }
                                    )
                                );
                                Set(_cmpWfDirty, true);
                                Set(
                                    _cmpWfExpanded,
                                    Coalesce(First(Filter(colWfDraftPhases, !IsRemoved, !IsLocked)).ClientId, 0)
                                );
                                Select(btnWfRebuild)
                                // Deleting a phase CASCADES to its workers and PhaseOrder is
                                // renumbered contiguously so the receiver never sees gaps. Both
                                // are soft: IsRemoved rows survive so Save can say what to
                                // delete.
                              Size: =nfType.Small
                              Text: =""
                              Tooltip: ="Delete this phase and its workers"
                              Visible: =!ThisItem.IsLocked
                              Width: =36
                              X: =Parent.Width - 44
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnWfPhTap:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =nfColor.Transparent
                              BorderThickness: =0
                              Color: =nfColor.Transparent
                              Fill: =nfColor.Transparent
                              FocusedBorderThickness: =0.5
                              Height: =Parent.Height - 2 * nfSize.FocusRing
                              HoverBorderColor: =nfColor.Transparent
                              HoverColor: =nfColor.Transparent
                              HoverFill: =nfColor.Transparent
                              OnSelect: |-
                                =Set(
                                    _cmpWfExpanded,
                                    If(ThisItem.IsExpanded, 0, ThisItem.PhaseClientId)
                                );
                                Select(btnWfRebuild)
                              PressedBorderColor: =nfColor.Transparent
                              PressedColor: =nfColor.Transparent
                              PressedFill: =nfColor.Transparent
                              Text: =""
                              Tooltip: =If(ThisItem.IsExpanded, "Collapse this phase", "Expand this phase")
                              Width: |-
                                =Max(
                                    48,
                                    Parent.Width
                                        - 48
                                        - If(
                                              Parent.Width >= 660, 444,
                                              Parent.Width >= 580, 336,
                                              212
                                          )
                                )
                              X: =48
                              Y: =nfSize.FocusRing
                  - conWfRowWorker:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: |-
                          =If(
                              IsBlank(ThisItem.AssigneeEmail) && IsBlank(ThisItem.GroupId),
                              nfColor.WarnBorder,
                              nfColor.Border
                          )
                        BorderThickness: =nfSize.Border
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              IsBlank(ThisItem.AssigneeEmail) && IsBlank(ThisItem.GroupId),
                              nfColor.WarnFill,
                              nfColor.Canvas
                          )
                        Height: =Parent.TemplateHeight - nfSpace.Sm
                        RadiusBottomLeft: =nfRadius.Md
                        RadiusBottomRight: =nfRadius.Md
                        RadiusTopLeft: =nfRadius.Md
                        RadiusTopRight: =nfRadius.Md
                        Visible: =ThisItem.RowType = "worker"
                        Width: =Parent.TemplateWidth - 2 * nfSpace.Lg - nfSpace.Xxl
                        X: =nfSpace.Lg + nfSpace.Xxl
                        Y: =nfSpace.Xs
                      Children:
                        - conWfWkOrder:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =nfColor.BorderStrong
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Surface
                              Height: =nfSize.IconLg
                              RadiusBottomLeft: =nfRadius.Sm
                              RadiusBottomRight: =nfRadius.Sm
                              RadiusTopLeft: =nfRadius.Sm
                              RadiusTopRight: =nfRadius.Sm
                              Width: =nfSize.IconLg
                              X: =nfSpace.Md
                              Y: =(Parent.Height - Self.Height) / 2
                            Children:
                              - lblWfWkOrder:
                                  Control: ModernText@1.0.0
