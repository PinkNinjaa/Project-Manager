                                          AccessibleLabel: ="Recent list"
                                          FillPortions: =0
                                          Height: =Self.AllItemsCount * Self.TemplateHeight
                                          Items: =nfDashRecent
                                          LayoutMinHeight: =0
                                          ShowScrollbar: =false
                                          TabIndex: =0
                                          TemplatePadding: =0
                                          TemplateSize: =64
                                        Children:
                                          - conDashRecentRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                Height: =Parent.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =nfSpace.Md
                                                PaddingLeft: =nfSpace.Lg
                                                PaddingRight: =nfSpace.Sm
                                                Width: =Parent.TemplateWidth - 4
                                                X: =2
                                              Children:
                                                - conDashRecentTitle:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =nfSpace.Xxs
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - lblDashRecentTitle:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextStrong
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Body
                                                            Text: =ThisItem.Title
                                                            Wrap: =false
                                                      - lblDashRecentKey:
                                                          Control: ModernText@1.0.0
                                                          Properties:
                                                            AccessibleLabel: =Self.Text
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =true
                                                            Color: =nfColor.TextFaint
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Size: =nfType.Caption
                                                            Text: =ThisItem.RequestKey
                                                            Wrap: =false
                                                - lblDashRecentStatus:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Align: =Align.Center
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: |-
                                                        =Switch(
                                                            LookUp(nfStatusTable, StatusKey = ThisItem.StatusKey).BadgeColor,
                                                            "green", nfBadgeGreen.Text,
                                                            "amber", nfBadgeAmber.Text,
                                                            "red",   nfBadgeRed.Text,
                                                            nfBadgeSlate.Text
                                                        )
                                                      Fill: |-
                                                        =Switch(
                                                            LookUp(nfStatusTable, StatusKey = ThisItem.StatusKey).BadgeColor,
                                                            "green", nfBadgeGreen.Fill,
                                                            "amber", nfBadgeAmber.Fill,
                                                            "red",   nfBadgeRed.Fill,
                                                            nfBadgeSlate.Fill
                                                        )
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =4
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      PaddingTop: =4
                                                      RadiusBottomLeft: =nfRadius.Pill
                                                      RadiusBottomRight: =nfRadius.Pill
                                                      RadiusTopLeft: =nfRadius.Pill
                                                      RadiusTopRight: =nfRadius.Pill
                                                      Size: =nfType.Caption
                                                      Text: =LookUp(nfStatusTable, StatusKey = ThisItem.StatusKey).Title
                                                      Visible: =!nfIsMobile
                                                      Width: =104
                                                      Wrap: =false
                                                - lblDashRecentProgress:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextMuted
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Caption
                                                      Text: |-
                                                        =With(
                                                            {
                                                                total: Coalesce(ThisItem.PhaseCount, 0)
                                                            },
                                                            If(
                                                                total = 0,
                                                                "No phases",
                                                                "Phase " & ThisItem.CurrentPhaseOrder & "/" & total
                                                            )
                                                        )
                                                      Visible: =nfIsDesktop
                                                      Width: =92
                                                      Wrap: =false
                                                - lblDashRecentCreated:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextMuted
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Caption
                                                      Text: =nfDay(ThisItem.Created)
                                                      Visible: =nfIsDesktop
                                                      Width: =92
                                                      Wrap: =false
                                                - conDashRecentOpen:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: =nfSize.RowSm
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Width: =nfSize.HitTarget
                                                    Children:
                                                      - imgDashRecentOpen:
                                                          Control: Image@2.2.3
                                                          Properties:
                                                            AccessibleLabel: ="Dash Recent Open icon"
                                                            FocusedBorderThickness: =0.5
                                                            Height: =nfSize.Icon
                                                            Image: ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='#64748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 18 15 12 9 6'/></svg>")
                                                            TabIndex: =0
                                                            Width: =nfSize.Icon
                                                            X: =(Parent.Width - Self.Width) / 2
                                                            Y: =(Parent.Height - Self.Height) / 2
                                                      - btnDashRecentOpen:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            BorderColor: =nfColor.Transparent
                                                            BorderThickness: =0
                                                            Color: =nfColor.Transparent
                                                            Fill: =nfColor.Transparent
                                                            FocusedBorderThickness: =0.5
                                                            Height: =Parent.Height
                                                            HoverBorderColor: =nfColor.Transparent
                                                            HoverColor: =nfColor.Transparent
                                                            HoverFill: =nfColor.Transparent
                                                            OnSelect: |-
                                                              =Navigate(
                                                                  scrDetails,
                                                                  ScreenTransition.None,
                                                                  {
                                                                      locRequestKey: ThisItem.RequestKey,
                                                                      locOriginScreen: "scrHome"
                                                                  }
                                                              )
                                                            PressedBorderColor: =nfColor.Transparent
                                                            PressedColor: =nfColor.Transparent
                                                            PressedFill: =nfColor.Transparent
                                                            Text: =""
                                                            Tooltip: ="Open request"
                                                            Width: =Parent.Width
                        - conDashBottomBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Surface
                              FillPortions: =0
                              Height: =nfHeights.bottomNav + nfSpace.Lg
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =nfHeights.bottomNav
                              LayoutMinWidth: =0
                              PaddingBottom: =nfSpace.Md
                              PaddingTop: =nfSpace.Xs
                              Visible: =!nfIsDesktop
                            Children:
                              - cmpDashBottomNav:
                                  Control: CanvasComponent
                                  ComponentName: cmpBottomNavigation
                                  Properties:
                                    ActiveColor: =nfColor.Primary
                                    ActiveColorHex: =If(nfIsDark, "3B82F6", "2563EB")
                                    ActiveIndicator: ="bar"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BadgeColor: =nfColor.DangerSolid
                                    FillPortions: =1
                                    InactiveColorHex: =If(nfIsDark, "94A3B8", "64748B")
                                    Items: |-
                                      =ForAll(
                                          nfNavMobile As m,
                                          {
                                              Icon: m.Icon,
                                              Label: m.Label,
                                              Badge: If(
                                                  m.ID = 2,
                                                  nfMyOpenCount,
                                                  0
                                              )
                                          }
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(
                                          _cmpNavSelID,
                                          LookUp(nfNavMobile, Idx = cmpDashBottomNav.SelectedItemIndex).ID
                                      );
                                      nfRoute(_cmpNavSelID)
                                    SelectedIndex: =Coalesce(LookUp(nfNavMobile, ID = _cmpNavSelID).Idx, 1)
                                    ShowLabels: ="always"
                                    Theme: =nfThemeName
      - conDashNavHost:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Sidebar
            Height: =Parent.Height
            Visible: =nfIsDesktop
            Width: =cmpSidebar_1.Width
          Children:
            - cmpSidebar_1:
                Control: CanvasComponent
                ComponentName: cmpSidebar
                Properties:
                  AccentColor: =nfColor.Primary
                  AppLogo: =
                  AppName: ="DocRouter"
                  AppNameAccent: =""
                  Expanded: =true
                  Height: =Parent.Height
                  Icons: =nfSidebarIcons
                  Items: |-
                    =Table(
                        { ID: 1,  Title: "Home",         Icon: "Home",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 2,  Title: "My Tasks",     Icon: "CheckSquare",     Letter: "",
                          Badge: nfMyOpenCount,
                          BadgeColor: nfColor.DangerSolid, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 3,  Title: "All Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 7,  Title: "My Requests", Icon: "Folder",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: 3, Visible: true },
                        { ID: 4,  Title: "Reports",      Icon: "Chart",    Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 90, Title: "",             Icon: "",         Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: true,  ParentID: -1, Visible: true },
                        { ID: 5,  Title: "Settings",     Icon: "Settings", Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true },
                        { ID: 6,  Title: "Help",         Icon: "Help",     Letter: "", Badge: 0,
                          BadgeColor: nfColor.Transparent, BadgeDot: false, IsSection: false, ParentID: -1, Visible: true }
                    )
                  OnFooterSettings: =
                  OnHelp: =
                  OnNavSelect: =nfRoute(cmpSidebar_1.SelectedID)
                  OnThemeToggle: |-
                    =Patch(
                        colUserPrefs,
                        First(colUserPrefs),
                        { ThemeName: If(nfIsDark, "Light", "Dark") }
                    );
                    ClearCollect(
                        colUserPrefs,
                        Filter(colUserPrefs, UserEmail = Lower(nfUserEmail))
                    )
                  OnToggle: =
                  ShowFooterMenu: =true
                  ShowHeader: =true
                  ShowSearch: =false
                  ShowToggle: =true
                  ShowUser: =true
                  Theme: =If(nfIsDark, "Light", "Dark")
                  Width: =If(_cmpNavIsExpanded, 260, 64)
      - cmpDashFab:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =nfColor.Primary
            Disabled: =false
            Height: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      _fabSize + 12 + CountRows(Self.SpeedDialItems) * Self.ItemSize,
                      _fabSize
                  )
              )
            Icon: ="Plus"
            IconColor: ="#FFFFFF"
            ItemSize: =52
            Label: ="New Request"
            OnSelect: =Navigate(scrNewRequest, ScreenTransition.None)
            OnSpeedDialSelect: =false
            Size: ="regular"
            SpeedDialItems: |-
              =FirstN(
                  Table({ Icon: "Plus", Label: "New Request", Color: nfColor.Primary }),
                  0
              )
            Style: ="standard"
            Theme: =nfThemeName
            Visible: =!nfIsDesktop
            Width: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      ),
                      _iconSize: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 24,
                          "large", 36,
                          24
                      ),
                      _labelPad: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 28,
                          "large", 36,
                          28
                      ),
                      _maxLabelChars: If(
                          CountRows(Self.SpeedDialItems) > 0,
                          Max(Self.SpeedDialItems, Len(Label)),
                          0
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      Min(
                          Min(_maxLabelChars * 8 + 64, 240) + _labelPad + 20,
                          App.Width
                      ),
                      If(
                          Self.Style = "extended",
                          16 + _iconSize + 8 + Min(Len(Self.Label) * 8, 220) + 20,
                          _fabSize
                      )
                  )
              )
            X: =Parent.Width - Self.Width - nfSpace.Xl
            Y: =Parent.Height - Self.Height - (nfSpace.Xxl + nfHeights.bottomNav)
