      - cmpSetFab:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =nfColor.Primary
            Disabled: =false
            Height: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      _fabSize + 12 + CountRows(Self.SpeedDialItems) * Self.ItemSize,
                      _fabSize
                  )
              )
            Icon: ="Plus"
            IconColor: |-
              ="#FFFFFF"
              // WITH the hash on this component: it wraps the whole SVG in
              // EncodeUrl and escapes the hash itself.
            ItemSize: =52
            Label: ="New Request"
            OnSelect: =Navigate(scrNewRequest, ScreenTransition.None)
            OnSpeedDialSelect: =false
            Size: ="regular"
            SpeedDialItems: |-
              =FirstN(
                  Table({ Icon: "Plus", Label: "New Request", Color: nfColor.Primary }),
                  0
              )
            Style: ="standard"
            Theme: =nfThemeName
            Visible: =!nfIsDesktop
            Width: |-
              =With(
                  {
                      _fabSize: Switch(
                          Self.Size,
                          "small", 40,
                          "regular", 56,
                          "large", 72,
                          56
                      ),
                      _iconSize: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 24,
                          "large", 36,
                          24
                      ),
                      _labelPad: Switch(
                          Self.Size,
                          "small", 20,
                          "regular", 28,
                          "large", 36,
                          28
                      ),
                      _maxLabelChars: If(
                          CountRows(Self.SpeedDialItems) > 0,
                          Max(Self.SpeedDialItems, Len(Label)),
                          0
                      )
                  },
                  If(
                      _fabOpen && CountRows(Self.SpeedDialItems) > 0,
                      Min(
                          Min(_maxLabelChars * 8 + 64, 240) + _labelPad + 20,
                          App.Width
                      ),
                      If(
                          Self.Style = "extended",
                          16 + _iconSize + 8 + Min(Len(Self.Label) * 8, 220) + 20,
                          _fabSize
                      )
                  )
              )
            X: =Parent.Width - Self.Width - nfSpace.Xl
            Y: =Parent.Height - Self.Height - (nfSpace.Xxl + nfHeights.bottomNav)
      - cmpSetEditWorkflow:
          Control: CanvasComponent
          ComponentName: cmpDetEditWorkflow
          Properties:
            Height: =App.Height
            OnCancel: |-
              =UpdateContext({ locSetWfOpen: false })
              // NO RESTORE, UNLIKE THE NEW REQUEST WIZARD. Cancel clears the draft
              // and that is correct here: the blueprint is still in SharePoint
              // untouched and the next open reloads it from there. The wizard needs
              // a snapshot because its draft is the only copy in existence.
            OnSave: |-
              =With(
                  { _key: drpSetWfCategory.Selected.DefaultTemplateKey },
                  Patch(
                      colTemplates,
                      LookUp(colTemplates, TemplateKey = _key),
                      {
                          DefinitionJson:
                              "{""phases"":["
                              & Concat(
                                  Sort(Filter(colWfDraftPhases, !IsRemoved), PhaseOrder) As p,
                                  "{""order"":" & p.PhaseOrder
                                  & ",""name"":" & JSON(p.Title)
                                  & ",""goal"":" & JSON(p.PhaseGoal)
                                  & ",""assignments"":["
                                  & Concat(
                                      Sort(Filter(colWfDraftWorkers, PhaseClientId = p.ClientId, !IsRemoved), AssignmentOrder) As a,
                                      "{""order"":" & a.AssignmentOrder
                                      & ",""role"":" & JSON(a.AssigneeName)
                                      & ",""deptCode"":" & JSON(a.DepartmentCode)
                                      & ",""goal"":" & JSON(a.Goal)
                                      & ",""required"":" & If(a.Required, "true", "false")
                                      & ",""durationDays"":" & a.DurationDays
                                      & ",""isGroup"":" & If(a.IsGroup, "true", "false")
                                      & "}",
                                      ","
                                  )
                                  & "]}",
                                  ","
                              )
                              & "]}"
                      }
                  )
              );
              ClearCollect(
                  colTemplates,
                  ShowColumns(
                      Filter(colTemplates, Active = true),
                      TemplateKey, Title, Description, DefinitionJson
                  )
              );
              UpdateContext({ locSetWfOpen: false, locSetWfSaved: true })
              // THE DRAFT SERIALISED BACK TO THE BLUEPRINT SHAPE. The reverse of what
              // btnWfLoadTemplate does on the way in, and the two have to stay in
              // step: order, name, goal, assignments, and per assignment order, role,
              // deptCode, goal, required, durationDays, isGroup.
              //
              // THE REQUEST ONLY COLUMNS ARE DROPPED, NOT BLANKED. ClientId and
              // PhaseClientId are local join keys, PhaseKey and AssignmentKey belong
              // to a real request, StatusKey and IsLocked describe progress a
              // blueprint has not made. Writing any of them would put request state
              // into a template and it would be cloned into every future request.
              //
              // role COMES FROM AssigneeName. On the way in the loader puts the
              // template's role into AssigneeName because that is the draft column
              // the editor renders; this puts it back. A template carries no email
              // and none is written, which is why this instance sets
              // RequireResolved false.
              //
              // JSON() ON EVERY TEXT VALUE, not manual quoting. It emits the
              // surrounding quotes AND escapes quotes, backslashes and newlines. A
              // goal containing an apostrophe or a quote mark is ordinary and would
              // otherwise produce a payload that ParseJSON cannot read back, which
              // fails at the NEXT load rather than at save.
              //
              // Numbers and booleans are concatenated bare and deliberately: JSON()
              // on a number is fine but If(a.Required, "true", "false") is explicit
              // about emitting a JSON literal rather than a quoted string, and
              // Boolean(a.required) on the way back in expects the literal.
              //
              // Refresh BEFORE the re-read is not optional. Power Apps caches the
              // source, so without it colTemplates comes back with the OLD payload
              // and the phase count under the picker does not move.
              //
              // ShowColumns MIRRORS App.OnStart exactly. colTemplates is read by the
              // New Request category tiles as well, and a different column set here
              // would give the same collection two shapes depending on which screen
              // last wrote it.
            RequestKey: |-
              =""
              // NO REQUEST. This edits the blueprint new requests are cloned FROM,
              // so LoadDraft starts from empty and LoadTemplate fills it.
            RequireResolved: |-
              =false
              // A BLUEPRINT HAS ROLES, NOT PEOPLE. Every template assignment is
              // unresolved by definition, so the default true would disable Save
              // permanently on this screen.
            SeedTemplateKey: =drpSetWfCategory.Selected.DefaultTemplateKey
            Visible: =Coalesce(locSetWfOpen, false)
            Width: =App.Width
