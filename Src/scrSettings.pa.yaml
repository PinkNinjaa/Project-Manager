Screens:
  scrSettings:
    Properties:
      Fill: =nfColor.Canvas
      OnVisible: |-
        =Set(_cmpNavSelID, 5);
        UpdateContext({
            locSetSection: Coalesce(locSetSection, "notifications"),
            locSetWfOpen: false,
            locSetWfSaved: false
        })
        // BOTH WORKFLOW FLAGS ARE DECLARED HERE, and the declaration is the reason
        // as much as the reset. A context variable is only recognised on a screen
        // that SETS it; reading one that no UpdateContext names fails with "Name
        // isn't valid", which reads like a typo rather than a missing declaration.
        //
        // locSetSection keeps its Coalesce so the chosen tab survives a round trip
        // to another screen. The two workflow flags deliberately do NOT: an editor
        // left open, or a stale saved confirmation, should not come back with you.
    Children:
      - conSetRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfColor.Canvas
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingLeft: =If(nfIsDesktop, conSetNavHost.Width, 0)
            Width: =Parent.Width
          Children:
            - conSetMiddle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conSetRight:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conSetTopBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderStyle: =If(nfIsMobile, BorderStyle.None, BorderStyle.Solid)
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =If(nfIsMobile, nfColor.Transparent, nfColor.Surface)
                              FillPortions: =0
                              Height: =nfHeights.topBar
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(nfIsMobile, nfSpace.Sm, nfSpace.Md)
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMaxHeight: =nfHeights.topBar
                              LayoutMinHeight: =nfHeights.topBar
                              LayoutMinWidth: =0
                              PaddingRight: =If(nfIsMobile, nfSpace.Md, nfSpace.Xxl)
                            Children:
                              - conSetTitleGroup:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =2.5
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - cmpSetCrumbs:
                                        Control: CanvasComponent
                                        ComponentName: cmpBreadcrumbs
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          CharWidths: =nfCharWidths
                                          Config: |-
                                            ={
                                                Theme: If(nfIsDark, "dark", "light"),
                                                SeparatorIcon: "chevron",
                                                Gap: 4,
                                                Size: nfType.ChromeTitle,
                                                MaxItems: 4,
                                                ItemsBeforeCollapse: 1,
                                                ItemsAfterCollapse: 2,
                                                ActiveLastItem: false,
                                                BackButton: false
                                            }
                                          CurrentColor: |-
                                            =If(
                                                nfIsDark,
                                                "#F1F5F9",
                                                "#1E293B"
                                            )
                                          Height: =nfHeights.breadcrumb
                                          Icons: =nfBreadcrumbIcons
                                          Items: |-
                                            =Table(
                                                { id: "home", label: "Home" },
                                                { id: "settings", label: "Settings" }
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LinkColor: |-
                                            =If(
                                                nfIsDark,
                                                "#94A3B8",
                                                "#64748B"
                                            )
                                          OnBack: =false
                                          OnSelect: |-
                                            =If(
                                                Self.SelectedItem.id = "home",
                                                Navigate(scrHome, ScreenTransition.None)
                                            )
                                          Width: =Parent.Width
                              - cmpSetBell:
                                  Control: CanvasComponent
                                  ComponentName: Badge
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BadgeColor: =nfColor.DangerSolid
                                    BadgeCount: =0
                                    HasNotifications: =false
                                    Height: =Self.Size
                                    HoverText: ="Notifications"
                                    IconColor: =""
                                    IconSvg: =""
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =false
                                      // INERT ON PURPOSE. Same reason as scrHome: CLAUDE.md
                                      // open question 2 is unresolved and colAudit is the wrong
                                      // shape. Do NOT bind this to colAudit.
                                    Size: =If(nfIsMobile, 32, 35)
                                    Theme: =nfThemeName
                                    Width: =Self.Size
                              - conSetAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Primary
                                    FillPortions: =0
                                    Height: =nfHeights.avatar
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =nfHeights.avatar / 2
                                    RadiusBottomRight: =nfHeights.avatar / 2
                                    RadiusTopLeft: =nfHeights.avatar / 2
                                    RadiusTopRight: =nfHeights.avatar / 2
                                    Width: =nfHeights.avatar
                                  Children:
                                    - lblSetInitials:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          Color: =nfColor.TextOnPrimary
                                          FontWeight: =FontWeight.Bold
                                          Height: =Parent.Height
                                          Size: =nfType.Initials
                                          Text: =nfInitials
                                          Width: =Parent.Width
                                          Wrap: =false
                        - conSetGutter:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Canvas
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =nfSpace.Lg
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingLeft: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingRight: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              PaddingTop: =If(nfIsDesktop, nfSpace.Xxl, nfSpace.Lg)
                              Width: =Parent.Width
                            Children:
                              - conSetHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    FillPortions: =0
                                    Height: |-
                                      =lblSetTitle.Height + lblSetSubtitle.Height + Self.LayoutGap
                                      // SUMS ITS CHILDREN NOW THAT THEY AutoHeight. It was
                                      // nfType.PageTitle + nfType.Body + 3 * nfSpace.Sm, which is a
                                      // guess at what two labels would render as, and a font size
                                      // guess is wrong the moment a token moves. With AutoHeight on
                                      // both, .Height reports the box that actually rendered.
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =nfSpace.Xxs
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - lblSetTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Start
                                          AutoHeight: =true
                                          Color: =nfColor.TextStrong
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =If(nfIsDesktop, nfType.PageTitle, nfType.SectionHead)
                                          Text: ="Settings"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lblSetSubtitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          AlignInContainer: =AlignInContainer.Start
                                          AutoHeight: =true
                                          Color: =nfColor.TextMuted
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =nfType.Body
                                          Text: ="Manage your account and preferences"
                                          Width: =Parent.Width
                                          Wrap: =false
                              - conSetBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =nfColor.Transparent
                                    Height: |-
                                      =With(
                                          {
                                              _panel:
                                                  2 * nfSpace.Xl
                                                  + If(
                                                      Coalesce(locSetSection, "notifications") = "appearance",
                                                      nfSize.RowSm + 4 * nfSpace.Md + 2 * nfType.SectionHead + 2 * nfSize.Row,
                                                      nfSize.RowSm + 9 * nfSpace.Md + 5 * nfSize.RowLg + 4 * nfSize.Border
                                                  ),
                                              _nav: 2 * nfSize.Row + nfSpace.Sm
                                          },
                                          If(nfIsDesktop, Max(_panel, _nav), _nav + nfSpace.Lg + _panel)
                                      )
                                    LayoutDirection: =If(nfIsDesktop, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                    LayoutGap: =nfSpace.Lg
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Min(Parent.Width - If(nfIsMobile, 2 * nfSpace.Lg, 2 * nfSpace.Xxl), nfPageMaxW)
                                  Children:
                                    - conSetNav:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Transparent
                                          FillPortions: =0
                                          Height: |-
                                            =If(
                                                CountRows(nfMyTemplateCategories) > 0,
                                                3 * nfSize.Row + 2 * Self.LayoutGap,
                                                2 * nfSize.Row + Self.LayoutGap
                                            )
                                            // COUNTED AND CONDITIONAL, NOT HARDCODED. This was
                                            // 2 * nfSize.Row for the two original buttons, so adding
                                            // Workflows put the third one outside its container,
                                            // where it rendered as nothing at all.
                                            //
                                            // BOTH ARMS EXIST because the Workflows item is hidden
                                            // for a non admin. A flat three row height would leave a
                                            // row of dead space under the nav for everybody else.
                                            //
                                            // THE GATE IS THE SAME EXPRESSION btnSetNavWorkflow.Visible
                                            // uses, so the height cannot disagree with what is on
                                            // screen. Self.LayoutGap rather than a repeated token, so
                                            // the gap and the height cannot drift apart either.
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Sm
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =If(nfIsDesktop, 240, Parent.Width)
                                        Children:
                                          - btnSetNavNotif:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =Align.Left
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "notifications",
                                                      ButtonAppearance.Secondary,
                                                      ButtonAppearance.Subtle
                                                  )
                                                Color: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "notifications",
                                                      nfColor.Primary,
                                                      nfColor.TextBody
                                                  )
                                                FontWeight: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "notifications",
                                                      FontWeight.Semibold,
                                                      FontWeight.Normal
                                                  )
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({ locSetSection: "notifications" })
                                                RadiusBottomLeft: =nfRadius.Md
                                                RadiusBottomRight: =nfRadius.Md
                                                RadiusTopLeft: =nfRadius.Md
                                                RadiusTopRight: =nfRadius.Md
                                                Size: =nfType.Body
                                                Text: ="Notifications"
                                          - btnSetNavAppear:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =Align.Left
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "appearance",
                                                      ButtonAppearance.Secondary,
                                                      ButtonAppearance.Subtle
                                                  )
                                                Color: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "appearance",
                                                      nfColor.Primary,
                                                      nfColor.TextBody
                                                  )
                                                FontWeight: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "appearance",
                                                      FontWeight.Semibold,
                                                      FontWeight.Normal
                                                  )
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({ locSetSection: "appearance" })
                                                RadiusBottomLeft: =nfRadius.Md
                                                RadiusBottomRight: =nfRadius.Md
                                                RadiusTopLeft: =nfRadius.Md
                                                RadiusTopRight: =nfRadius.Md
                                                Size: =nfType.Body
                                                Text: ="Appearance"
                                          - btnSetNavWorkflow:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =Align.Left
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "workflow",
                                                      ButtonAppearance.Secondary,
                                                      ButtonAppearance.Subtle
                                                  )
                                                Color: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "workflow",
                                                      nfColor.Primary,
                                                      nfColor.TextBody
                                                  )
                                                FontWeight: |-
                                                  =If(
                                                      Coalesce(locSetSection, "notifications") = "workflow",
                                                      FontWeight.Semibold,
                                                      FontWeight.Normal
                                                  )
                                                Height: =nfSize.Row
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({ locSetSection: "workflow" })
                                                RadiusBottomLeft: =nfRadius.Md
                                                RadiusBottomRight: =nfRadius.Md
                                                RadiusTopLeft: =nfRadius.Md
                                                RadiusTopRight: =nfRadius.Md
                                                Size: =nfType.Body
                                                Text: ="Workflows"
                                                Visible: |-
                                                  =CountRows(nfMyTemplateCategories) > 0
                                                  // THE WHOLE SECTION IS HIDDEN FROM NON ADMINS rather than shown
                                                  // disabled. A disabled tab invites someone to ask why they cannot
                                                  // use it; an absent one asks nothing. Everybody sees the other two.
                                    - conSetPanel:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =nfColor.Border
                                          BorderThickness: =nfSize.Border
                                          DropShadow: =DropShadow.None
                                          Fill: =nfColor.Surface
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =nfSpace.Md
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =nfSpace.Xl
                                          PaddingLeft: =nfSpace.Xl
                                          PaddingRight: =nfSpace.Xl
                                          PaddingTop: =nfSpace.Xl
                                          RadiusBottomLeft: =nfRadius.Lg
                                          RadiusBottomRight: =nfRadius.Lg
                                          RadiusTopLeft: =nfRadius.Lg
                                          RadiusTopRight: =nfRadius.Lg
                                        Children:
                                          - conSetNotif:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                FillPortions: =0
                                                Height: |-
                                                  =lblSetNotifHead.Height
                                                  + conSetRowTaskAssigned.Height
                                                  + conSetRowTaskCompleted.Height
                                                  + conSetRowComments.Height
                                                  + conSetRowDueReminders.Height
                                                  + conSetRowWeeklySummary.Height
                                                  + 4 * nfSize.Border
                                                  + 9 * Self.LayoutGap
                                                  // SUMS THE ROWS RATHER THAN ASSUMING THEY ARE ALL
                                                  // nfSize.RowLg. They are not any more: each row now
                                                  // grows with its own description, so a hardcoded
                                                  // 5 * RowLg clipped the panel by however much the
                                                  // longest description overran.
                                                  //
                                                  // The four borders are the dividers between the five
                                                  // rows, and the nine gaps are the head plus five rows
                                                  // plus four dividers, which is ten children.
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =nfSpace.Md
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Visible: =Coalesce(locSetSection, "notifications") = "notifications"
                                              Children:
                                                - lblSetNotifHead:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Start
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextStrong
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingTop: =0
                                                      Size: =nfType.SectionHead
                                                      Text: ="Notification Preferences"
                                                      Width: =Parent.Width
                                                      Wrap: =false
                                                - conSetRowTaskAssigned:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =Max(conSetTextTaskAssigned.Height, nfSize.Row)
                                                        // GROWS WITH ITS TEXT rather than pinning nfSize.RowLg. A
                                                        // two line description plus a label is about 59px against a
                                                        // 56px row, so the fixed height clipped the descender of the
                                                        // second line. The floor keeps a one line row from collapsing
                                                        // under the toggle beside it.
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =nfSpace.Md
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - conSetTextTaskAssigned:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Center
                                                            DropShadow: =DropShadow.None
                                                            Fill: =nfColor.Transparent
                                                            Height: |-
                                                              =lblSetLblTaskAssigned.Height
                                                              + lblSetDscTaskAssigned.Height
                                                              + Self.LayoutGap
                                                              // WITHOUT AN EXPLICIT Height THIS RENDERS AT 200px.
                                                              // A container that states no height gets the silent
                                                              // platform default, and 200 is nothing anybody chose.
                                                              // Studio had already materialised exactly that.
                                                              //
                                                              // Summing the children is only correct because both
                                                              // labels now carry AutoHeight, so .Height reports the
                                                              // box that actually rendered rather than a number
                                                              // somebody assigned and the text then overflowed.
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =nfSpace.Xxs
                                                            LayoutJustifyContent: =LayoutJustifyContent.Center
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                          Children:
                                                            - lblSetLblTaskAssigned:
                                                                Control: ModernText@1.0.0
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Start
                                                                  AutoHeight: =true
                                                                  Color: =nfColor.TextStrong
                                                                  FontWeight: =FontWeight.Semibold
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingTop: =0
                                                                  Size: =nfType.Body
                                                                  Text: ="Task Assignments"
                                                                  Width: =Parent.Width
                                                                  Wrap: =false
                                                            - lblSetDscTaskAssigned:
                                                                Control: ModernText@1.0.0
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Start
                                                                  AutoHeight: =true
                                                                  Color: =nfColor.TextMuted
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingTop: =0
                                                                  Size: =nfType.Small
                                                                  Text: ="When a task is assigned to you"
                                                                  Width: =Parent.Width
                                                      - tglSetTaskAssigned:
                                                          Control: ModernToggle@1.0.0
                                                          Properties:
                                                            AccessibleLabel: ="Task Assignments"
                                                            AlignInContainer: =AlignInContainer.Center
                                                            BasePaletteColor: =nfColor.Primary
                                                            Color: =nfColor.TextBody
                                                            Default: =Coalesce(First(colUserPrefs).taskAssigned, false)
                                                            FontWeight: =""
                                                            Height: =nfSize.RowSm
                                                            LabelPosition: ="After"
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            OnCheck: |-
                                                              =Patch(colUserPrefs, First(colUserPrefs), { taskAssigned: true });
                                                              ClearCollect(colUserPrefs, Filter(colUserPrefs, UserEmail = Lower(nfUserEmail)))
                                                            OnUncheck: |-
                                                              =Patch(colUserPrefs, First(colUserPrefs), { taskAssigned: false });
                                                              ClearCollect(colUserPrefs, Filter(colUserPrefs, UserEmail = Lower(nfUserEmail)))
                                                            Size: =nfType.Body
                                                            Width: =nfSize.RowLg
                                                - conSetDivTaskAssigned:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Divider
                                                      FillPortions: =0
                                                      Height: =nfSize.Border
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                - conSetRowTaskCompleted:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =nfColor.Transparent
                                                      FillPortions: =0
                                                      Height: |-
                                                        =Max(conSetTextTaskCompleted.Height, nfSize.Row)
                                                        // GROWS WITH ITS TEXT rather than pinning nfSize.RowLg. A
                                                        // two line description plus a label is about 59px against a
                                                        // 56px row, so the fixed height clipped the descender of the
                                                        // second line. The floor keeps a one line row from collapsing
                                                        // under the toggle beside it.
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =nfSpace.Md
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                    Children:
                                                      - conSetTextTaskCompleted:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Center
                                                            DropShadow: =DropShadow.None
                                                            Fill: =nfColor.Transparent
                                                            Height: |-
                                                              =lblSetLblTaskCompleted.Height
                                                              + lblSetDscTaskCompleted.Height
                                                              + Self.LayoutGap
                                                              // WITHOUT AN EXPLICIT Height THIS RENDERS AT 200px.
                                                              // A container that states no height gets the silent
                                                              // platform default, and 200 is nothing anybody chose.
                                                              // Studio had already materialised exactly that.
                                                              //
                                                              // Summing the children is only correct because both
                                                              // labels now carry AutoHeight, so .Height reports the
                                                              // box that actually rendered rather than a number
                                                              // somebody assigned and the text then overflowed.
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutGap: =nfSpace.Xxs
                                                            LayoutJustifyContent: =LayoutJustifyContent.Center
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                          Children:
                                                            - lblSetLblTaskCompleted:
                                                                Control: ModernText@1.0.0
                                                                Properties:
                                                                  AccessibleLabel: =Self.Text
                                                                  AlignInContainer: =AlignInContainer.Start
                                                                  AutoHeight: =true
                                                                  Color: =nfColor.TextStrong
