                                                - lblSetWfSub:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextMuted
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Small
                                                      Text: |-
                                                        ="Editing a blueprint changes what NEW requests of this type start from. Requests already running are untouched, because their phases were copied when they were created."
                                                        // SAID OUT LOUD BECAUSE IT IS THE FIRST THING ANYONE ASKS.
                                                        // Phases and assignments are cloned into RequestPhases and
                                                        // RequestAssignments when a template is applied, so a
                                                        // blueprint edit is not retroactive. Without this line an
                                                        // admin has to guess whether they are about to disturb live
                                                        // work, and the safe guess is to not touch it.
                                                      VerticalAlign: =VerticalAlign.Top
                                                - lblSetWfPick:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextBody
                                                      FontWeight: =FontWeight.Semibold
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Caption
                                                      Text: ="Request type"
                                                      Wrap: =false
                                                - drpSetWfCategory:
                                                    Control: ModernDropdown@1.0.2
                                                    Properties:
                                                      AccessibleLabel: ="Request type to edit the workflow for"
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      Color: =nfColor.TextStrong
                                                      Default: =First(nfMyTemplateCategories)
                                                      Height: =nfSize.Row
                                                      ItemDisplayText: =ThisItem.Title
                                                      Items: =nfMyTemplateCategories
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnChange: |-
                                                        =UpdateContext({ locSetWfSaved: false })
                                                        // THE SAVED CONFIRMATION IS PER TEMPLATE. Leaving it up after
                                                        // switching type would report a save against the wrong one.
                                                      Size: =nfType.Body
                                                - lblSetWfCurrent:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextMuted
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Small
                                                      Text: |-
                                                        =With(
                                                            { _t: LookUp(colTemplates, TemplateKey = drpSetWfCategory.Selected.DefaultTemplateKey) },
                                                            If(
                                                                IsBlank(_t.TemplateKey),
                                                                "This type points at a template that does not exist. Nothing to edit until that is fixed in the Config list.",
                                                                _t.Title
                                                                & "   -   "
                                                                & CountRows(Table(ParseJSON(_t.DefinitionJson).phases))
                                                                & " phases"
                                                            )
                                                        )
                                                        // TESTED ON TemplateKey, NOT ON Title, for the same reason the
                                                        // category tiles are: a template that exists with a blank name
                                                        // is a different defect from one that does not exist, and
                                                        // Coalesce on Title reports the first as the second.
                                                      VerticalAlign: =VerticalAlign.Top
                                                - btnSetWfEdit:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      AccessibleLabel: ="Edit this request type's workflow"
                                                      AlignInContainer: =AlignInContainer.Start
                                                      Color: =nfColor.TextOnPrimary
                                                      DisplayMode: |-
                                                        =If(
                                                            IsBlank(LookUp(colTemplates, TemplateKey = drpSetWfCategory.Selected.DefaultTemplateKey).TemplateKey),
                                                            DisplayMode.Disabled,
                                                            DisplayMode.Edit
                                                        )
                                                      Height: =nfSize.Row
                                                      Layout: =ButtonLayout.TextOnly
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =UpdateContext({ locSetWfSaved: false });
                                                        Set(_cmpWfSeedKey, "");
                                                        cmpSetEditWorkflow.LoadDraft();
                                                        cmpSetEditWorkflow.LoadTemplate();
                                                        UpdateContext({ locSetWfOpen: true })
                                                        // LoadDraft THEN LoadTemplate, the same pair and the same
                                                        // order the New Request wizard uses. RequestKey is "" on this
                                                        // instance too, so LoadDraft clears the draft and
                                                        // LoadTemplate fills it from SeedTemplateKey.
                                                        //
                                                        // NO SNAPSHOT NEEDED HERE, unlike the wizard. Cancel clears
                                                        // the draft and that is CORRECT on this screen: the blueprint
                                                        // still exists in SharePoint untouched, and the next open
                                                        // reloads it. The wizard needed a snapshot precisely because
                                                        // it had nothing to reload from.
                                                      RadiusBottomLeft: =nfRadius.Md
                                                      RadiusBottomRight: =nfRadius.Md
                                                      RadiusTopLeft: =nfRadius.Md
                                                      RadiusTopRight: =nfRadius.Md
                                                      Size: =nfType.Small
                                                      Text: ="Edit workflow"
                                                      Tooltip: |-
                                                        =If(
                                                            IsBlank(LookUp(colTemplates, TemplateKey = drpSetWfCategory.Selected.DefaultTemplateKey).TemplateKey),
                                                            "This request type points at no template",
                                                            "Edit the phases and roles new requests of this type start from"
                                                        )
                                                      Width: =168
                                                - lblSetWfSaved:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =nfColor.SuccessText
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Small
                                                      Text: ="Saved. New requests of this type will use the updated workflow."
                                                      VerticalAlign: =VerticalAlign.Top
                                                      Visible: =Coalesce(locSetWfSaved, false)
                                          - conSetWfNone:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =nfColor.Transparent
                                                FillPortions: =0
                                                Height: =lblSetWfNone.Height
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =nfSpace.Md
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Visible: |-
                                                  =Coalesce(locSetSection, "notifications") = "workflow"
                                                  && CountRows(nfMyTemplateCategories) = 0
                                                  // UNREACHABLE BY THE NAV, WHICH IS THE POINT. The Workflows button
                                                  // is hidden for a non admin, so nobody navigates here. It exists
                                                  // for the case where somebody's Admins entry is removed while they
                                                  // are standing on the section, which would otherwise leave a blank
                                                  // panel with no explanation.
                                              Children:
                                                - lblSetWfNone:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =nfColor.TextMuted
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =nfType.Body
                                                      Text: ="You do not administer any request type, so there is no workflow here to edit."
                                                      VerticalAlign: =VerticalAlign.Top
                        - conSetBottomBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfColor.Border
                              BorderThickness: =nfSize.Border
                              DropShadow: =DropShadow.None
                              Fill: =nfColor.Surface
                              FillPortions: =0
                              Height: =nfHeights.bottomNav + nfSpace.Lg
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =nfSpace.Sm
                              PaddingTop: =nfSpace.Sm
                              Visible: =!nfIsDesktop
                            Children:
                              - cmpSetBottomNav:
                                  Control: CanvasComponent
                                  ComponentName: cmpBottomNavigation
                                  Properties:
                                    ActiveColor: =nfColor.Primary
                                    ActiveColorHex: =If(nfIsDark, "3B82F6", "2563EB")
                                    ActiveIndicator: ="bar"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BadgeColor: =nfColor.DangerSolid
                                    FillPortions: =1
                                    InactiveColorHex: =If(nfIsDark, "94A3B8", "64748B")
                                    Items: |-
                                      =ForAll(
                                          nfNavMobile As m,
                                          {
                                              Icon: m.Icon,
                                              Label: m.Label,
                                              Badge: If(
                                                  m.ID = 2,
                                                  nfMyOpenCount,
                                                  0
                                              )
                                          }
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(
                                          _cmpNavSelID,
                                          LookUp(nfNavMobile, Idx = Self.SelectedItemIndex).ID
                                      );
                                      nfRoute(_cmpNavSelID)
                                    SelectedIndex: =Coalesce(LookUp(nfNavMobile, ID = _cmpNavSelID).Idx, 3)
                                    ShowLabels: ="always"
                                    Theme: =nfThemeName
      - conSetNavHost:
