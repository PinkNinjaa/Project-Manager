<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ProjectDesk — a standalone, in-memory project management mockup."
    />
    <meta name="color-scheme" content="light dark" />
    <title>ProjectDesk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M7 8h10M7 12h7M7 16h4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>

    <div id="app" class="app-shell">
      <div id="sidebar-root"></div>
      <div class="main">
        <header id="topbar-root"></header>
        <main id="view" class="page" tabindex="-1"></main>
      </div>
    </div>

    <div id="mobile-nav-root"></div>
    <div id="backdrop" class="backdrop" hidden></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <div class="noscript">ProjectDesk needs JavaScript enabled to run this mockup.</div>
    </noscript>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
